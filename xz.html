<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星空导航 | 公告中心</title>
<style>
    /* ========== 全局重置 ========== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
        background: #03050b;
        color: #fff;
    }

    /* 星空 + 流星雨画布 */
    #starCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
        pointer-events: none;
    }

    /* 主容器：内容浮层（不要加 backdrop-filter/filter/opacity） */
    .main-container {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 4.5rem 1.5rem 3rem;
        overflow-y: auto;
        overflow-x: hidden;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
    }

    /* ========== 标题区 ========== */
    .title-section {
        text-align: center;
        margin-bottom: 2.8rem;
        flex: none;
        animation: floatUp 1s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
    }

    .main-title {
        font-size: clamp(1.9rem, 7vw, 3.4rem);
        font-weight: 700;
        background: linear-gradient(135deg, #FFFFFF, #C0E0FF, #AAD0FF);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        text-shadow: 0 0 20px rgba(170, 208, 255, 0.5);
        letter-spacing: 3px;
    }

    .subtitle {
        font-size: clamp(0.85rem, 3vw, 1.05rem);
        opacity: 0.75;
        margin-top: 0.7rem;
        letter-spacing: 3px;
        font-weight: 300;
        display: inline-block;
        padding: 0 1rem;
    }

    /* ========== 公告列表 ========== */
    .notice-list {
        width: 100%;
        max-width: 840px;
        display: flex;
        flex-direction: column;
        gap: 1.35rem;
        flex: none;
    }

    /* 液态玻璃卡片 */
    .notice-card {
        position: relative;
        width: 100%;
        padding: 1.55rem 1.8rem 1.35rem;
        border-radius: 26px;
        background: rgba(255, 255, 255, 0.05);
        border: none;
        overflow: hidden;
        cursor: default;
        box-shadow:
            inset  0.5px  0    0 0 rgba(255, 255, 255, 0.35),
            inset -0.5px  0    0 0 rgba(255, 255, 255, 0.18),
            inset  0      0.5px 0 0 rgba(255, 255, 255, 0.50),
            inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.22),
            0 10px 30px rgba(0, 0, 0, 0.38);
        transition:
            transform 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1),
            box-shadow 0.35s ease,
            background-color 0.35s ease;
        animation: cardIn 0.75s cubic-bezier(0.2, 0.9, 0.4, 1.1) backwards;
        animation-delay: calc(var(--order, 0) * 0.09s);
    }

    /* 顶部一线高光 */
    .notice-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 14%;
        right: 14%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        pointer-events: none;
    }

    /* 左侧强调光条 */
    .notice-card::after {
        content: '';
        position: absolute;
        left: 0;
        top: 22%;
        bottom: 22%;
        width: 2px;
        border-radius: 2px;
        background: linear-gradient(180deg, transparent, var(--accent, rgba(150, 200, 255, 0.85)), transparent);
        opacity: 0.85;
        pointer-events: none;
    }

    .notice-card:hover {
        transform: translateY(-4px);
        background: rgba(255, 255, 255, 0.078);
        box-shadow:
            inset  0.5px  0    0 0 rgba(255, 255, 255, 0.55),
            inset -0.5px  0    0 0 rgba(255, 255, 255, 0.30),
            inset  0      0.5px 0 0 rgba(255, 255, 255, 0.75),
            inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.35),
            0 20px 40px rgba(0, 0, 0, 0.45),
            0 0 30px rgba(140, 190, 255, 0.22);
    }

    .no-glass .notice-card {
        background: rgba(40, 60, 100, 0.42);
        box-shadow:
            inset 0 0 0 1px rgba(255, 255, 255, 0.32),
            0 10px 30px rgba(0, 0, 0, 0.4);
    }

    /* 卡片头部 */
    .notice-head {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
    }

    .notice-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex: none;
        padding: 3px 11px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 1px;
        line-height: 1.5;
        color: var(--accent, #9fd0ff);
        background: color-mix(in srgb, var(--accent, #9fd0ff) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--accent, #9fd0ff) 42%, transparent);
        box-shadow: 0 0 16px color-mix(in srgb, var(--accent, #9fd0ff) 20%, transparent);
    }

    .badge-pin    { --accent: #ffd98a; }
    .badge-update { --accent: #9fd0ff; }
    .badge-event  { --accent: #9dffd0; }
    .badge-notice { --accent: #c9b3ff; }

    .notice-title {
        font-size: clamp(1rem, 3.4vw, 1.18rem);
        font-weight: 600;
        letter-spacing: 0.6px;
        line-height: 1.5;
        color: #ffffff;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.55);
        flex: 1 1 auto;
        min-width: 0;
    }

    .notice-body {
        font-size: clamp(0.83rem, 2.9vw, 0.93rem);
        line-height: 1.85;
        font-weight: 300;
        letter-spacing: 0.3px;
        color: rgba(218, 231, 255, 0.76);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    }

    .notice-meta {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-top: 1rem;
        font-size: 0.75rem;
        letter-spacing: 1px;
        color: rgba(186, 208, 240, 0.55);
    }

    .meta-sep {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: rgba(186, 208, 240, 0.45);
        flex: none;
    }

    /* 涟漪 */
    .ripple-effect {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 75%);
        transform: scale(0);
        opacity: 1;
        z-index: 2;
    }

    /* ========== 底部 ========== */
    .footer-note {
        margin-top: 2.8rem;
        font-size: 0.78rem;
        text-align: center;
        letter-spacing: 1px;
        opacity: 0.6;
        background: rgba(0, 0, 0, 0.22);
        padding: 0.55rem 1.4rem;
        border-radius: 40px;
        display: inline-block;
        pointer-events: none;
        flex: none;
    }

    /* ========== 回到顶部 ========== */
    .to-top {
        position: fixed;
        right: 22px;
        bottom: 26px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.05rem;
        color: #fff;
        background: rgba(255, 255, 255, 0.07);
        cursor: pointer;
        z-index: 20;
        opacity: 0;
        pointer-events: none;
        transform: translateY(12px);
        transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), background-color 0.3s ease;
        box-shadow:
            inset  0.5px  0    0 0 rgba(255, 255, 255, 0.35),
            inset -0.5px  0    0 0 rgba(255, 255, 255, 0.18),
            inset  0      0.5px 0 0 rgba(255, 255, 255, 0.50),
            inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.22),
            0 10px 26px rgba(0, 0, 0, 0.38);
    }

    .to-top.show {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
    }

    .to-top:hover {
        background: rgba(255, 255, 255, 0.13);
        box-shadow:
            inset  0.5px  0    0 0 rgba(255, 255, 255, 0.6),
            0 14px 30px rgba(0, 0, 0, 0.45),
            0 0 22px rgba(140, 190, 255, 0.35);
    }

    .to-top:active {
        transform: translateY(2px) scale(0.96);
    }

    /* ========== 移动端 ========== */
    @media (max-width: 680px) {
        .main-container {
            padding: 3rem 1rem 2.4rem;
        }
        .title-section {
            margin-bottom: 2rem;
        }
        .notice-card {
            padding: 1.25rem 1.25rem 1.1rem;
            border-radius: 22px;
        }
        .notice-list {
            gap: 1rem;
        }
        .to-top {
            right: 16px;
            bottom: 18px;
            width: 42px;
            height: 42px;
        }
    }

    /* ========== 滚动条 ========== */
    .main-container::-webkit-scrollbar { width: 5px; }
    .main-container::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
    }
    .main-container::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.4);
        border-radius: 10px;
    }

    /* ========== 动画 ========== */
    @keyframes floatUp {
        0%   { opacity: 0; transform: translateY(40px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
        0%   { opacity: 0; transform: translateY(26px) scale(0.985); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }
</style>
</head>
<body>

    <!-- 星空 + 流星雨画布 -->
    <canvas id="starCanvas"></canvas>

    <!-- 主内容区 -->
    <div class="main-container" id="mainContainer">

        <div class="title-section">
            <div class="main-title">✦ 公告中心 ✦</div>
            <div class="subtitle">星际通讯 · 实时同步</div>
        </div>

        <section class="notice-list" id="noticeList"></section>

        <div class="footer-note">🌟 公告持续更新中 · 感谢每一次同行</div>
    </div>

    <!-- 回到顶部 -->
    <button class="to-top liquid-glass" id="toTop" data-glass-radius="23" aria-label="回到顶部">↑</button>

<script>
(function () {
    "use strict";

    /* ============================================================
       第一部分：Snell 折射算法（液体玻璃核心）
       ============================================================ */

    function calculateRefractionProfile(glassThickness, bezelWidth, heightFn, ior, samples) {
        samples = samples || 128;
        var eta = 1 / ior;
        function refract(nx, ny) {
            var dot = ny;
            var k = 1 - eta * eta * (1 - dot * dot);
            if (k < 0) return null;
            var sq = Math.sqrt(k);
            return [-(eta * dot + sq) * nx, eta - (eta * dot + sq) * ny];
        }
        var profile = new Float64Array(samples);
        for (var i = 0; i < samples; i++) {
            var x = i / samples;
            var y = heightFn(x);
            var dx = x < 1 ? 0.0001 : -0.0001;
            var y2 = heightFn(x + dx);
            var deriv = (y2 - y) / dx;
            var mag = Math.sqrt(deriv * deriv + 1);
            var ref = refract(-deriv / mag, -1 / mag);
            if (!ref) { profile[i] = 0; continue; }
            profile[i] = ref[0] * ((y * bezelWidth + glassThickness) / ref[1]);
        }
        return profile;
    }

    function squircleSurface(t) {
        return Math.pow(1 - Math.pow(1 - t, 4), 0.25);
    }

    function generateDisplacementMap(w, h, radius, bezelWidth, profile, maxDisp) {
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        var img = ctx.createImageData(w, h);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
            d[i] = 128; d[i + 1] = 128; d[i + 2] = 0; d[i + 3] = 255;
        }
        var r = Math.min(radius, Math.min(w, h) / 2 - 1);
        if (r <= 0) return c.toDataURL();
        var clampedBezel = Math.min(bezelWidth, r - 1);
        if (clampedBezel <= 1) return c.toDataURL();
        var rSq = r * r;
        var r1Sq = (r + 1) * (r + 1);
        var rBSq = Math.max(r - clampedBezel, 0) * Math.max(r - clampedBezel, 0);
        var wB = w - r * 2;
        var hB = h - r * 2;
        var S = profile.length;
        if (wB < 0 || hB < 0) return c.toDataURL();

        for (var y1 = 0; y1 < h; y1++) {
            for (var x1 = 0; x1 < w; x1++) {
                var dx, dy;
                if (x1 < r) { dx = x1 - r; }
                else if (x1 >= w - r) { dx = x1 - r - wB; }
                else { dx = 0; }
                if (y1 < r) { dy = y1 - r; }
                else if (y1 >= h - r) { dy = y1 - r - hB; }
                else { dy = 0; }
                var dSq = dx * dx + dy * dy;
                if (dSq > r1Sq || dSq < rBSq) continue;
                var dist = Math.sqrt(dSq);
                var fromSide = r - dist;
                var op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
                if (op <= 0 || dist === 0) continue;
                var cos = dx / dist;
                var sin = dy / dist;
                var bi = Math.min(Math.floor((fromSide / clampedBezel) * S), S - 1);
                var disp = profile[bi] || 0;
                var dX = (-cos * disp) / maxDisp;
                var dY = (-sin * disp) / maxDisp;
                var idx = (y1 * w + x1) * 4;
                d[idx]     = Math.min(255, Math.max(0, (128 + dX * 127 * op + 0.5) | 0));
                d[idx + 1] = Math.min(255, Math.max(0, (128 + dY * 127 * op + 0.5) | 0));
            }
        }
        ctx.putImageData(img, 0, 0);
        return c.toDataURL();
    }

    function generateSpecularMap(w, h, radius, bezelWidth, angle) {
        angle = angle != null ? angle : Math.PI / 3;
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        var img = ctx.createImageData(w, h);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
            d[i] = 0; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = 0;
        }
        var r = Math.min(radius, Math.min(w, h) / 2 - 1);
        if (r <= 0) return c.toDataURL();
        var clampedBezel = Math.min(bezelWidth, r - 1);
        if (clampedBezel <= 1) return c.toDataURL();
        var rSq = r * r;
        var r1Sq = (r + 1) * (r + 1);
        var rBSq = Math.max(r - clampedBezel, 0) * Math.max(r - clampedBezel, 0);
        var wB = w - r * 2;
        var hB = h - r * 2;
        var lightVec = [Math.cos(angle), Math.sin(angle)];

        for (var y1 = 0; y1 < h; y1++) {
            for (var x1 = 0; x1 < w; x1++) {
                var dx, dy;
                if (x1 < r) { dx = x1 - r; }
                else if (x1 >= w - r) { dx = x1 - r - wB; }
                else { dx = 0; }
                if (y1 < r) { dy = y1 - r; }
                else if (y1 >= h - r) { dy = y1 - r - hB; }
                else { dy = 0; }
                var dSq = dx * dx + dy * dy;
                if (dSq > r1Sq || dSq < rBSq) continue;
                var dist = Math.sqrt(dSq);
                var fromSide = r - dist;
                var op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
                if (op <= 0 || dist === 0) continue;
                var cos = dx / dist;
                var sin = -dy / dist;
                var dot = Math.abs(cos * lightVec[0] + sin * lightVec[1]);
                var edge = Math.sqrt(Math.max(0, 1 - Math.pow(1 - fromSide, 2)));
                var coeff = dot * edge;
                var col = (255 * coeff) | 0;
                var alpha = Math.min(255, Math.max(0, (col * coeff * op * 0.85) | 0));
                var idx = (y1 * w + x1) * 4;
                d[idx] = col; d[idx + 1] = col; d[idx + 2] = col; d[idx + 3] = alpha;
            }
        }
        ctx.putImageData(img, 0, 0);
        return c.toDataURL();
    }

    function buildSVGFilter(filterId, dispUrl, specUrl, scale, w, h, specOpacity) {
        specOpacity = specOpacity != null ? specOpacity : 0.3;
        var fc = '';
        fc += '<feImage href="' + dispUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="disp_map" />';
        fc += '<feDisplacementMap in="SourceGraphic" in2="disp_map" scale="' + scale +
              '" xChannelSelector="R" yChannelSelector="G" result="displaced" />';
        if (specUrl) {
            fc += '<feImage href="' + specUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="spec_layer" />';
            fc += '<feComposite in="displaced" in2="spec_layer" operator="in" result="spec_masked" />';
            fc += '<feComponentTransfer in="spec_layer" result="spec_faded">' +
                  '<feFuncA type="linear" slope="' + specOpacity + '" /></feComponentTransfer>';
            fc += '<feBlend in="spec_masked" in2="displaced" mode="screen" result="with_spec" />';
            fc += '<feBlend in="spec_faded" in2="with_spec" mode="screen" />';
        }
        return fc;
    }

    /* ============================================================
       第二部分：公告数据 & 渲染
       ============================================================ */

    const notices = [
        {
            tag: '置顶', type: 'pin',
            title: '没做好',
            body: '占位符这是',
            date: '2026-03-18', author: '系统公告'
        }
    ];

    const noticeList = document.getElementById('noticeList');

    function renderNotices() {
        if (!noticeList) return;
        noticeList.innerHTML = '';

        notices.forEach(function (item, i) {
            const card = document.createElement('article');
            card.className = 'notice-card liquid-glass';
            card.style.setProperty('--order', i);
            card.dataset.glassRadius = '26';

            const head = document.createElement('div');
            head.className = 'notice-head';

            const badge = document.createElement('span');
            badge.className = 'notice-badge badge-' + item.type;
            badge.textContent = item.tag;

            const title = document.createElement('h2');
            title.className = 'notice-title';
            title.textContent = item.title;

            head.appendChild(badge);
            head.appendChild(title);

            const body = document.createElement('p');
            body.className = 'notice-body';
            body.textContent = item.body;

            const meta = document.createElement('div');
            meta.className = 'notice-meta';
            meta.innerHTML =
                '<span>' + item.date + '</span>' +
                '<span class="meta-sep"></span>' +
                '<span>' + item.author + '</span>';

            card.appendChild(head);
            card.appendChild(body);
            card.appendChild(meta);

            card.addEventListener('mousedown', createRipple);
            card.addEventListener('touchstart', createRipple, { passive: true });

            noticeList.appendChild(card);
        });
    }

    function createRipple(e) {
        const host = e.currentTarget;
        if (host.querySelector('.ripple-effect')) return;

        let clientX, clientY;
        if (e.touches && e.touches.length) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        const rect = host.getBoundingClientRect();
        const diameter = Math.max(rect.width, rect.height) * 1.4;
        const radius = diameter / 2;
        const x = clientX - rect.left - radius;
        const y = clientY - rect.top - radius;

        const ripple = document.createElement('span');
        ripple.className = 'ripple-effect';
        Object.assign(ripple.style, {
            width: diameter + 'px',
            height: diameter + 'px',
            left: x + 'px',
            top: y + 'px',
            transition: 'transform 0.6s ease-out, opacity 0.7s ease'
        });
        host.appendChild(ripple);

        requestAnimationFrame(function () {
            ripple.style.transform = 'scale(2.4)';
            ripple.style.opacity = '0';
        });
        setTimeout(function () {
            if (ripple.parentNode) ripple.remove();
        }, 720);
    }

    /* ============================================================
       第三部分：液态玻璃注入
       ============================================================ */

    const GLASS = {
        THICKNESS: 64,          // 玻璃厚度
        IOR: 2.35,              // 折射率
        BEZEL_RATIO: 0.52,      // 边缘宽度占圆角比例
        BEZEL_MAX: 18,          // 边缘宽度上限
        SPECULAR_OPACITY: 0.22, // 高光强度
        SPECULAR_ANGLE: Math.PI * 0.75,
        BLUR: 0.35,
        SCALE_RATIO: 0.52
    };

    let defsEl = null;

    function ensureSVG() {
        let svg = document.getElementById('lg-svg');
        if (!svg) {
            svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('id', 'lg-svg');
            svg.setAttribute('width', '0');
            svg.setAttribute('height', '0');
            svg.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;');
            svg.setAttribute('color-interpolation-filters', 'sRGB');
            svg.setAttribute('aria-hidden', 'true');
            document.body.appendChild(svg);
        }
        defsEl = svg.querySelector('defs');
        if (!defsEl) {
            defsEl = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            svg.appendChild(defsEl);
        }
    }

    function writeFilter(id, filterHTML) {
        if (!defsEl) return;
        const old = defsEl.querySelector('#' + id);
        if (old) old.remove();
        if (!filterHTML) return;
        const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
        filter.setAttribute('id', id);
        filter.setAttribute('x', '0%');
        filter.setAttribute('y', '0%');
        filter.setAttribute('width', '100%');
        filter.setAttribute('height', '100%');
        filter.innerHTML = filterHTML;
        defsEl.appendChild(filter);
    }

    function applyGlassTo(el, index) {
        const w = Math.round(el.offsetWidth);
        const h = Math.round(el.offsetHeight);
        if (w < 8 || h < 8) return;

        const maxRadius = Math.min(w, h) / 2 - 1;
        let radius = parseFloat(el.dataset.glassRadius || '0');
        if (!radius || isNaN(radius)) radius = maxRadius;
        radius = Math.min(radius, maxRadius);
        if (radius <= 1) return;

        const bezel = Math.min(radius * GLASS.BEZEL_RATIO, GLASS.BEZEL_MAX, radius - 1);
        if (bezel <= 1) return;

        const profile = calculateRefractionProfile(
            GLASS.THICKNESS, bezel, squircleSurface, GLASS.IOR, 128
        );

        let maxDisp = 0;
        for (let k = 0; k < profile.length; k++) {
            const a = Math.abs(profile[k]);
            if (a > maxDisp) maxDisp = a;
        }
        if (maxDisp < 0.001) maxDisp = 1;
        const scale = maxDisp * GLASS.SCALE_RATIO;

        const dispUrl = generateDisplacementMap(w, h, radius, bezel, profile, maxDisp);
        let specUrl = '';
        if (GLASS.SPECULAR_OPACITY > 0.001) {
            specUrl = generateSpecularMap(w, h, radius, bezel * 2.2, GLASS.SPECULAR_ANGLE);
        }

        const id = 'lg-filter-' + index;
        writeFilter(id, buildSVGFilter(id, dispUrl, specUrl, scale, w, h, GLASS.SPECULAR_OPACITY));

        let bf = 'url(#' + id + ')';
        if (GLASS.BLUR > 0) bf += ' blur(' + GLASS.BLUR.toFixed(1) + 'px)';

        el.style.setProperty('backdrop-filter', bf, 'important');
        el.style.setProperty('-webkit-backdrop-filter', bf, 'important');
    }

    function buildLiquidGlass() {
        const els = document.querySelectorAll('.liquid-glass');
        els.forEach(function (el, i) {
            applyGlassTo(el, i);
        });
    }

    /* ============================================================
       第四部分：星空 + 全区域随机方向流星雨（时间戳驱动，跨帧率一致）
       ============================================================ */

    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const STAR_COUNT = 220;
    let width = 0, height = 0;

    const meteors = [];
    const MAX_METEORS = 3;

    let nextMeteorTime = 0;
    let burstRemaining = 0;
    let nextBurstShotTime = 0;
    let nextBurstCheckTime = 0;

    function scheduleNextMeteor(now) {
        nextMeteorTime = now + 2500 + Math.random() * 5500;
    }
    function scheduleNextBurstShot(now) {
        nextBurstShotTime = now + 200 + Math.random() * 600;
    }

    function initStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2.2 + 0.8,
                alpha: Math.random() * 0.5 + 0.3,
                speed: 0.002 + Math.random() * 0.008,
                offset: Math.random() * Math.PI * 2
            });
        }
    }

    function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initStars();
    }

    function spawnMeteor(speedBoost, now) {
        if (meteors.length >= MAX_METEORS) return;

        const baseSpeed = 320 + Math.random() * 420;
        const speed = speedBoost ? baseSpeed * 1.4 : baseSpeed;
        const pad = 120;

        const edge = Math.floor(Math.random() * 4);
        let startX, startY;
        if (edge === 0) {
            startX = Math.random() * width;  startY = -pad;
        } else if (edge === 1) {
            startX = width + pad;            startY = Math.random() * height;
        } else if (edge === 2) {
            startX = Math.random() * width;  startY = height + pad;
        } else {
            startX = -pad;                   startY = Math.random() * height;
        }

        const targetX = width  * (0.1 + Math.random() * 0.8);
        const targetY = height * (0.1 + Math.random() * 0.8);
        const dx = targetX - startX;
        const dy = targetY - startY;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;

        const warm = Math.random() < 0.22;
        meteors.push({
            x: startX,
            y: startY,
            vx: (dx / d) * speed,
            vy: (dy / d) * speed,
            len: 80 + Math.random() * 200,
            width: 0.8 + Math.random() * 1.6,
            bornAt: now,
            fadeIn: 60 + Math.random() * 80,
            hue: warm ? '255, 240, 220' : '198, 224, 255'
        });
    }

    function updateMeteors(now, dtSec) {
        if (now >= nextMeteorTime) {
            spawnMeteor(false, now);
            scheduleNextMeteor(now);
        }

        if (burstRemaining === 0 && now >= nextBurstCheckTime) {
            if (Math.random() < 0.5) {
                burstRemaining = 2 + Math.floor(Math.random() * 2);
                nextBurstShotTime = now;
            }
            nextBurstCheckTime = now + 30000 + Math.random() * 60000;
        }
        if (burstRemaining > 0 && now >= nextBurstShotTime) {
            spawnMeteor(true, now);
            burstRemaining--;
            if (burstRemaining > 0) scheduleNextBurstShot(now);
        }

        const pad = 100;
        for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            m.x += m.vx * dtSec;
            m.y += m.vy * dtSec;

            const offDist = Math.max(
                -m.x - pad, m.x - width - pad,
                -m.y - pad, m.y - height - pad,
                0
            );
            if (offDist > 320) meteors.splice(i, 1);
        }
    }

    function drawMeteors(now) {
        const pad = 100;
        for (let i = 0; i < meteors.length; i++) {
            const m = meteors[i];

            const d = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
            const ux = m.vx / d;
            const uy = m.vy / d;
            const tailX = m.x - ux * m.len;
            const tailY = m.y - uy * m.len;

            let a = 1;
            const age = now - m.bornAt;
            if (age < m.fadeIn) a = age / m.fadeIn;

            const offDist = Math.max(
                -m.x - pad, m.x - width - pad,
                -m.y - pad, m.y - height - pad,
                0
            );
            a *= 1 - Math.min(1, offDist / 250);
            if (a <= 0.02) continue;

            const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
            grad.addColorStop(0,    'rgba(255, 255, 255, ' + (a * 0.95) + ')');
            grad.addColorStop(0.12, 'rgba(' + m.hue + ', ' + (a * 0.72) + ')');
            grad.addColorStop(0.55, 'rgba(' + m.hue + ', ' + (a * 0.20) + ')');
            grad.addColorStop(1,    'rgba(' + m.hue + ', 0)');

            ctx.save();
            ctx.lineCap = 'round';

            ctx.strokeStyle = grad;
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = m.width * 3.2;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();

            ctx.globalAlpha = 1;
            ctx.strokeStyle = grad;
            ctx.lineWidth = m.width;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(m.x, m.y, m.width * 3.4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + m.hue + ', ' + (a * 0.13) + ')';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(m.x, m.y, m.width * 0.9, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (a * 0.92) + ')';
            ctx.fill();

            ctx.restore();
        }
    }

    let lastFrameTime = 0;

    function renderLoop(now) {
        if (!ctx) return;

        if (lastFrameTime === 0) lastFrameTime = now;
        const dt = Math.min(now - lastFrameTime, 100);
        lastFrameTime = now;
        const dtSec = dt / 1000;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#03050b';
        ctx.fillRect(0, 0, width, height);

        const nowSec = now / 1000;
        for (let i = 0; i < stars.length; i++) {
            const star = stars[i];
            const twinkle = 0.5 + 0.5 * Math.sin(nowSec * star.speed * 2.5 + star.offset);
            const alpha = Math.min(star.alpha * (0.6 + twinkle * 0.5), 0.95);

            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(225, 235, 255, ' + alpha + ')';
            ctx.fill();

            if (star.radius > 1.5 && twinkle > 0.7) {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(180, 210, 255, ' + (alpha * 0.2) + ')';
                ctx.fill();
            }
        }

        updateMeteors(now, dtSec);
        drawMeteors(now);

        requestAnimationFrame(renderLoop);
    }

    /* ---------- 微粒子层 ---------- */
    let particleCtx = null, particleCanvas = null;
    let particles = [];
    const PARTICLE_COUNT = 30;

    function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2 + 1,
                alpha: 0.2,
                vx: (Math.random() - 0.5) * 0.2,
                vy: (Math.random() - 0.5) * 0.1
            });
        }
    }

    function initParticleLayer() {
        particleCanvas = document.createElement('canvas');
        Object.assign(particleCanvas.style, {
            position: 'fixed',
            top: '0',
            left: '0',
            width: '100%',
            height: '100%',
            pointerEvents: 'none',
            zIndex: '1'
        });
        particleCanvas.id = 'particleCanvas';
        document.body.appendChild(particleCanvas);
        particleCtx = particleCanvas.getContext('2d');
        resizeParticleCanvas();
        animateParticles();
    }

    function resizeParticleCanvas() {
        if (!particleCanvas) return;
        particleCanvas.width = window.innerWidth;
        particleCanvas.height = window.innerHeight;
        initParticles();
    }

    function animateParticles() {
        if (!particleCtx) return;
        const W = particleCanvas.width, H = particleCanvas.height;
        particleCtx.clearRect(0, 0, W, H);
        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = W;
            if (p.x > W) p.x = 0;
            if (p.y < 0) p.y = H;
            if (p.y > H) p.y = 0;

            particleCtx.beginPath();
            particleCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            particleCtx.fillStyle = 'rgba(180, 200, 255, ' + (p.alpha * 0.5) + ')';
            particleCtx.fill();
        }
        requestAnimationFrame(animateParticles);
    }

    /* ============================================================
       第五部分：启动 & 自适应重建
       ============================================================ */

    let lastSignature = '';
    let rebuildTimer = null;

    function measureAndBuild(force) {
        const els = document.querySelectorAll('.liquid-glass');
        let sig = '';
        for (let i = 0; i < els.length; i++) {
            sig += Math.round(els[i].offsetWidth) + 'x' + Math.round(els[i].offsetHeight) + '|';
        }
        if (!force && sig === lastSignature) return;
        lastSignature = sig;
        buildLiquidGlass();
    }

    function scheduleRebuild() {
        clearTimeout(rebuildTimer);
        rebuildTimer = setTimeout(function () {
            measureAndBuild(true);
        }, 120);
    }

    function init() {
        const mainContainer = document.getElementById('mainContainer');
        const toTop = document.getElementById('toTop');

        /* ---- 滚动：回到顶部显隐 ---- */
        if (mainContainer && toTop) {
            mainContainer.addEventListener('scroll', function () {
                toTop.classList.toggle('show', mainContainer.scrollTop > 200);
            }, { passive: true });

            toTop.addEventListener('click', function () {
                mainContainer.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        /* ---- 窗口尺寸变化 ---- */
        window.addEventListener('resize', function () {
            resizeCanvas();
            resizeParticleCanvas();
            scheduleRebuild();
        });

        if (typeof ResizeObserver !== 'undefined' && noticeList) {
            const ro = new ResizeObserver(scheduleRebuild);
            ro.observe(noticeList);
        }

        /* ---- 背景 ---- */
        resizeCanvas();
        initParticleLayer();

        const t0 = performance.now();
        nextMeteorTime = t0 + 1000 + Math.random() * 2000;
        nextBurstCheckTime = t0 + 30000 + Math.random() * 30000;

        requestAnimationFrame(renderLoop);

        /* ---- 渲染公告 ---- */
        renderNotices();

        /* ---- 降级 ---- */
        const supportsBD = !!(window.CSS && window.CSS.supports) &&
            (window.CSS.supports('backdrop-filter', 'blur(2px)') ||
             window.CSS.supports('-webkit-backdrop-filter', 'blur(2px)'));
        if (!supportsBD) document.body.classList.add('no-glass');

        /* ---- 标题跟随鼠标微光 ---- */
        const titleElement = document.querySelector('.main-title');
        if (titleElement) {
            document.addEventListener('mousemove', function (e) {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                const glowX = (x * 30) - 15;
                const glowY = (y * 20) - 10;
                titleElement.style.textShadow =
                    (glowX * 0.3) + 'px ' + (glowY * 0.2) + 'px 25px rgba(100, 180, 255, 0.6)';
            }, { passive: true });
        }

        /* ---- 注入液态玻璃 ---- */
        ensureSVG();
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                measureAndBuild(true);
            });
        });
        window.addEventListener('load', function () {
            setTimeout(function () { measureAndBuild(true); }, 80);
        });
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () {
                setTimeout(function () { measureAndBuild(true); }, 80);
            });
        }

        console.log('✦ 公告中心已启动 | 液态玻璃折射 + 星空流星雨 ✦');
    }

    init();
})();
</script>
</body>
</html>
