<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>下载站 | 星际港口</title>
<style>
    /* ========== 全局重置 ========== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        overflow-y: hidden;
        font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
        background: #03050b;
        color: #fff;
    }

    /* 星空 + 流星雨画布 */
    #starCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
        pointer-events: none;
    }

    /* 主容器：内容浮层 */
    .main-container {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2.5rem 1.25rem;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
    }

    /* ========== 液态玻璃卡片 ========== */
    .glass-card {
        position: relative;
        width: 100%;
        max-width: 620px;
        min-width: 0;                 /* ★ 关键：允许在 flex 容器内收缩 */
        box-sizing: border-box;
        padding: 3rem 2.5rem 2.6rem;
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.055);
        border: none;
        overflow: hidden;             /* 内容溢出时裁掉，避免"穿模" */
        box-shadow:
            inset  0.5px  0    0 0 rgba(255, 255, 255, 0.35),
            inset -0.5px  0    0 0 rgba(255, 255, 255, 0.18),
            inset  0      0.5px 0 0 rgba(255, 255, 255, 0.50),
            inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.22),
            0 20px 50px rgba(0, 0, 0, 0.45);
        text-align: center;
        animation: cardIn 0.9s cubic-bezier(0.2, 0.9, 0.4, 1.1) backwards;
    }

    .glass-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 14%;
        right: 14%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
        pointer-events: none;
    }

    /* ========== 图标 ========== */
    .icon-wrap {
        width: 96px;
        height: 96px;
        margin: 0 auto 1.6rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.8rem;
        background: rgba(255, 255, 255, 0.06);
        box-shadow:
            inset  0.5px  0    0 0 rgba(255, 255, 255, 0.35),
            inset -0.5px  0    0 0 rgba(255, 255, 255, 0.18),
            inset  0      0.5px 0 0 rgba(255, 255, 255, 0.50),
            inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.22),
            0 0 30px rgba(140, 190, 255, 0.18);
        animation: floatIcon 3.4s ease-in-out infinite;
    }

    @keyframes floatIcon {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-8px); }
    }

    /* ========== 标题 ========== */
    .main-title {
        font-size: clamp(1.7rem, 5.5vw, 2.4rem);
        font-weight: 700;
        background: linear-gradient(135deg, #FFFFFF, #C0E0FF, #AAD0FF);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        text-shadow: 0 0 20px rgba(170, 208, 255, 0.5);
        letter-spacing: 3px;
        margin-bottom: 0.7rem;
    }

    .subtitle {
        font-size: clamp(0.85rem, 3vw, 1rem);
        opacity: 0.72;
        letter-spacing: 2px;
        font-weight: 300;
        line-height: 1.8;
        margin-bottom: 2rem;
    }

    /* ========== 进度条（不确定态） ========== */
    .progress-wrap {
        width: 100%;
        max-width: 340px;
        height: 6px;
        margin: 0 auto 1.2rem;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.06);
        overflow: hidden;
        position: relative;
    }

    .progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 35%;
        border-radius: 99px;
        background: linear-gradient(90deg, #3b82f6, #8cbaff, #3b82f6);
        box-shadow: 0 0 16px rgba(96, 165, 250, 0.7);
        animation: indeterminate 1.6s cubic-bezier(0.45, 0.05, 0.2, 0.99) infinite;
    }

    @keyframes indeterminate {
        0%   { margin-left: -35%; }
        100% { margin-left: 100%; }
    }

    .progress-text {
        font-size: 0.78rem;
        letter-spacing: 2px;
        color: rgba(186, 208, 240, 0.6);
        margin-bottom: 2.2rem;
    }

    /* ========== 占位信息列表 ========== */
    .info-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-bottom: 2.2rem;
        text-align: left;
    }

    .info-item {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        padding: 0.85rem 1.1rem;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid rgba(255, 255, 255, 0.06);
        font-size: 0.86rem;
        letter-spacing: 0.5px;
        color: rgba(218, 231, 255, 0.72);
        transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .info-item:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(255, 255, 255, 0.14);
    }

    .info-item .emoji {
        font-size: 1.15rem;
        flex: none;
        width: 26px;
        text-align: center;
    }

    .info-item .text {
        flex: 1;
        min-width: 0;
        line-height: 1.6;
        word-break: break-word;
    }

    .info-item .text b {
        color: #cfe3ff;
        font-weight: 600;
    }

    /* ========== 按钮行：★ 自适应核心 ========== */
    .button-row {
        display: flex;
        gap: 0.8rem;
        justify-content: center;
        align-items: stretch;
        flex-wrap: wrap;
        width: 100%;
        min-width: 0;
    }

    .glass-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;

        /* ★ 弹性宽度：可缩可长，最小不挤压文字 */
        flex: 1 1 130px;
        min-width: 0;                 /* ★ 允许收缩到小于内容宽度 */
        max-width: 240px;             /* 宽屏时不要过分拉长 */

        padding: 0.85rem 1.2rem;
        font-family: inherit;
        font-size: 0.92rem;
        font-weight: 600;
        letter-spacing: 1px;
        line-height: 1.3;
        color: #ffffff;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
        background: rgba(255, 255, 255, 0.055);
        border: none;
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-decoration: none;
        box-sizing: border-box;

        box-shadow:
            inset  0.5px  0    0 0 rgba(255, 255, 255, 0.35),
            inset -0.5px  0    0 0 rgba(255, 255, 255, 0.18),
            inset  0      0.5px 0 0 rgba(255, 255, 255, 0.50),
            inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.22),
            0 10px 26px rgba(0, 0, 0, 0.38);

        transition:
            transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1),
            box-shadow 0.25s ease,
            background-color 0.25s ease,
            text-shadow 0.25s ease;
    }

    .glass-btn:hover {
        transform: translateY(-3px);
        background: rgba(255, 255, 255, 0.11);
        box-shadow:
            inset  0.5px  0    0 0 rgba(255, 255, 255, 0.55),
            inset -0.5px  0    0 0 rgba(255, 255, 255, 0.3),
            inset  0      0.5px 0 0 rgba(255, 255, 255, 0.75),
            inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.35),
            0 18px 34px rgba(0, 0, 0, 0.45),
            0 0 24px rgba(140, 190, 255, 0.35);
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
    }

    .glass-btn:active {
        transform: translateY(1px);
        transition-duration: 0.05s;
    }

    .glass-btn.primary {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.55), rgba(59, 130, 246, 0.55));
        box-shadow:
            inset  0.5px  0    0 0 rgba(255, 255, 255, 0.45),
            inset -0.5px  0    0 0 rgba(255, 255, 255, 0.22),
            inset  0      0.5px 0 0 rgba(255, 255, 255, 0.55),
            inset  0     -0.5px 0 0 0 rgba(255, 255, 255, 0.28),
            0 10px 26px rgba(0, 0, 0, 0.42),
            0 0 24px rgba(59, 130, 246, 0.28);
    }

    .glass-btn.primary:hover {
        background: linear-gradient(135deg, rgba(37, 99, 235, 0.72), rgba(96, 165, 250, 0.72));
    }

    /* ========== 涟漪 ========== */
    .ripple-effect {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0) 75%);
        transform: scale(0);
        opacity: 1;
        z-index: 2;
    }

    /* ========== 底部 ========== */
    .footer-note {
        margin-top: 1.8rem;
        font-size: 0.74rem;
        text-align: center;
        letter-spacing: 1.5px;
        opacity: 0.5;
        color: rgba(186, 208, 240, 0.85);
        line-height: 1.9;
    }

    /* ========== 降级 ========== */
    .no-glass .glass-card,
    .no-glass .icon-wrap,
    .no-glass .glass-btn {
        background: rgba(40, 60, 100, 0.42);
    }

    /* ========== 响应式 ========== */
    @media (max-width: 680px) {
        .main-container {
            padding: 1.75rem 1rem;
        }
        .glass-card {
            padding: 2.2rem 1.3rem 1.9rem;
            border-radius: 26px;
        }
        .icon-wrap {
            width: 78px;
            height: 78px;
            font-size: 2.2rem;
            margin-bottom: 1.2rem;
        }
        .info-list {
            gap: 0.6rem;
            margin-bottom: 1.8rem;
        }
        .info-item {
            padding: 0.72rem 0.9rem;
            font-size: 0.8rem;
            border-radius: 13px;
        }
        .button-row {
            gap: 0.65rem;
        }
        .glass-btn {
            flex: 1 1 120px;
            max-width: none;
            padding: 0.78rem 1rem;
            font-size: 0.86rem;
            letter-spacing: 0.5px;
        }
        .subtitle { margin-bottom: 1.6rem; }
        .progress-text { margin-bottom: 1.8rem; }
    }

    /* ★ 极窄屏：按钮竖排堆叠，彻底避免挤压与溢出 */
    @media (max-width: 400px) {
        .button-row {
            flex-direction: column;
            gap: 0.55rem;
        }
        .glass-btn {
            width: 100%;
            max-width: none;
            flex: none;
        }
    }

    /* ========== 滚动条 ========== */
    .main-container::-webkit-scrollbar { width: 5px; }
    .main-container::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 10px;
    }
    .main-container::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.4);
        border-radius: 10px;
    }

    /* ========== 动画 ========== */
    @keyframes cardIn {
        0%   { opacity: 0; transform: translateY(30px) scale(0.98); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }
</style>

<script>
(function () {
    "use strict";

    /* ============================================================
       第一部分：Snell 折射算法（液态玻璃核心）
       ============================================================ */

    function calculateRefractionProfile(glassThickness, bezelWidth, heightFn, ior, samples) {
        samples = samples || 128;
        var eta = 1 / ior;
        function refract(nx, ny) {
            var dot = ny;
            var k = 1 - eta * eta * (1 - dot * dot);
            if (k < 0) return null;
            var sq = Math.sqrt(k);
            return [-(eta * dot + sq) * nx, eta - (eta * dot + sq) * ny];
        }
        var profile = new Float64Array(samples);
        for (var i = 0; i < samples; i++) {
            var x = i / samples;
            var y = heightFn(x);
            var dx = x < 1 ? 0.0001 : -0.0001;
            var y2 = heightFn(x + dx);
            var deriv = (y2 - y) / dx;
            var mag = Math.sqrt(deriv * deriv + 1);
            var ref = refract(-deriv / mag, -1 / mag);
            if (!ref) { profile[i] = 0; continue; }
            profile[i] = ref[0] * ((y * bezelWidth + glassThickness) / ref[1]);
        }
        return profile;
    }

    function squircleSurface(t) {
        return Math.pow(1 - Math.pow(1 - t, 4), 0.25);
    }

    function generateDisplacementMap(w, h, radius, bezelWidth, profile, maxDisp) {
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        var img = ctx.createImageData(w, h);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
            d[i] = 128; d[i + 1] = 128; d[i + 2] = 0; d[i + 3] = 255;
        }
        var r = Math.min(radius, Math.min(w, h) / 2 - 1);
        if (r <= 0) return c.toDataURL();
        var clampedBezel = Math.min(bezelWidth, r - 1);
        if (clampedBezel <= 1) return c.toDataURL();
        var rSq = r * r;
        var r1Sq = (r + 1) * (r + 1);
        var rBSq = Math.max(r - clampedBezel, 0) * Math.max(r - clampedBezel, 0);
        var wB = w - r * 2;
        var hB = h - r * 2;
        var S = profile.length;
        if (wB < 0 || hB < 0) return c.toDataURL();

        for (var y1 = 0; y1 < h; y1++) {
            for (var x1 = 0; x1 < w; x1++) {
                var dx, dy;
                if (x1 < r) { dx = x1 - r; }
                else if (x1 >= w - r) { dx = x1 - r - wB; }
                else { dx = 0; }
                if (y1 < r) { dy = y1 - r; }
                else if (y1 >= h - r) { dy = y1 - r - hB; }
                else { dy = 0; }
                var dSq = dx * dx + dy * dy;
                if (dSq > r1Sq || dSq < rBSq) continue;
                var dist = Math.sqrt(dSq);
                var fromSide = r - dist;
                var op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
                if (op <= 0 || dist === 0) continue;
                var cos = dx / dist;
                var sin = dy / dist;
                var bi = Math.min(Math.floor((fromSide / clampedBezel) * S), S - 1);
                var disp = profile[bi] || 0;
                var dX = (-cos * disp) / maxDisp;
                var dY = (-sin * disp) / maxDisp;
                var idx = (y1 * w + x1) * 4;
                d[idx]     = Math.min(255, Math.max(0, (128 + dX * 127 * op + 0.5) | 0));
                d[idx + 1] = Math.min(255, Math.max(0, (128 + dY * 127 * op + 0.5) | 0));
            }
        }
        ctx.putImageData(img, 0, 0);
        return c.toDataURL();
    }

    function generateSpecularMap(w, h, radius, bezelWidth, angle) {
        angle = angle != null ? angle : Math.PI / 3;
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        var ctx = c.getContext('2d');
        var img = ctx.createImageData(w, h);
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
            d[i] = 0; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = 0;
        }
        var r = Math.min(radius, Math.min(w, h) / 2 - 1);
        if (r <= 0) return c.toDataURL();
        var clampedBezel = Math.min(bezelWidth, r - 1);
        if (clampedBezel <= 1) return c.toDataURL();
        var rSq = r * r;
        var r1Sq = (r + 1) * (r + 1);
        var rBSq = Math.max(r - clampedBezel, 0) * Math.max(r - clampedBezel, 0);
        var wB = w - r * 2;
        var hB = h - r * 2;
        var lightVec = [Math.cos(angle), Math.sin(angle)];

        for (var y1 = 0; y1 < h; y1++) {
            for (var x1 = 0; x1 < w; x1++) {
                var dx, dy;
                if (x1 < r) { dx = x1 - r; }
                else if (x1 >= w - r) { dx = x1 - r - wB; }
                else { dx = 0; }
                if (y1 < r) { dy = y1 - r; }
                else if (y1 >= h - r) { dy = y1 - r - hB; }
                else { dy = 0; }
                var dSq = dx * dx + dy * dy;
                if (dSq > r1Sq || dSq < rBSq) continue;
                var dist = Math.sqrt(dSq);
                var fromSide = r - dist;
                var op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
                if (op <= 0 || dist === 0) continue;
                var cos = dx / dist;
                var sin = -dy / dist;
                var dot = Math.abs(cos * lightVec[0] + sin * lightVec[1]);
                var edge = Math.sqrt(Math.max(0, 1 - Math.pow(1 - fromSide, 2)));
                var coeff = dot * edge;
                var col = (255 * coeff) | 0;
                var alpha = Math.min(255, Math.max(0, (col * coeff * op * 0.85) | 0));
                var idx = (y1 * w + x1) * 4;
                d[idx] = col; d[idx + 1] = col; d[idx + 2] = col; d[idx + 3] = alpha;
            }
        }
        ctx.putImageData(img, 0, 0);
        return c.toDataURL();
    }

    function buildSVGFilter(filterId, dispUrl, specUrl, scale, w, h, specOpacity) {
        specOpacity = specOpacity != null ? specOpacity : 0.3;
        var fc = '';
        fc += '<feImage href="' + dispUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="disp_map" />';
        fc += '<feDisplacementMap in="SourceGraphic" in2="disp_map" scale="' + scale +
              '" xChannelSelector="R" yChannelSelector="G" result="displaced" />';
        if (specUrl) {
            fc += '<feImage href="' + specUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="spec_layer" />';
            fc += '<feComposite in="displaced" in2="spec_layer" operator="in" result="spec_masked" />';
            fc += '<feComponentTransfer in="spec_layer" result="spec_faded">' +
                  '<feFuncA type="linear" slope="' + specOpacity + '" /></feComponentTransfer>';
            fc += '<feBlend in="spec_masked" in2="displaced" mode="screen" result="with_spec" />';
            fc += '<feBlend in="spec_faded" in2="with_spec" mode="screen" />';
        }
        return fc;
    }

    /* ============================================================
       第二部分：SVG 容器 & 液态玻璃注入
       ============================================================ */

    const GLASS = {
        THICKNESS: 64,
        IOR: 2.35,
        BEZEL_RATIO: 0.52,
        BEZEL_MAX: 18,
        SPECULAR_OPACITY: 0.22,
        SPECULAR_ANGLE: Math.PI * 0.75,
        BLUR: 0.35,
        SCALE_RATIO: 0.52
    };

    let defsEl = null;

    function ensureSVG() {
        let svg = document.getElementById('lg-svg');
        if (!svg) {
            svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('id', 'lg-svg');
            svg.setAttribute('width', '0');
            svg.setAttribute('height', '0');
            svg.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;');
            svg.setAttribute('color-interpolation-filters', 'sRGB');
            svg.setAttribute('aria-hidden', 'true');
            document.body.appendChild(svg);
        }
        defsEl = svg.querySelector('defs');
        if (!defsEl) {
            defsEl = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            svg.appendChild(defsEl);
        }
    }

    function writeFilter(id, filterHTML) {
        if (!defsEl) return;
        const old = defsEl.querySelector('#' + id);
        if (old) old.remove();
        if (!filterHTML) return;
        const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
        filter.setAttribute('id', id);
        filter.setAttribute('x', '0%');
        filter.setAttribute('y', '0%');
        filter.setAttribute('width', '100%');
        filter.setAttribute('height', '100%');
        filter.innerHTML = filterHTML;
        defsEl.appendChild(filter);
    }

    function applyGlassTo(el, index) {
        const w = Math.round(el.offsetWidth);
        const h = Math.round(el.offsetHeight);
        if (w < 8 || h < 8) return;

        const maxRadius = Math.min(w, h) / 2 - 1;
        let radius = parseFloat(el.dataset.glassRadius || '0');
        if (!radius || isNaN(radius)) radius = maxRadius;
        radius = Math.min(radius, maxRadius);
        if (radius <= 1) return;

        const bezel = Math.min(radius * GLASS.BEZEL_RATIO, GLASS.BEZEL_MAX, radius - 1);
        if (bezel <= 1) return;

        const profile = calculateRefractionProfile(
            GLASS.THICKNESS, bezel, squircleSurface, GLASS.IOR, 128
        );

        let maxDisp = 0;
        for (let k = 0; k < profile.length; k++) {
            const a = Math.abs(profile[k]);
            if (a > maxDisp) maxDisp = a;
        }
        if (maxDisp < 0.001) maxDisp = 1;
        const scale = maxDisp * GLASS.SCALE_RATIO;

        const dispUrl = generateDisplacementMap(w, h, radius, bezel, profile, maxDisp);
        let specUrl = '';
        if (GLASS.SPECULAR_OPACITY > 0.001) {
            specUrl = generateSpecularMap(w, h, radius, bezel * 2.2, GLASS.SPECULAR_ANGLE);
        }

        const id = 'lg-filter-' + index;
        writeFilter(id, buildSVGFilter(id, dispUrl, specUrl, scale, w, h, GLASS.SPECULAR_OPACITY));

        let bf = 'url(#' + id + ')';
        if (GLASS.BLUR > 0) bf += ' blur(' + GLASS.BLUR.toFixed(1) + 'px)';

        el.style.setProperty('backdrop-filter', bf, 'important');
        el.style.setProperty('-webkit-backdrop-filter', bf, 'important');
    }

    function buildLiquidGlass() {
        const els = document.querySelectorAll('.liquid-glass');
        els.forEach(function (el, i) {
            applyGlassTo(el, i);
        });
    }

    /* ============================================================
       第三部分：涟漪
       ============================================================ */

    function createRipple(e) {
        const btn = e.currentTarget;
        if (btn.querySelector('.ripple-effect')) return;

        let clientX, clientY;
        if (e.touches && e.touches.length) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        const rect = btn.getBoundingClientRect();
        const diameter = Math.max(rect.width, rect.height) * 1.6;
        const radius = diameter / 2;
        const x = clientX - rect.left - radius;
        const y = clientY - rect.top - radius;

        const ripple = document.createElement('span');
        ripple.className = 'ripple-effect';
        Object.assign(ripple.style, {
            width: diameter + 'px',
            height: diameter + 'px',
            left: x + 'px',
            top: y + 'px',
            transition: 'transform 0.5s ease-out, opacity 0.6s ease'
        });
        btn.appendChild(ripple);

        requestAnimationFrame(function () {
            ripple.style.transform = 'scale(2.2)';
            ripple.style.opacity = '0';
        });
        setTimeout(function () {
            if (ripple.parentNode) ripple.remove();
        }, 620);
    }

    /* ============================================================
       第四部分：星空 + 流星雨
       ============================================================ */

    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const STAR_COUNT = 220;
    let width = 0, height = 0;

    const meteors = [];
    const MAX_METEORS = 3;

    let nextMeteorTime = 0;
    let burstRemaining = 0;
    let nextBurstShotTime = 0;
    let nextBurstCheckTime = 0;

    function scheduleNextMeteor(now) {
        nextMeteorTime = now + 2500 + Math.random() * 5500;
    }
    function scheduleNextBurstShot(now) {
        nextBurstShotTime = now + 200 + Math.random() * 600;
    }

    function initStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2.2 + 0.8,
                alpha: Math.random() * 0.5 + 0.3,
                speed: 0.002 + Math.random() * 0.008,
                offset: Math.random() * Math.PI * 2
            });
        }
    }

    function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        initStars();
    }

    function spawnMeteor(speedBoost, now) {
        if (meteors.length >= MAX_METEORS) return;

        const baseSpeed = 320 + Math.random() * 420;
        const speed = speedBoost ? baseSpeed * 1.4 : baseSpeed;
        const pad = 120;

        const edge = Math.floor(Math.random() * 4);
        let startX, startY;
        if (edge === 0) { startX = Math.random() * width;  startY = -pad; }
        else if (edge === 1) { startX = width + pad; startY = Math.random() * height; }
        else if (edge === 2) { startX = Math.random() * width; startY = height + pad; }
        else { startX = -pad; startY = Math.random() * height; }

        const targetX = width  * (0.1 + Math.random() * 0.8);
        const targetY = height * (0.1 + Math.random() * 0.8);
        const dx = targetX - startX;
        const dy = targetY - startY;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;

        const warm = Math.random() < 0.22;
        meteors.push({
            x: startX,
            y: startY,
            vx: (dx / d) * speed,
            vy: (dy / d) * speed,
            len: 80 + Math.random() * 200,
            width: 0.8 + Math.random() * 1.6,
            bornAt: now,
            fadeIn: 60 + Math.random() * 80,
            hue: warm ? '255, 240, 220' : '198, 224, 255'
        });
    }

    function updateMeteors(now, dtSec) {
        if (now >= nextMeteorTime) {
            spawnMeteor(false, now);
            scheduleNextMeteor(now);
        }

        if (burstRemaining === 0 && now >= nextBurstCheckTime) {
            if (Math.random() < 0.5) {
                burstRemaining = 2 + Math.floor(Math.random() * 2);
                nextBurstShotTime = now;
            }
            nextBurstCheckTime = now + 30000 + Math.random() * 60000;
        }
        if (burstRemaining > 0 && now >= nextBurstShotTime) {
            spawnMeteor(true, now);
            burstRemaining--;
            if (burstRemaining > 0) scheduleNextBurstShot(now);
        }

        const pad = 100;
        for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            m.x += m.vx * dtSec;
            m.y += m.vy * dtSec;

            const offDist = Math.max(
                -m.x - pad, m.x - width - pad,
                -m.y - pad, m.y - height - pad,
                0
            );
            if (offDist > 320) meteors.splice(i, 1);
        }
    }

    function drawMeteors(now) {
        const pad = 100;
        for (let i = 0; i < meteors.length; i++) {
            const m = meteors[i];

            const d = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
            const ux = m.vx / d;
            const uy = m.vy / d;
            const tailX = m.x - ux * m.len;
            const tailY = m.y - uy * m.len;

            let a = 1;
            const age = now - m.bornAt;
            if (age < m.fadeIn) a = age / m.fadeIn;

            const offDist = Math.max(
                -m.x - pad, m.x - width - pad,
                -m.y - pad, m.y - height - pad,
                0
            );
            a *= 1 - Math.min(1, offDist / 250);
            if (a <= 0.02) continue;

            const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
            grad.addColorStop(0,    'rgba(255, 255, 255, ' + (a * 0.95) + ')');
            grad.addColorStop(0.12, 'rgba(' + m.hue + ', ' + (a * 0.72) + ')');
            grad.addColorStop(0.55, 'rgba(' + m.hue + ', ' + (a * 0.20) + ')');
            grad.addColorStop(1,    'rgba(' + m.hue + ', 0)');

            ctx.save();
            ctx.lineCap = 'round';

            ctx.strokeStyle = grad;
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = m.width * 3.2;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();

            ctx.globalAlpha = 1;
            ctx.strokeStyle = grad;
            ctx.lineWidth = m.width;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(m.x, m.y, m.width * 3.4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + m.hue + ', ' + (a * 0.13) + ')';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(m.x, m.y, m.width * 0.9, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (a * 0.92) + ')';
            ctx.fill();

            ctx.restore();
        }
    }

    let lastFrameTime = 0;

    function renderLoop(now) {
        if (!ctx) return;

        if (lastFrameTime === 0) lastFrameTime = now;
        const dt = Math.min(now - lastFrameTime, 100);
        lastFrameTime = now;
        const dtSec = dt / 1000;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#03050b';
        ctx.fillRect(0, 0, width, height);

        const nowSec = now / 1000;
        for (let i = 0; i < stars.length; i++) {
            const star = stars[i];
            const twinkle = 0.5 + 0.5 * Math.sin(nowSec * star.speed * 2.5 + star.offset);
            const alpha = Math.min(star.alpha * (0.6 + twinkle * 0.5), 0.95);

            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(225, 235, 255, ' + alpha + ')';
            ctx.fill();

            if (star.radius > 1.5 && twinkle > 0.7) {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(180, 210, 255, ' + (alpha * 0.2) + ')';
                ctx.fill();
            }
        }

        updateMeteors(now, dtSec);
        drawMeteors(now);

        requestAnimationFrame(renderLoop);
    }

    /* ============================================================
       第五部分：启动 & 自适应重建
       ============================================================ */

    let lastSignature = '';
    let rebuildTimer = null;

    function measureAndBuild(force) {
        const els = document.querySelectorAll('.liquid-glass');
        let sig = '';
        for (let i = 0; i < els.length; i++) {
            sig += Math.round(els[i].offsetWidth) + 'x' + Math.round(els[i].offsetHeight) + '|';
        }
        if (!force && sig === lastSignature) return;
        lastSignature = sig;
        buildLiquidGlass();
    }

    function scheduleRebuild() {
        clearTimeout(rebuildTimer);
        rebuildTimer = setTimeout(function () {
            measureAndBuild(true);
        }, 120);
    }

    function init() {
        /* ---- 窗口尺寸变化 ---- */
        window.addEventListener('resize', function () {
            resizeCanvas();
            scheduleRebuild();
        });

        if (typeof ResizeObserver !== 'undefined') {
            const ro = new ResizeObserver(scheduleRebuild);
            ro.observe(document.querySelector('.glass-card'));
            const ro2 = new ResizeObserver(scheduleRebuild);
            ro2.observe(document.querySelector('.button-row'));
        }

        /* ---- 背景 ---- */
        resizeCanvas();

        const t0 = performance.now();
        nextMeteorTime = t0 + 1000 + Math.random() * 2000;
        nextBurstCheckTime = t0 + 30000 + Math.random() * 30000;

        requestAnimationFrame(renderLoop);

        /* ---- 降级 ---- */
        const supportsBD = !!(window.CSS && window.CSS.supports) &&
            (window.CSS.supports('backdrop-filter', 'blur(2px)') ||
             window.CSS.supports('-webkit-backdrop-filter', 'blur(2px)'));
        if (!supportsBD) document.body.classList.add('no-glass');

        /* ---- 按钮涟漪 ---- */
        document.querySelectorAll('.glass-btn').forEach(function (btn) {
            btn.addEventListener('mousedown', createRipple);
            btn.addEventListener('touchstart', createRipple, { passive: true });
        });

        /* ---- 注入液态玻璃 ---- */
        ensureSVG();
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                measureAndBuild(true);
            });
        });
        window.addEventListener('load', function () {
            setTimeout(function () { measureAndBuild(true); }, 80);
        });
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () {
                setTimeout(function () { measureAndBuild(true); }, 80);
            });
        }

        console.log('📦 下载站占位页已启动 | 液态玻璃折射 + 星空流星雨');
    }

    init();
})();
</script>
