            updateUI(); drawBoard(); showOverlay();
            updateCheatTip('🏆 直接获胜！'); closeCheatPanel();
            cheatMode = null; doubleCount = 0;
            [cheatReplace, cheatDouble, cheatWin].forEach(b => b.classList.remove('active-mode'));
        }

        function forceRollback() {
            if (moveHistory.length === 0) { updateCheatTip('没有可回滚的步骤'); closeCheatPanel(); return; }
            if (isReviewMode) exitReviewMode();
            cheatMode = null; doubleCount = 0;
            [cheatReplace, cheatDouble, cheatWin].forEach(b => b.classList.remove('active-mode'));
            const stepsToRemove = Math.min(2, moveHistory.length);
            for (let i = 0; i < stepsToRemove; i++) {
                const r = moveHistory.pop();
                if (r.type === 'move') board[r.row][r.col] = EMPTY;
                else if (r.type === 'replace') board[r.row][r.col] = r.from;
            }
            gameOver = false; winner = EMPTY; winCells = []; hideOverlay();
            if (moveHistory.length > 0) {
                const lastRec = moveHistory[moveHistory.length - 1];
                lastMove = { row: lastRec.row, col: lastRec.col };
                if (lastRec.type === 'move') currentPlayer = (lastRec.color === BLACK) ? WHITE : BLACK;
                else currentPlayer = BLACK;
            } else {
                lastMove = null; currentPlayer = BLACK;
            }
            updateUI(); drawBoard();
            btnUndo.disabled = (moveHistory.length < 2);
            updateCheatTip(`⏪ 已强制回滚 ${stepsToRemove} 步`);
            closeCheatPanel();
            if (currentPlayer === WHITE && !gameOver) triggerAI();
        }

        function handleCanvasClick(e) {
            if (isReviewMode || gameOver || isAIThinking) return;
            const pos = getBoardPos(e);
            if (!pos) return;
            const { row, col } = pos;
            if (cheatMode === 'replace') {
                if (board[row][col] === WHITE) { executeReplace(row, col); return; }
                else { updateCheatTip('请点击白子（AI的棋子）'); return; }
            }
            if (cheatMode === 'double') {
                if (board[row][col] !== EMPTY) { updateCheatTip('这个位置已有棋子'); return; }
                board[row][col] = BLACK;
                moveHistory.push({ type: 'move', row, col, color: BLACK });
                lastMove = { row, col };
                if (checkWin(row, col, BLACK)) {
                    winner = BLACK; gameOver = true; cheatMode = null; doubleCount = 0;
                    cheatDouble.classList.remove('active-mode');
                    updateUI(); drawBoard(); showOverlay();
                    updateCheatTip('下两颗后获胜！🏆'); closeCheatPanel(); return;
                }
                if (isBoardFull()) {
                    winner = EMPTY; gameOver = true; cheatMode = null; doubleCount = 0;
                    cheatDouble.classList.remove('active-mode');
                    updateUI(); drawBoard(); showOverlay();
                    updateCheatTip('平局'); closeCheatPanel(); return;
                }
                doubleCount++;
                if (doubleCount >= 2) {
                    cheatMode = null; doubleCount = 0;
                    cheatDouble.classList.remove('active-mode');
                    currentPlayer = WHITE;
                    updateCheatTip('两颗已下完，轮到AI');
                    updateUI(); drawBoard();
                    if (!gameOver) triggerAI();
                    closeCheatPanel();
                } else {
                    updateCheatTip('下第二颗黑子 ✌️');
                    updateUI(); drawBoard();
                }
                return;
            }
            if (currentPlayer !== BLACK) { updateCheatTip('轮到AI，请稍候'); return; }
            if (board[row][col] !== EMPTY) return;
            placePiece(row, col, BLACK);
            btnUndo.disabled = (moveHistory.length < 2);
        }

        function handleMouseMove(e) {
            if (isReviewMode) { hoverPos = null; drawBoard(); return; }
            const pos = getBoardPos(e);
            hoverPos = pos || null;
            drawBoard();
        }
        function handleMouseLeave() { hoverPos = null; drawBoard(); }

        function getBoardPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
            let cx, cy;
            if (e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; e.preventDefault(); }
            else { cx = e.clientX; cy = e.clientY; }
            const x = (cx - rect.left) * scaleX, y = (cy - rect.top) * scaleY;
            const col = Math.round((x - OFFSET) / CELL_SIZE), row = Math.round((y - OFFSET) / CELL_SIZE);
            if (isOnBoard(row, col)) {
                const px = OFFSET + col * CELL_SIZE, py = OFFSET + row * CELL_SIZE;
                if (Math.hypot(x - px, y - py) < CELL_SIZE * 0.5) return { row, col };
            }
            return null;
        }

        function undoMove() {
            if (gameOver || isAIThinking) return;
            if (moveHistory.length < 2) return;
            if (cheatMode) {
                cheatMode = null; doubleCount = 0;
                [cheatReplace, cheatDouble, cheatWin].forEach(b => b.classList.remove('active-mode'));
                updateCheatTip('已退出外挂模式');
            }
            const last = moveHistory.pop(); undoStep(last);
            const prev = moveHistory.pop(); undoStep(prev);
            if (moveHistory.length > 0) {
                const lastRec = moveHistory[moveHistory.length - 1];
                lastMove = { row: lastRec.row, col: lastRec.col };
            } else lastMove = null;
            winCells = []; winner = EMPTY; gameOver = false;
            if (moveHistory.length === 0) currentPlayer = BLACK;
            else {
                const lastRec = moveHistory[moveHistory.length - 1];
                if (lastRec.type === 'move') currentPlayer = (lastRec.color === BLACK) ? WHITE : BLACK;
                else currentPlayer = BLACK;
            }
            updateUI(); drawBoard();
            btnUndo.disabled = (moveHistory.length < 2);
            hideOverlay();
            if (currentPlayer === WHITE && !gameOver) triggerAI();
        }

        function undoStep(record) {
            if (record.type === 'move') board[record.row][record.col] = EMPTY;
            else if (record.type === 'replace') board[record.row][record.col] = record.from;
        }

        function resetGame() {
            if (isAIThinking) return;
            closeCheatPanel();
            cheatMode = null; doubleCount = 0;
            [cheatReplace, cheatDouble, cheatWin].forEach(b => b.classList.remove('active-mode'));
            initBoard();
            hideOverlay();
            reviewControls.classList.remove('active');
            isReviewMode = false;
            drawBoard();
        }

        btnReset.addEventListener('click', resetGame);
        btnUndo.addEventListener('click', undoMove);
        btnNextGame.addEventListener('click', resetGame);
        btnReview.addEventListener('click', function() { if (moveHistory.length > 0) enterReviewMode(); });

        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseleave', handleMouseLeave);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleCanvasClick(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMouseMove(e); }, { passive: false });

        cheatMenuBtn.addEventListener('click', toggleCheatPanel);
        document.addEventListener('click', function(e) {
            if (isCheatPanelOpen && !cheatPanel.contains(e.target) && e.target !== cheatMenuBtn) closeCheatPanel();
        });
        cheatReplace.addEventListener('click', function(e) { e.stopPropagation(); toggleReplaceMode(); });
        cheatDouble.addEventListener('click', function(e) { e.stopPropagation(); toggleDoubleMode(); });
        cheatWin.addEventListener('click', function(e) { e.stopPropagation(); forceWin(); });
        cheatRollback.addEventListener('click', function(e) { e.stopPropagation(); forceRollback(); });

        toggleHighlight.addEventListener('click', function(e) {
            e.stopPropagation();
            highlightEnabled = !highlightEnabled;
            trackHighlight.classList.toggle('active', highlightEnabled);
            drawBoard();
        });
        toggleBestMove.addEventListener('click', function(e) {
            e.stopPropagation();
            bestMoveEnabled = !bestMoveEnabled;
            trackBestMove.classList.toggle('active', bestMoveEnabled);
            drawBoard();
        });

        toggleCustomCheat.addEventListener('click', function(e) {
            e.stopPropagation();
            customCheatEnabled = !customCheatEnabled;
            trackCustomCheat.classList.toggle('active', customCheatEnabled);
        });
        toggleCustomFullScan.addEventListener('click', function(e) {
            e.stopPropagation();
            customFullScanEnabled = !customFullScanEnabled;
            trackCustomFullScan.classList.toggle('active', customFullScanEnabled);
        });

        // ==== 通用滑块定位函数：适配换行布局 ====
        function updateSegmentedSlider(control, slider) {
            const active = control.querySelector('.segmented-option.active');
            if (!active) return;
            const optRect = active.getBoundingClientRect();
            const ctrlRect = control.getBoundingClientRect();
            slider.style.left = (optRect.left - ctrlRect.left) + 'px';
            slider.style.top = (optRect.top - ctrlRect.top) + 'px';
            slider.style.width = optRect.width + 'px';
            slider.style.height = optRect.height + 'px';
        }

        function moveDifficultySlider() {
            updateSegmentedSlider(difficultyControl, difficultySlider);
        }
        function moveRecommendSlider() {
            updateSegmentedSlider(recommendControl, recommendSlider);
        }

        diffOptions.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                diffOptions.forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                currentDifficulty = this.dataset.value;
                moveDifficultySlider();
                battleWeightsPanel.classList.toggle('show', currentDifficulty === 'custom');
                if (!gameOver && !isAIThinking) drawBoard();
            });
        });

        recommendOptions.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                recommendOptions.forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                recommendMode = this.dataset.value;
                moveRecommendSlider();
                recommendWeightsPanel.classList.toggle('show', recommendMode === 'custom');
                drawBoard();
            });
        });

        function updateBattleWeights() {
            battleAttackWeight = parseFloat(battleAttackSlider.value);
            battleDefenseWeight = parseFloat(battleDefenseSlider.value);
            battleCenterBonus = parseFloat(battleCenterSlider.value);
            battleAttackValue.textContent = battleAttackWeight.toFixed(2);
            battleDefenseValue.textContent = battleDefenseWeight.toFixed(1);
            battleCenterValue.textContent = battleCenterBonus.toFixed(1);
        }
        battleAttackSlider.addEventListener('input', updateBattleWeights);
        battleDefenseSlider.addEventListener('input', updateBattleWeights);
        battleCenterSlider.addEventListener('input', updateBattleWeights);

        function updateRecommendWeights() {
            recommendAttackWeight = parseFloat(recommendAttackSlider.value);
            recommendDefenseWeight = parseFloat(recommendDefenseSlider.value);
            recommendCenterBonus = parseFloat(recommendCenterSlider.value);
            recommendAttackValue.textContent = recommendAttackWeight.toFixed(2);
            recommendDefenseValue.textContent = recommendDefenseWeight.toFixed(1);
            recommendCenterValue.textContent = recommendCenterBonus.toFixed(1);
            if (!isReviewMode && bestMoveEnabled && !gameOver && !isAIThinking) drawBoard();
        }
        recommendAttackSlider.addEventListener('input', updateRecommendWeights);
        recommendDefenseSlider.addEventListener('input', updateRecommendWeights);
        recommendCenterSlider.addEventListener('input', updateRecommendWeights);

        window.addEventListener('resize', function() { moveDifficultySlider(); moveRecommendSlider(); });
        setTimeout(function() { moveDifficultySlider(); moveRecommendSlider(); }, 30);
        setTimeout(function() { moveDifficultySlider(); moveRecommendSlider(); }, 200);
        setTimeout(function() { moveDifficultySlider(); moveRecommendSlider(); }, 600);

        // 监听字体加载导致的布局变化
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function() {
                moveDifficultySlider();
                moveRecommendSlider();
            });
        }

        difficultyControl.addEventListener('click', function(e) { e.stopPropagation(); });
        recommendControl.addEventListener('click', function(e) { e.stopPropagation(); });

        // 启动
        initBoard();
        trackHighlight.classList.remove('active');
        trackBestMove.classList.remove('active');
        trackCustomCheat.classList.remove('active');
        trackCustomFullScan.classList.remove('active');
        highlightEnabled = false; bestMoveEnabled = false;
        customCheatEnabled = false; customFullScanEnabled = false;

        currentDifficulty = 'extreme';
        diffOptions.forEach(o => o.classList.remove('active'));
        document.querySelector('.segmented-option[data-value="extreme"]').classList.add('active');

        recommendMode = 'default';
        recommendOptions.forEach(o => o.classList.remove('active'));
        document.querySelector('.segmented-option[data-value="default"]').classList.add('active');

        battleAttackSlider.value = battleAttackWeight;
        battleDefenseSlider.value = battleDefenseWeight;
        battleCenterSlider.value = battleCenterBonus;
        updateBattleWeights();
        recommendAttackSlider.value = recommendAttackWeight;
        recommendDefenseSlider.value = recommendDefenseWeight;
        recommendCenterSlider.value = recommendCenterBonus;
        updateRecommendWeights();

        battleWeightsPanel.classList.toggle('show', currentDifficulty === 'custom');
        recommendWeightsPanel.classList.toggle('show', recommendMode === 'custom');

        setTimeout(function() { moveDifficultySlider(); moveRecommendSlider(); }, 50);

        console.log('♟ 五子棋 AI 对战 · 液态玻璃外挂菜单');
        console.log('⚡ 分段按钮已加宽，支持自动换行');
        console.log('⚡ 滑块会动态跟随当前按钮位置');
    </script>
</body>
</html>
