<body>

    <div class="game-container">
        <!-- 头部信息 -->
        <div class="header">
            <div class="title">♟ 五子棋</div>
            <div class="status-area">
                <div class="turn-indicator">
                    <span>回合</span>
                    <span class="turn-dot black" id="turnDot"></span>
                </div>
                <span class="status-text" id="statusText">你的回合</span>
                <button class="btn-reset" id="btnReset">↺ 重开</button>
                <!-- 外挂菜单按钮 -->
                <div class="cheat-menu-btn" id="cheatMenuBtn" title="外挂菜单">⚙</div>
            </div>
        </div>

        <!-- 棋盘 -->
        <div class="board-wrapper">
            <canvas id="boardCanvas" width="600" height="600"></canvas>
            <div id="overlay">
                <div id="resultText">游戏结束</div>
                <div class="overlay-buttons">
                    <button id="btnNextGame">下一局</button>
                    <button id="btnReview">复盘</button>
                </div>
            </div>

            <!-- 外挂面板 · 液态玻璃 -->
            <div class="cheat-panel" id="cheatPanel">
                <div class="cheat-panel-title">⚡ 外挂控制台</div>
                <button class="cheat-btn" id="cheatReplace">
                    <span class="icon">🔄</span> 替换
                    <span class="badge">白→黑</span>
                </button>
                <button class="cheat-btn" id="cheatDouble">
                    <span class="icon">✌️</span> 下两颗
                    <span class="badge">连下</span>
                </button>
                <button class="cheat-btn danger" id="cheatWin">
                    <span class="icon">🏆</span> Win！
                    <span class="badge">直接获胜</span>
                </button>
                <div class="cheat-status-tip" id="cheatTip">点击功能进入对应模式</div>
            </div>
        </div>

        <!-- 底部按钮 -->
        <div class="footer">
            <button class="btn-undo" id="btnUndo" disabled>↩ 悔棋</button>
        </div>

        <!-- 复盘控制条 -->
        <div id="reviewControls">
            <span id="stepLabel">0/0</span>
            <input type="range" id="progressSlider" min="0" max="0" value="0" />
            <span id="stepCount">0</span>
            <button id="btnBranch" disabled>从这里继续</button>
            <button id="btnExitReview">退出</button>
        </div>

        <!-- ===== 设置区：丝滑定制控件 ===== -->
        <div class="settings">
            <div class="toggles-row">
                <div class="toggle-wrap" id="toggleHighlight">
                    <div class="toggle-track" id="trackHighlight">
                        <div class="toggle-knob"></div>
                    </div>
                    <span class="toggle-label">高亮白子活路</span>
                </div>
                <div class="toggle-wrap" id="toggleBestMove">
                    <div class="toggle-track" id="trackBestMove">
                        <div class="toggle-knob"></div>
                    </div>
                    <span class="toggle-label">显示AI推荐点</span>
                </div>
            </div>

            <div class="segmented-wrap">
                <span class="segmented-label">AI难度</span>
                <div class="segmented-control" id="difficultyControl">
                    <div class="segmented-slider" id="difficultySlider"></div>
                    <button class="segmented-option" data-value="easy">简单</button>
                    <button class="segmented-option" data-value="medium">普通</button>
                    <button class="segmented-option" data-value="hard">困难</button>
                    <button class="segmented-option active" data-value="thunder">雷霆大AI</button>
                </div>
            </div>

            <div class="legend-row">
                <span class="legend-item">
                    <span class="legend-color blue"></span> 活三
                </span>
                <span class="legend-item">
                    <span class="legend-color red"></span> 活四
                </span>
                <span class="legend-item">
                    <span class="legend-color green"></span> 推荐点
                </span>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  五子棋 · AI 对战 + 液态玻璃外挂菜单
        //  修复：替换操作正确记录到历史，复盘可见
        //  修复：外挂菜单弹出动画
        // ================================================================

        // ---------- DOM 元素 ----------
        const canvas = document.getElementById('boardCanvas');
        const ctx = canvas.getContext('2d');
        const turnDot = document.getElementById('turnDot');
        const statusText = document.getElementById('statusText');
        const btnReset = document.getElementById('btnReset');
        const btnUndo = document.getElementById('btnUndo');
        const overlay = document.getElementById('overlay');
        const resultText = document.getElementById('resultText');
        const btnNextGame = document.getElementById('btnNextGame');
        const btnReview = document.getElementById('btnReview');
        const reviewControls = document.getElementById('reviewControls');
        const progressSlider = document.getElementById('progressSlider');
        const stepLabel = document.getElementById('stepLabel');
        const stepCount = document.getElementById('stepCount');
        const btnExitReview = document.getElementById('btnExitReview');
        const btnBranch = document.getElementById('btnBranch');

        // ---- 外挂 ----
        const cheatMenuBtn = document.getElementById('cheatMenuBtn');
        const cheatPanel = document.getElementById('cheatPanel');
        const cheatReplace = document.getElementById('cheatReplace');
        const cheatDouble = document.getElementById('cheatDouble');
        const cheatWin = document.getElementById('cheatWin');
        const cheatTip = document.getElementById('cheatTip');

        // ---- 定制控件 ----
        const toggleHighlight = document.getElementById('toggleHighlight');
        const trackHighlight = document.getElementById('trackHighlight');
        const toggleBestMove = document.getElementById('toggleBestMove');
        const trackBestMove = document.getElementById('trackBestMove');
        const difficultyControl = document.getElementById('difficultyControl');
        const difficultySlider = document.getElementById('difficultySlider');
        const diffOptions = difficultyControl.querySelectorAll('.segmented-option');

        // ---------- 常量 ----------
        const SIZE = 15;
        const EMPTY = 0,
            BLACK = 1,
            WHITE = 2;
        const CELL_SIZE = canvas.width / (SIZE + 1);
        const OFFSET = CELL_SIZE;
        const PIECE_RADIUS = CELL_SIZE * 0.42;

        // ---------- 游戏状态 ----------
        let board = [];
        let currentPlayer = BLACK;
        let gameOver = false;
        let winner = EMPTY;
        let moveHistory = [];
        let lastMove = null;
        let isAIThinking = false;
        let winCells = [];
        let hoverPos = null;

        // ---------- 复盘状态 ----------
        let isReviewMode = false;
        let reviewStep = 0;

        // ---------- 开关 & 难度 ----------
        let highlightEnabled = false;
        let bestMoveEnabled = false;
        let currentDifficulty = 'thunder';

        // ---------- 外挂模式 ----------
        let cheatMode = null; // null | 'replace' | 'double'
        let doubleCount = 0;
        let isCheatPanelOpen = false;

        // ---------- 初始化 ----------
        function initBoard() {
            board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
            currentPlayer = BLACK;
            gameOver = false;
            winner = EMPTY;
            moveHistory = [];
            lastMove = null;
            winCells = [];
            isAIThinking = false;
            hoverPos = null;
            cheatMode = null;
            doubleCount = 0;
            exitReviewMode();
            overlay.classList.remove('show');
            reviewControls.classList.remove('active');
            updateUI();
            drawBoard();
            btnUndo.disabled = true;
            updateCheatTip('外挂已就绪');
            [cheatReplace, cheatDouble, cheatWin].forEach(b => b.classList.remove('active-mode'));
            cheatReplace.disabled = false;
            cheatDouble.disabled = false;
            cheatWin.disabled = false;
        }

        // ---------- 工具 ----------
        function isOnBoard(r, c) { return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }

        function getEmptyCells() {
            const cells = [];
            for (let r = 0; r < SIZE; r++)
                for (let c = 0; c < SIZE; c++)
                    if (board[r][c] === EMPTY) cells.push({ row: r, col: c });
            return cells;
        }

        function isNearPiece(r, c, dist = 2) {
            for (let dr = -dist; dr <= dist; dr++)
                for (let dc = -dist; dc <= dist; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr,
                        nc = c + dc;
                    if (isOnBoard(nr, nc) && board[nr][nc] !== EMPTY) return true;
                }
            return false;
        }

        // ---------- 五子连珠 ----------
        function checkWin(row, col, color) {
            const dirs = [
                [0, 1],
                [1, 0],
                [1, 1],
                [1, -1]
            ];
            for (const [dr, dc] of dirs) {
                let cells = [{ row, col }];
                for (let s = 1; s < 5; s++) {
                    const nr = row + dr * s,
                        nc = col + dc * s;
                    if (!isOnBoard(nr, nc) || board[nr][nc] !== color) break;
                    cells.push({ row: nr, col: nc });
                }
                for (let s = 1; s < 5; s++) {
                    const nr = row - dr * s,
                        nc = col - dc * s;
                    if (!isOnBoard(nr, nc) || board[nr][nc] !== color) break;
                    cells.push({ row: nr, col: nc });
                }
                if (cells.length >= 5) { winCells = cells; return true; }
            }
            return false;
        }

        function isBoardFull() { return getEmptyCells().length === 0; }

        // ---------- 落子 ----------
        function placePiece(row, col, color, recordOnly = false) {
            if (gameOver) return false;
            if (!isOnBoard(row, col) || board[row][col] !== EMPTY) return false;
            if (!recordOnly && color !== currentPlayer) return false;
            if (isAIThinking && !recordOnly) return false;

            board[row][col] = color;
            if (!recordOnly) {
                moveHistory.push({ type: 'move', row, col, color });
                lastMove = { row, col };
            }

            if (checkWin(row, col, color)) {
                winner = color;
                gameOver = true;
                updateUI();
                drawBoard();
                showOverlay();
                return true;
            }

            if (recordOnly) {
                return true;
            }

            if (isBoardFull()) {
                winner = EMPTY;
                gameOver = true;
                updateUI();
                drawBoard();
                showOverlay();
                return true;
            }

            currentPlayer = (color === BLACK) ? WHITE : BLACK;
            updateUI();
            drawBoard();
            if (currentPlayer === WHITE && !gameOver) triggerAI();
            return true;
        }

        // ---------- 替换操作 (记录历史) ----------
        function executeReplace(row, col) {
            if (gameOver) return false;
            if (!isOnBoard(row, col)) return false;
            if (board[row][col] !== WHITE) {
                updateCheatTip('请点击白子（AI的棋子）');
                return false;
            }

            // 记录替换操作到历史
            moveHistory.push({
                type: 'replace',
                row,
                col,
                from: WHITE,
                to: BLACK
            });

            // 执行替换
            board[row][col] = BLACK;
            lastMove = { row, col };

            // 检查是否获胜
            if (checkWin(row, col, BLACK)) {
                winner = BLACK;
                gameOver = true;
                updateUI();
                drawBoard();
                showOverlay();
                cheatMode = null;
                cheatReplace.classList.remove('active-mode');
                updateCheatTip('替换后获胜！🏆');
                closeCheatPanel();
                return true;
            }

            // 替换后当前玩家不变（仍然是黑棋）
            // 但如果有AI回合，触发AI
            updateUI();
            drawBoard();
            updateCheatTip('替换完成');

            // 退出替换模式
            cheatMode = null;
            cheatReplace.classList.remove('active-mode');

            // 如果当前是AI回合，触发AI
            if (currentPlayer === WHITE && !gameOver) {
                triggerAI();
            }

            return true;
        }

        // ---------- AI ----------
        function triggerAI() {
            if (isAIThinking || gameOver || currentPlayer !== WHITE) return;
            if (cheatMode === 'double') return;

            isAIThinking = true;
            statusText.textContent = 'AI 思考中...';
            btnUndo.disabled = true;

            setTimeout(() => {
                const move = getBestMove(currentDifficulty);
                if (move) {
                    const { row, col } = move;
                    board[row][col] = WHITE;
                    moveHistory.push({ type: 'move', row, col, color: WHITE });
                    lastMove = { row, col };
                    if (checkWin(row, col, WHITE)) {
                        winner = WHITE;
                        gameOver = true;
                        isAIThinking = false;
                        updateUI();
                        drawBoard();
                        showOverlay();
                        return;
                    }
                    if (isBoardFull()) {
                        winner = EMPTY;
                        gameOver = true;
                        isAIThinking = false;
                        updateUI();
                        drawBoard();
                        showOverlay();
                        return;
                    }
                    currentPlayer = BLACK;
                    isAIThinking = false;
                    updateUI();
                    drawBoard();
                    btnUndo.disabled = (moveHistory.length < 2);
                } else {
                    isAIThinking = false;
                    updateUI();
                    drawBoard();
                }
            }, 30);
        }

        // ================================================================
        //  AI 引擎
        // ================================================================
        const SCORES = {
            FIVE: 100000,
            LIVE_FOUR: 50000,
            RUSH_FOUR: 5000,
            LIVE_THREE: 3000,
            SLEEP_THREE: 500,
            LIVE_TWO: 200,
            SLEEP_TWO: 50,
            LIVE_ONE: 10,
            SLEEP_ONE: 5,
        };

        function evaluatePoint(row, col, color) {
            if (!isOnBoard(row, col) || board[row][col] !== EMPTY) return 0;
            board[row][col] = color;
            let total = 0;
            const dirs = [
                [0, 1],
                [1, 0],
                [1, 1],
                [1, -1]
            ];
            for (const [dr, dc] of dirs) {
                let count = 1,
                    openL = false,
                    openR = false,
                    blockL = false,
                    blockR = false;
                for (let s = 1; s < 5; s++) {
                    const nr = row + dr * s,
                        nc = col + dc * s;
                    if (!isOnBoard(nr, nc)) { blockR = true; break; }
                    if (board[nr][nc] === color) { count++; continue; }
                    if (board[nr][nc] === EMPTY) { openR = true; break; }
                    blockR = true;
                    break;
                }
                for (let s = 1; s < 5; s++) {
                    const nr = row - dr * s,
                        nc = col - dc * s;
                    if (!isOnBoard(nr, nc)) { blockL = true; break; }
                    if (board[nr][nc] === color) { count++; continue; }
                    if (board[nr][nc] === EMPTY) { openL = true; break; }
                    blockL = true;
                    break;
                }
                if (count >= 5) { total += SCORES.FIVE; continue; }
                const openEnds = (openL ? 1 : 0) + (openR ? 1 : 0);
                let score = 0;
                if (count === 4) {
                    if (openEnds === 2) score = SCORES.LIVE_FOUR;
                    else if (openEnds === 1) score = SCORES.RUSH_FOUR;
                } else if (count === 3) {
                    if (openEnds === 2) score = SCORES.LIVE_THREE;
                    else if (openEnds === 1) score = SCORES.SLEEP_THREE;
                } else if (count === 2) {
                    if (openEnds === 2) score = SCORES.LIVE_TWO;
                    else if (openEnds === 1) score = SCORES.SLEEP_TWO;
                } else if (count === 1) {
                    if (openEnds === 2) score = SCORES.LIVE_ONE;
                    else if (openEnds === 1) score = SCORES.SLEEP_ONE;
                }
                total += score;
            }
            board[row][col] = EMPTY;
            return total;
        }

        function getBestMove(difficulty) {
            const empty = getEmptyCells();
            if (empty.length === 0) return null;
            if (moveHistory.length === 0) {
                const center = Math.floor(SIZE / 2);
                return { row: center, col: center };
            }

            if (difficulty === 'easy') {
                const candidates = empty.filter(cell => isNearPiece(cell.row, cell.col, 1));
                if (candidates.length > 0) return candidates[Math.floor(Math.random() * candidates.length)];
                return empty[Math.floor(Math.random() * empty.length)];
            }

            let atk, def, centerBonus, dist;
            if (difficulty === 'medium') { atk = 1.0;
                def = 1.0;
                centerBonus = 0;
                dist = 1; } else if (difficulty === 'hard') { atk = 1.2;
                def = 0.8;
                centerBonus = 2.0;
                dist = 2; } else { atk = 1.1;
                def = 0.9;
                centerBonus = 2.0;
                dist = 2; }

            const candidates = empty.filter(cell => isNearPiece(cell.row, cell.col, dist));
            if (candidates.length === 0) return empty[Math.floor(Math.random() * empty.length)];

            let bestScore = -Infinity,
                bestMove = candidates[0];
            for (const cell of candidates) {
                const { row, col } = cell;
                let score = evaluatePoint(row, col, WHITE) * atk + evaluatePoint(row, col, BLACK) * def;
                if (centerBonus > 0) {
                    const cd = Math.abs(row - 7) + Math.abs(col - 7);
                    score += (14 - cd) * centerBonus;
                }
                if (score > bestScore) { bestScore = score;
                    bestMove = cell; }
            }
            return bestMove;
        }

        // ================================================================
        //  绘图
        // ================================================================

        function drawBoard() {
            const w = canvas.width,
                h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, '#eaceac');
            grad.addColorStop(0.5, '#ddbc8a');
            grad.addColorStop(1, '#ceaa7a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            ctx.globalAlpha = 0.06;
            for (let i = 0; i < 20; i++) {
                const y = 10 + i * 30 + Math.sin(i * 0.7) * 8;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.bezierCurveTo(w * 0.3, y - 4 + Math.sin(i * 1.2) * 6, w * 0.7, y + 6 + Math.sin(i * 0.9) * 5, w, y - 2);
                ctx.strokeStyle = '#8a6a4a';
                ctx.lineWidth = 1.2;
                ctx.stroke();
            }
            ctx.globalAlpha = 1;

            ctx.strokeStyle = '#4d3220';
            ctx.lineWidth = 1.2;
            ctx.shadowColor = 'rgba(0,0,0,0.1)';
            ctx.shadowBlur = 2;
            for (let i = 0; i < SIZE; i++) {
                const pos = OFFSET + i * CELL_SIZE;
                ctx.beginPath();
                ctx.moveTo(pos, OFFSET);
                ctx.lineTo(pos, OFFSET + (SIZE - 1) * CELL_SIZE);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(OFFSET, pos);
                ctx.lineTo(OFFSET + (SIZE - 1) * CELL_SIZE, pos);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            const stars = [
                [3, 3],
                [3, 11],
                [11, 3],
                [11, 11],
                [7, 7]
            ];
            ctx.fillStyle = '#4d3220';
            for (const [r, c] of stars) {
                const x = OFFSET + c * CELL_SIZE,
                    y = OFFSET + r * CELL_SIZE;
                ctx.beginPath();
                ctx.arc(x, y, 4.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // ----- 复盘模式：从历史重建棋盘 -----
            let currentBoard = board;
            let currentLastMove = lastMove;
            let currentGameOver = gameOver;
            let currentWinCells = winCells;

            if (isReviewMode) {
                const displayBoard = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
                // 逐步执行历史记录
                for (let i = 0; i < reviewStep; i++) {
                    const record = moveHistory[i];
                    if (record.type === 'move') {
                        displayBoard[record.row][record.col] = record.color;
                    } else if (record.type === 'replace') {
                        displayBoard[record.row][record.col] = record.to; // 显示为黑子
                    }
                }
                currentBoard = displayBoard;
                // 最后一步标记
                if (reviewStep > 0) {
                    const lastRec = moveHistory[reviewStep - 1];
                    if (lastRec.type === 'move') {
                        currentLastMove = { row: lastRec.row, col: lastRec.col };
                    } else if (lastRec.type === 'replace') {
                        currentLastMove = { row: lastRec.row, col: lastRec.col };
                    } else {
                        currentLastMove = null;
                    }
                } else {
                    currentLastMove = null;
                }
                currentGameOver = false;
                currentWinCells = [];
            }

            // ----- 绘制棋子 -----
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (currentBoard[r][c] === EMPTY) continue;
                    const x = OFFSET + c * CELL_SIZE,
                        y = OFFSET + r * CELL_SIZE;
                    drawPiece(x, y, currentBoard[r][c], false);
                }
            }

            // ----- 最后一步高亮 (非复盘) -----
            if (!isReviewMode && currentLastMove) {
                const x = OFFSET + currentLastMove.col * CELL_SIZE,
                    y = OFFSET + currentLastMove.row * CELL_SIZE;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                const col = (currentBoard[currentLastMove.row] && currentBoard[currentLastMove.row][currentLastMove.col] ===
                    BLACK) ? '#ff6b4a' : '#ff3b6a';
                ctx.fillStyle = col;
                ctx.fill();
            }

            // ----- 获胜高亮 (非复盘) -----
            if (!isReviewMode && currentGameOver && winner !== EMPTY && currentWinCells.length >= 5) {
                for (const cell of currentWinCells) {
                    const x = OFFSET + cell.col * CELL_SIZE,
                        y = OFFSET + cell.row * CELL_SIZE;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(x, y, PIECE_RADIUS + 4, 0, Math.PI * 2);
                    ctx.strokeStyle = '#f5d742';
                    ctx.lineWidth = 3.5;
                    ctx.shadowColor = '#f5d742';
                    ctx.shadowBlur = 14;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            // ----- 替换模式高亮 -----
            if (!isReviewMode && cheatMode === 'replace' && hoverPos) {
                const { row, col } = hoverPos;
                if (isOnBoard(row, col) && currentBoard[row][col] === WHITE) {
                    const x = OFFSET + col * CELL_SIZE,
                        y = OFFSET + row * CELL_SIZE;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(x, y, PIECE_RADIUS + 10, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.7)';
                    ctx.lineWidth = 4;
                    ctx.setLineDash([6, 6]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.shadowBlur = 0;
                }
            }

            // ----- 悬停预览 -----
            if (!isReviewMode && hoverPos && !gameOver && !isAIThinking && currentPlayer === BLACK && cheatMode !== 'replace') {
                const { row, col } = hoverPos;
                if (isOnBoard(row, col) && currentBoard[row][col] === EMPTY) {
                    const x = OFFSET + col * CELL_SIZE,
                        y = OFFSET + row * CELL_SIZE;
                    ctx.globalAlpha = 0.4;
                    drawPiece(x, y, BLACK, true);
                    ctx.globalAlpha = 1;
                }
            }

            // ----- 高亮白子活路 -----
            if (!isReviewMode && highlightEnabled) highlightWhitePieces(currentBoard);

            // ----- 显示AI推荐点 -----
            if (!isReviewMode && bestMoveEnabled && !gameOver && !isAIThinking && cheatMode !== 'double') {
                const move = getBestMove('thunder');
                if (move) {
                    const x = OFFSET + move.col * CELL_SIZE,
                        y = OFFSET + move.row * CELL_SIZE;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(x, y, PIECE_RADIUS + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = '#00ff88';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 5]);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#00ff88';
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#8a6a4a';
            ctx.lineWidth = 2;
            ctx.strokeRect(OFFSET - 6, OFFSET - 6, (SIZE - 1) * CELL_SIZE + 12, (SIZE - 1) * CELL_SIZE + 12);
        }

        function drawPiece(x, y, color, ghost) {
            const radius = ghost ? PIECE_RADIUS * 0.9 : PIECE_RADIUS;
            ctx.shadowColor = 'rgba(0,0,0,0.35)';
            ctx.shadowBlur = ghost ? 4 : 10;
            ctx.shadowOffsetY = ghost ? 0 : 2;

            const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.35, radius * 0.08, x, y, radius);
            if (color === BLACK) {
                grad.addColorStop(0, '#666');
                grad.addColorStop(0.3, '#333');
                grad.addColorStop(0.8, '#111');
                grad.addColorStop(1, '#000');
            } else {
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.3, '#f5f5f5');
                grad.addColorStop(0.7, '#e0e0e0');
                grad.addColorStop(1, '#b8b8b8');
            }
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            if (!ghost) {
                ctx.shadowBlur = 0;
                const hl = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.35, radius * 0.02, x - radius * 0.2, y -
                    radius * 0.25, radius * 0.35);
                if (color === BLACK) {
                    hl.addColorStop(0, 'rgba(255,255,255,0.2)');
                    hl.addColorStop(1, 'rgba(255,255,255,0)');
                } else {
                    hl.addColorStop(0, 'rgba(255,255,255,0.9)');
                    hl.addColorStop(1, 'rgba(255,255,255,0)');
                }
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fillStyle = hl;
                ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.shadowOffsetY = 0;
        }

        function highlightWhitePieces(currentBoard) {
            const highlight = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));

            function processLine(coords) {
                const n = coords.length;
                for (let i = 0; i < n; i++) {
                    for (let len = 3; len <= 5 && i + len - 1 < n; len++) {
                        let wc = 0,
                            ec = 0,
                            valid = true;
                        for (let j = i; j < i + len; j++) {
                            const { row, col } = coords[j];
                            if (currentBoard[row][col] === WHITE) wc++;
                            else if (currentBoard[row][col] === EMPTY) ec++;
                            else { valid = false; break; }
                        }
                        if (!valid || wc < 3 || ec > 1) continue;
                        let openL = false,
                            openR = false;
                        if (i - 1 >= 0) {
                            const { row, col } = coords[i - 1];
                            if (currentBoard[row][col] === EMPTY) openL = true;
                        }
                        if (i + len < n) {
                            const { row, col } = coords[i + len];
                            if (currentBoard[row][col] === EMPTY) openR = true;
                        }
                        if (!openL && !openR) continue;
                        const color = (wc >= 4) ? 'red' : 'blue';
                        for (let j = i; j < i + len; j++) {
                            const { row, col } = coords[j];
                            if (currentBoard[row][col] === WHITE) {
                                if (color === 'red') highlight[row][col] = 'red';
                                else if (highlight[row][col] !== 'red') highlight[row][col] = 'blue';
                            }
                        }
                    }
                }
            }

            for (let r = 0; r < SIZE; r++) {
                const coords = [];
                for (let c = 0; c < SIZE; c++) coords.push({ row: r, col: c });
                processLine(coords);
            }
            for (let c = 0; c < SIZE; c++) {
                const coords = [];
                for (let r = 0; r < SIZE; r++) coords.push({ row: r, col: c });
                processLine(coords);
            }
            for (let start = 0; start < SIZE; start++) {
                let coords = [];
                let r = 0,
                    c = start;
                while (isOnBoard(r, c)) { coords.push({ row: r, col: c });
                    r++;
                    c++; }
                if (coords.length >= 3) processLine(coords);
                if (start !== 0) {
                    coords = [];
                    r = start;
                    c = 0;
                    while (isOnBoard(r, c)) { coords.push({ row: r, col: c });
                        r++;
                        c++; }
                    if (coords.length >= 3) processLine(coords);
                }
            }
            for (let start = 0; start < SIZE; start++) {
                let coords = [];
                let r = 0,
                    c = start;
                while (isOnBoard(r, c)) { coords.push({ row: r, col: c });
                    r++;
                    c--; }
                if (coords.length >= 3) processLine(coords);
                if (start !== 0) {
                    coords = [];
                    r = start;
                    c = SIZE - 1;
                    while (isOnBoard(r, c)) { coords.push({ row: r, col: c });
                        r++;
                        c--; }
                    if (coords.length >= 3) processLine(coords);
                }
            }

            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const color = highlight[r][c];
                    if (color === 0) continue;
                    const x = OFFSET + c * CELL_SIZE,
                        y = OFFSET + r * CELL_SIZE;
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(x, y, PIECE_RADIUS + 5, 0, Math.PI * 2);
                    ctx.strokeStyle = color === 'red' ? '#ff006e' : '#3a86ff';
                    ctx.lineWidth = color === 'red' ? 4 : 3.5;
                    ctx.shadowColor = color === 'red' ? '#ff006e' : '#3a86ff';
                    ctx.shadowBlur = 12;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }
        }

        // ---------- 遮罩 ----------
        function showOverlay() {
            if (winner === BLACK) resultText.textContent = '🎉 你赢了！';
            else if (winner === WHITE) resultText.textContent = '😵 AI 赢了...';
            else resultText.textContent = '🤝 平局';
            overlay.classList.add('show');
        }

        function hideOverlay() { overlay.classList.remove('show'); }

        // ---------- 复盘 ----------
        function enterReviewMode() {
            isReviewMode = true;
            reviewStep = moveHistory.length;
            hideOverlay();
            reviewControls.classList.add('active');
            updateProgressSlider();
            drawBoard();
            btnUndo.disabled = true;
            btnBranch.disabled = (reviewStep >= moveHistory.length);
            closeCheatPanel();
        }

        function exitReviewMode() {
            isReviewMode = false;
            reviewStep = 0;
            reviewControls.classList.remove('active');
            btnBranch.disabled = true;
        }

        function updateProgressSlider() {
            const total = moveHistory.length;
            progressSlider.max = total;
            progressSlider.value = reviewStep;
            stepLabel.textContent = `${reviewStep}/${total}`;
            stepCount.textContent = reviewStep;
            btnBranch.disabled = (reviewStep >= total);
        }

        function branchFromCurrentStep() {
            if (!isReviewMode) return;
            const step = reviewStep;
            if (step >= moveHistory.length) return;
            moveHistory = moveHistory.slice(0, step);
            board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
            // 重建棋盘
            for (const record of moveHistory) {
                if (record.type === 'move') {
                    board[record.row][record.col] = record.color;
                } else if (record.type === 'replace') {
                    board[record.row][record.col] = record.to;
                }
            }
            lastMove = moveHistory.length > 0 ? {
                row: moveHistory[moveHistory.length - 1].row,
                col: moveHistory[moveHistory.length - 1].col
            } : null;
            // 确定当前玩家
            if (moveHistory.length === 0) {
                currentPlayer = BLACK;
            } else {
                const last = moveHistory[moveHistory.length - 1];
                if (last.type === 'move') {
                    currentPlayer = (last.color === BLACK) ? WHITE : BLACK;
                } else if (last.type === 'replace') {
                    // 替换操作不改变回合，需要看替换前的状态
                    // 简单处理：检查上一步
                    if (moveHistory.length >= 2) {
                        const prev = moveHistory[moveHistory.length - 2];
                        if (prev.type === 'move') {
                            currentPlayer = (prev.color === BLACK) ? WHITE : BLACK;
                        } else {
                            currentPlayer = BLACK;
                        }
                    } else {
                        currentPlayer = BLACK;
                    }
                }
            }
            gameOver = false;
            winner = EMPTY;
            winCells = [];
            exitReviewMode();
            hideOverlay();
            cheatMode = null;
            doubleCount = 0;
            [cheatReplace, cheatDouble, cheatWin].forEach(b => b.classList.remove('active-mode'));
            updateUI();
            drawBoard();
            btnUndo.disabled = (moveHistory.length < 2);
            if (currentPlayer === WHITE && !gameOver) triggerAI();
        }

        progressSlider.addEventListener('input', function() {
            if (!isReviewMode) return;
            reviewStep = parseInt(this.value);
            stepLabel.textContent = `${reviewStep}/${moveHistory.length}`;
            stepCount.textContent = reviewStep;
            btnBranch.disabled = (reviewStep >= moveHistory.length);
            drawBoard();
        });

        btnExitReview.addEventListener('click', function() {
            if (isReviewMode) { exitReviewMode();
                showOverlay();
                drawBoard();
                updateUI(); }
        });
        btnBranch.addEventListener('click', branchFromCurrentStep);

        // ---------- UI ----------
        function updateUI() {
            if (gameOver) {
                if (winner === BLACK) { turnDot.className = 'turn-dot black win';
                    statusText.textContent = '🎉 你赢了!'; } else if (winner === WHITE) { turnDot.className =
                        'turn-dot white win';
                    statusText.textContent = '😵 AI 赢了...'; } else { turnDot.className = 'turn-dot';
                    statusText.textContent = '🤝 平局'; }
                btnUndo.disabled = true;
                return;
            }
            if (isAIThinking) { turnDot.className = 'turn-dot white';
                statusText.textContent = 'AI 思考中...';
                btnUndo.disabled = true; return; }
            if (cheatMode === 'double') {
                if (doubleCount === 0) statusText.textContent = '下第1颗 ✌️';
                else if (doubleCount === 1) statusText.textContent = '下第2颗 ✌️';
                turnDot.className = 'turn-dot black';
                btnUndo.disabled = true;
                return;
            }
            if (cheatMode === 'replace') {
                statusText.textContent = '点击白子替换';
                turnDot.className = 'turn-dot black';
                btnUndo.disabled = true;
                return;
            }
            if (currentPlayer === BLACK) { turnDot.className = 'turn-dot black';
                statusText.textContent = '你的回合';
                btnUndo.disabled = (moveHistory.length < 2); } else { turnDot.className = 'turn-dot white';
                statusText.textContent = 'AI 回合';
                btnUndo.disabled = true; }
        }

        // ---------- 外挂面板 ----------
        function toggleCheatPanel(e) {
            e.stopPropagation();
            isCheatPanelOpen = !isCheatPanelOpen;
            cheatPanel.classList.toggle('open', isCheatPanelOpen);
            cheatMenuBtn.classList.toggle('active', isCheatPanelOpen);
        }

        function closeCheatPanel() {
            isCheatPanelOpen = false;
            cheatPanel.classList.remove('open');
            cheatMenuBtn.classList.remove('active');
        }

        function updateCheatTip(msg) {
            cheatTip.textContent = msg;
        }

        // ---------- 外挂：替换 ----------
        function toggleReplaceMode() {
            if (gameOver || isReviewMode) {
                updateCheatTip('游戏已结束或复盘中，无法使用');
                return;
            }
            if (isAIThinking) {
                updateCheatTip('AI思考中，请稍候');
                return;
            }

            if (cheatMode === 'replace') {
                cheatMode = null;
                cheatReplace.classList.remove('active-mode');
                updateCheatTip('已退出替换模式');
                updateUI();
                drawBoard();
                return;
            }

            if (cheatMode === 'double') {
                cheatDouble.classList.remove('active-mode');
                doubleCount = 0;
            }
            cheatMode = 'replace';
            cheatReplace.classList.add('active-mode');
            updateCheatTip('点击棋盘上的白子将其变为黑子');
            updateUI();
            drawBoard();
            closeCheatPanel();
        }

        // ---------- 外挂：下两颗 ----------
        function toggleDoubleMode() {
            if (gameOver || isReviewMode) {
                updateCheatTip('游戏已结束或复盘中，无法使用');
                return;
            }
            if (isAIThinking) {
                updateCheatTip('AI思考中，请稍候');
                return;
            }
            if (currentPlayer !== BLACK) {
                updateCheatTip('只能在你的回合使用下两颗');
                return;
            }

            if (cheatMode === 'double') {
                cheatMode = null;
                doubleCount = 0;
                cheatDouble.classList.remove('active-mode');
                updateCheatTip('已退出下两颗模式');
                updateUI();
                drawBoard();
                return;
            }

            if (cheatMode === 'replace') {
                cheatReplace.classList.remove('active-mode');
            }
            cheatMode = 'double';
            doubleCount = 0;
            cheatDouble.classList.add('active-mode');
            updateCheatTip('下第一颗黑子 ✌️');
            updateUI();
            drawBoard();
            closeCheatPanel();
        }

        // ---------- 外挂：Win！ ----------
        function forceWin() {
            if (gameOver || isReviewMode) {
                updateCheatTip('游戏已结束或复盘中');
                return;
            }
            if (isAIThinking) {
                updateCheatTip('AI思考中，请稍候');
                return;
            }

            winner = BLACK;
            gameOver = true;
            if (moveHistory.length === 0) {
                const center = Math.floor(SIZE / 2);
                board[center][center] = BLACK;
                moveHistory.push({ type: 'move', row: center, col: center, color: BLACK });
                lastMove = { row: center, col: center };
                winCells = [{ row: center, col: center }];
            } else {
                let found = false;
                for (let i = moveHistory.length - 1; i >= 0; i--) {
                    const rec = moveHistory[i];
                    let pos = null;
                    if (rec.type === 'move') pos = { row: rec.row, col: rec.col };
                    else if (rec.type === 'replace') pos = { row: rec.row, col: rec.col };
                    if (pos && board[pos.row] && board[pos.row][pos.col] === BLACK) {
                        winCells = [{ row: pos.row, col: pos.col }];
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    const center = Math.floor(SIZE / 2);
                    if (board[center][center] === EMPTY) {
                        board[center][center] = BLACK;
                        moveHistory.push({ type: 'move', row: center, col: center, color: BLACK });
                        lastMove = { row: center, col: center };
                        winCells = [{ row: center, col: center }];
                    } else if (board[center][center] === BLACK) {
                        winCells = [{ row: center, col: center }];
                    } else {
                        winCells = [{ row: 7, col: 7 }];
                    }
                }
            }

            updateUI();
            drawBoard();
            showOverlay();
            updateCheatTip('🏆 直接获胜！');
            closeCheatPanel();

            cheatMode = null;
            doubleCount = 0;
            [cheatReplace, cheatDouble, cheatWin].forEach(b => b.classList.remove('active-mode'));
        }

        // ---------- 事件：棋盘点击 ----------
        function handleCanvasClick(e) {
            if (isReviewMode) return;
            if (gameOver) return;
            if (isAIThinking) return;

            const pos = getBoardPos(e);
            if (!pos) return;
            const { row, col } = pos;

            // ---- 替换模式 ----
            if (cheatMode === 'replace') {
                if (board[row][col] === WHITE) {
                    executeReplace(row, col);
                    return;
                } else {
                    updateCheatTip('请点击白子（AI的棋子）');
                    return;
                }
            }

            // ---- 下两颗模式 ----
            if (cheatMode === 'double') {
                if (board[row][col] !== EMPTY) {
                    updateCheatTip('这个位置已有棋子');
                    return;
                }
                board[row][col] = BLACK;
                moveHistory.push({ type: 'move', row, col, color: BLACK });
                lastMove = { row, col };

                if (checkWin(row, col, BLACK)) {
                    winner = BLACK;
                    gameOver = true;
                    cheatMode = null;
                    doubleCount = 0;
                    cheatDouble.classList.remove('active-mode');
                    updateUI();
                    drawBoard();
                    showOverlay();
                    updateCheatTip('下两颗后获胜！🏆');
                    closeCheatPanel();
                    return;
                }

                if (isBoardFull()) {
                    winner = EMPTY;
                    gameOver = true;
                    cheatMode = null;
                    doubleCount = 0;
                    cheatDouble.classList.remove('active-mode');
                    updateUI();
                    drawBoard();
                    showOverlay();
                    updateCheatTip('平局');
                    closeCheatPanel();
                    return;
                }

                doubleCount++;
                if (doubleCount >= 2) {
                    cheatMode = null;
                    doubleCount = 0;
                    cheatDouble.classList.remove('active-mode');
                    currentPlayer = WHITE;
                    updateCheatTip('两颗已下完，轮到AI');
                    updateUI();
                    drawBoard();
                    if (currentPlayer === WHITE && !gameOver) {
                        triggerAI();
                    }
                    closeCheatPanel();
                } else {
                    updateCheatTip('下第二颗黑子 ✌️');
                    updateUI();
                    drawBoard();
                }
                return;
            }

            // ---- 正常落子 ----
            if (currentPlayer !== BLACK) {
                updateCheatTip('轮到AI，请稍候');
                return;
            }
            if (board[row][col] !== EMPTY) return;
            placePiece(row, col, BLACK);
            btnUndo.disabled = (moveHistory.length < 2);
        }

        // ---------- 鼠标移动 ----------
        function handleMouseMove(e) {
            if (isReviewMode) { hoverPos = null;
                drawBoard(); return; }
            const pos = getBoardPos(e);
            hoverPos = pos || null;
            drawBoard();

            // 更新外挂按钮鼠标坐标 (液态玻璃光影)
            if (cheatPanel.classList.contains('open')) {
                const btns = cheatPanel.querySelectorAll('.cheat-btn');
                btns.forEach(btn => {
                    const rect = btn.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    btn.style.setProperty('--mouse-x', x + '%');
                    btn.style.setProperty('--mouse-y', y + '%');
                });
            }
        }

        function handleMouseLeave() { hoverPos = null;
            drawBoard(); }

        function getBoardPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width,
                scaleY = canvas.height / rect.height;
            let cx, cy;
            if (e.touches) { cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
                e.preventDefault(); } else { cx = e.clientX;
                cy = e.clientY; }
            const x = (cx - rect.left) * scaleX,
                y = (cy - rect.top) * scaleY;
            const col = Math.round((x - OFFSET) / CELL_SIZE),
                row = Math.round((y - OFFSET) / CELL_SIZE);
            if (isOnBoard(row, col)) {
                const px = OFFSET + col * CELL_SIZE,
                    py = OFFSET + row * CELL_SIZE;
                if (Math.hypot(x - px, y - py) < CELL_SIZE * 0.5) return { row, col };
            }
            return null;
        }

        // ---------- 悔棋 (支持替换操作撤销) ----------
        function undoMove() {
            if (gameOver || isAIThinking) return;
            // 至少要有两步才能悔棋
            if (moveHistory.length < 2) return;

            if (cheatMode) {
                cheatMode = null;
                doubleCount = 0;
                [cheatReplace, cheatDouble, cheatWin].forEach(b => b.classList.remove('active-mode'));
                updateCheatTip('已退出外挂模式');
            }

            // 撤销最后两步
            const last = moveHistory.pop();
            undoStep(last);
            const prev = moveHistory.pop();
            undoStep(prev);

            // 更新最后一步标记
            if (moveHistory.length > 0) {
                const lastRec = moveHistory[moveHistory.length - 1];
                if (lastRec.type === 'move') {
                    lastMove = { row: lastRec.row, col: lastRec.col };
                } else if (lastRec.type === 'replace') {
                    lastMove = { row: lastRec.row, col: lastRec.col };
                } else {
                    lastMove = null;
                }
            } else {
                lastMove = null;
            }

            // 重置获胜状态
            winCells = [];
            winner = EMPTY;
            gameOver = false;

            // 确定当前玩家
            if (moveHistory.length === 0) {
                currentPlayer = BLACK;
            } else {
                const lastRec = moveHistory[moveHistory.length - 1];
                if (lastRec.type === 'move') {
                    currentPlayer = (lastRec.color === BLACK) ? WHITE : BLACK;
                } else if (lastRec.type === 'replace') {
                    // 替换操作不改变回合，看上一步
                    if (moveHistory.length >= 2) {
                        const prevRec = moveHistory[moveHistory.length - 2];
                        if (prevRec.type === 'move') {
                            currentPlayer = (prevRec.color === BLACK) ? WHITE : BLACK;
                        } else {
                            currentPlayer = BLACK;
                        }
                    } else {
                        currentPlayer = BLACK;
                    }
                } else {
                    currentPlayer = BLACK;
                }
            }

            updateUI();
            drawBoard();
            btnUndo.disabled = (moveHistory.length < 2);
            hideOverlay();
            if (currentPlayer === WHITE && !gameOver) {
                triggerAI();
            }
        }

        function undoStep(record) {
            if (record.type === 'move') {
                board[record.row][record.col] = EMPTY;
            } else if (record.type === 'replace') {
                board[record.row][record.col] = record.from; // 恢复为白子
            }
        }

        // ---------- 重置 ----------
        function resetGame() {
            if (isAIThinking) return;
            closeCheatPanel();
            cheatMode = null;
            doubleCount = 0;
            [cheatReplace, cheatDouble, cheatWin].forEach(b => b.classList.remove('active-mode'));
            initBoard();
            hideOverlay();
            reviewControls.classList.remove('active');
            isReviewMode = false;
            drawBoard();
        }

        // ---------- 注册事件 ----------
        btnReset.addEventListener('click', resetGame);
        btnUndo.addEventListener('click', undoMove);
        btnNextGame.addEventListener('click', resetGame);
        btnReview.addEventListener('click', function() { if (moveHistory.length > 0) enterReviewMode(); });

        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('mouseleave', handleMouseLeave);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault();
            handleCanvasClick(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault();
            handleMouseMove(e); }, { passive: false });

        cheatMenuBtn.addEventListener('click', toggleCheatPanel);
        document.addEventListener('click', function(e) {
            if (isCheatPanelOpen && !cheatPanel.contains(e.target) && e.target !== cheatMenuBtn) {
                closeCheatPanel();
            }
        });

        cheatReplace.addEventListener('click', function(e) { e.stopPropagation();
            toggleReplaceMode(); });
        cheatDouble.addEventListener('click', function(e) { e.stopPropagation();
            toggleDoubleMode(); });
        cheatWin.addEventListener('click', function(e) { e.stopPropagation();
            forceWin(); });

        // ================================================================
        //  定制控件交互
        // ================================================================

        toggleHighlight.addEventListener('click', function(e) {
            e.stopPropagation();
            highlightEnabled = !highlightEnabled;
            trackHighlight.classList.toggle('active', highlightEnabled);
            drawBoard();
        });

        toggleBestMove.addEventListener('click', function(e) {
            e.stopPropagation();
            bestMoveEnabled = !bestMoveEnabled;
            trackBestMove.classList.toggle('active', bestMoveEnabled);
            drawBoard();
        });

        function moveDifficultySlider() {
            const active = difficultyControl.querySelector('.segmented-option.active');
            if (!active) return;
            const optRect = active.getBoundingClientRect();
            const ctrlRect = difficultyControl.getBoundingClientRect();
            const left = optRect.left - ctrlRect.left;
            const width = optRect.width;
            difficultySlider.style.left = left + 'px';
            difficultySlider.style.width = width + 'px';
        }

        diffOptions.forEach(opt => {
            opt.addEventListener('click', function(e) {
                e.stopPropagation();
                diffOptions.forEach(o => o.classList.remove('active'));
                this.classList.add('active');
                currentDifficulty = this.dataset.value;
                moveDifficultySlider();
                if (!gameOver && !isAIThinking) drawBoard();
            });
        });

        window.addEventListener('resize', moveDifficultySlider);
        setTimeout(moveDifficultySlider, 30);
        new MutationObserver(moveDifficultySlider).observe(difficultyControl, { attributes: true, childList: true,
            subtree: true });
        difficultyControl.addEventListener('click', function(e) { e.stopPropagation(); });

        // ================================================================
        //  启动
        // ================================================================
        initBoard();

        trackHighlight.classList.remove('active');
        trackBestMove.classList.remove('active');
        highlightEnabled = false;
        bestMoveEnabled = false;

        currentDifficulty = 'thunder';
        diffOptions.forEach(o => o.classList.remove('active'));
        document.querySelector('.segmented-option[data-value="thunder"]').classList.add('active');
        setTimeout(moveDifficultySlider, 50);

        console.log('♟ 五子棋 AI 对战 · 液态玻璃外挂菜单');
        console.log('⚡ 外挂功能：替换白子 | 下两颗 | 直接获胜');
        console.log('✅ 替换操作已正确记录到历史，复盘可见');
        console.log('✅ 外挂菜单弹出动画已修复');
        console.log('点击右上角 ⚙ 打开外挂菜单');

        window.__debug = { board, moveHistory, getBestMove, evaluatePoint, placePiece, resetGame };
    </script>

</body>
</html>
