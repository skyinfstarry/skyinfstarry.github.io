<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>万物自指公式 · 粒子感应版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e6edf7;
    -webkit-font-smoothing: antialiased;
  }
  #scene { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }

  button {
    font: inherit; font-size: 12.5px; padding: 7px 14px;
    border-radius: 8px; border: 1px solid rgba(90,130,190,.28);
    background: rgba(30,45,70,.72); color: #c3d0e2;
    cursor: pointer; white-space: nowrap;
    transition: background .16s, border-color .16s, color .16s, transform .08s;
  }
  button:hover { background: rgba(45,68,104,.9); border-color: rgba(120,170,240,.5); color: #fff; }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(135deg, rgba(29,78,216,.95), rgba(76,201,240,.95));
    border-color: rgba(76,201,240,.8); color: #fff;
    box-shadow: 0 0 22px -6px rgba(76,201,240,.7);
  }
  button.primary:hover { filter: brightness(1.12); }
  button.copied { background: rgba(20,83,45,.95); border-color: #22c55e; color: #86efac; }

  input[type="text"], input[type="number"] {
    font: inherit; border-radius: 8px;
    border: 1px solid rgba(90,130,190,.28);
    background: rgba(8,13,22,.85); color: #e6edf7;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  input[type="text"]::placeholder { color: #4d5c72; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  input:focus {
    border-color: rgba(76,201,240,.8);
    box-shadow: 0 0 0 3px rgba(76,201,240,.14);
  }

  .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b7d99; white-space: nowrap; }

  /* ============ 自绘下拉 ============ */
  .sel { position: relative; display: inline-block; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .sel-trigger {
    display: inline-flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 10px 8px 12px; min-width: 112px;
    border-radius: 8px; border: 1px solid rgba(90,130,190,.28);
    background: rgba(30,45,70,.72); color: #c3d0e2;
    font: inherit; font-size: 12.5px; cursor: pointer;
    transition: background .16s, border-color .16s, color .16s, box-shadow .16s;
  }
  .sel-trigger:hover { background: rgba(45,68,104,.9); border-color: rgba(120,170,240,.5); color: #fff; }
  .sel.open .sel-trigger {
    border-color: rgba(76,201,240,.85);
    box-shadow: 0 0 0 3px rgba(76,201,240,.14);
    color: #fff; background: rgba(45,68,104,.95);
  }
  .sel-trigger .sel-label { flex: 1 1 auto; text-align: left; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sel-arrow { width: 9px; height: 6px; flex: 0 0 auto; opacity: .65; transition: transform .2s ease, opacity .2s; }
  .sel.open .sel-arrow { transform: rotate(180deg); opacity: 1; color: #7dd3fc; }

  .sel-panel {
    position: absolute; bottom: calc(100% + 7px); left: 0; min-width: 100%;
    padding: 5px; border-radius: 10px;
    border: 1px solid rgba(90,130,190,.4);
    background: rgba(14,20,32,.97);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 18px 48px -14px rgba(0,0,0,.95), 0 0 0 1px rgba(76,201,240,.06);
    opacity: 0; transform: translateY(8px) scale(.96);
    transform-origin: bottom left; pointer-events: none;
    transition: opacity .16s ease, transform .16s ease;
    z-index: 40;
  }
  .sel.open .sel-panel { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

  .sel-opt {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 8px 11px; border-radius: 6px;
    font-size: 12.5px; color: #c3d0e2; cursor: pointer; white-space: nowrap;
    transition: background .12s, color .12s;
  }
  .sel-opt:hover { background: rgba(76,201,240,.14); color: #fff; }
  .sel-opt.selected { color: #7dd3fc; }
  .sel-opt.selected::after {
    content: ""; width: 5px; height: 9px;
    border-right: 1.6px solid #7dd3fc; border-bottom: 1.6px solid #7dd3fc;
    transform: rotate(45deg) translate(-1px, -1px); flex: 0 0 auto;
  }

  /* ============ 自绘复选框 ============ */
  .chk {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px 7px 10px; border-radius: 8px;
    border: 1px solid rgba(90,130,190,.28);
    background: rgba(30,45,70,.72); color: #c3d0e2;
    font-size: 12.5px; cursor: pointer; user-select: none; -webkit-user-select: none;
    transition: background .16s, border-color .16s, color .16s, box-shadow .16s;
    white-space: nowrap; outline: none;
  }
  .chk:hover { background: rgba(45,68,104,.9); border-color: rgba(120,170,240,.5); color: #fff; }
  .chk:focus-visible { border-color: rgba(76,201,240,.85); box-shadow: 0 0 0 3px rgba(76,201,240,.14); }
  .chk-box {
    width: 15px; height: 15px; flex: 0 0 auto; border-radius: 4px;
    border: 1.6px solid rgba(120,170,240,.5);
    background: rgba(8,13,22,.85);
    display: flex; align-items: center; justify-content: center;
    transition: background .18s, border-color .18s, box-shadow .18s;
  }
  .chk.checked .chk-box {
    background: linear-gradient(135deg, rgba(29,78,216,.95), rgba(76,201,240,.95));
    border-color: rgba(76,201,240,.9);
    box-shadow: 0 0 12px -2px rgba(76,201,240,.65);
  }
  .chk-box svg { opacity: 0; transform: scale(.4); transition: opacity .16s, transform .16s; }
  .chk.checked .chk-box svg { opacity: 1; transform: scale(1); }
  .chk.checked { color: #fff; }

  /* ============ 顶部栏 ============ */
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    background: rgba(10,15,25,.86);
    border-bottom: 1px solid rgba(90,130,190,.22);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 10px 34px -22px rgba(0,0,0,.95);
    padding: 11px 18px 12px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .y-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .y-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .y-value {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14.5px; line-height: 1.55; color: #7dd3fc;
    word-break: break-all; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(76,201,240,.35);
    max-height: 132px; overflow-y: auto; overflow-x: hidden;
    padding-right: 4px; letter-spacing: .2px;
  }
  .y-value.empty { color: #3f4c60; text-shadow: none; }

  .decode-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #yInput { flex: 1 1 260px; min-width: 0; font-size: 13px; padding: 8px 12px; }
  .mini-status {
    font-size: 11.5px; color: #6b7d99; letter-spacing: .04em;
    min-height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mini-status.ok { color: #6ee7b7; }
  .mini-status.warn { color: #f0a04b; }
  .mini-status.err { color: #f87171; }

  /* ============ 底部栏 ============ */
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(10,15,25,.86);
    border-top: 1px solid rgba(90,130,190,.22);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 -10px 34px -22px rgba(0,0,0,.95);
    padding: 11px 18px 12px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1 1 180px; display: flex; gap: 8px; min-width: 0; align-items: center; }
  #textInput { flex: 1 1 auto; min-width: 0; font-size: 13px; padding: 8px 12px; }
  .spacer { flex: 1 1 0; min-width: 0; }
  .tool-group { display: flex; gap: 8px; flex-shrink: 0; }

  #customScale { width: 72px; font-size: 12.5px; padding: 8px 10px; display: none; }
  .scale-info { font-size: 11.5px; color: #6b7d99; font-variant-numeric: tabular-nums; padding-left: 2px; }

  .mode-badge {
    font-size: 11px; letter-spacing: .06em;
    padding: 4px 9px; border-radius: 6px;
    border: 1px solid rgba(90,130,190,.28);
    background: rgba(30,45,70,.5); color: #8b98ad;
    font-variant-numeric: tabular-nums;
    transition: color .2s, border-color .2s, background .2s;
    white-space: nowrap;
  }
  .mode-badge.worker { color: #6ee7b7; border-color: rgba(110,231,183,.35); background: rgba(20,83,45,.35); }
  .mode-badge.main   { color: #f0a04b; border-color: rgba(240,160,75,.35); background: rgba(80,50,15,.35); }
  .mode-badge.init   { color: #7dd3fc; border-color: rgba(125,211,252,.35); background: rgba(20,50,80,.35); }
  .mode-badge.dead   { color: #f87171; border-color: rgba(248,113,113,.35); background: rgba(80,20,20,.35); }

  .hint {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 9;
    color: rgba(160,185,220,.42); font-size: 12.5px; letter-spacing: .1em;
    user-select: none; pointer-events: none;
    transition: opacity .7s ease; white-space: nowrap;
  }
  .hint.fade { opacity: 0; }

  @media (max-width: 720px) {
    .top-bar, .bottom-bar { padding: 9px 12px 10px; gap: 7px; }
    .y-value { font-size: 13px; max-height: 96px; }
    #yInput { flex: 1 1 140px; font-size: 12.5px; padding: 7px 10px; }
    .mini-status { flex: 1 1 100%; }
    .row { gap: 7px; }
    .grow { flex: 1 1 100%; }
    .spacer { display: none; }
    .tool-group { width: 100%; justify-content: flex-end; }
    .hint { display: none; }
    .mode-badge { font-size: 10.5px; padding: 3px 7px; }
    .sel-trigger { min-width: 96px; padding: 7px 9px 7px 11px; }
    .sel-panel { max-height: 260px; overflow-y: auto; }
    .chk { font-size: 12px; padding: 6px 10px 6px 9px; }
    .y-actions button { padding: 6px 11px; font-size: 12px; }
  }
</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="top-bar" id="topBar">
    <div class="y-row">
      <span class="label">y 起始值 &nbsp;y₀</span>
      <div class="y-actions">
        <button class="primary" id="copyY">复制 y₀</button>
        <button id="btnDownload">下载 HTML</button>
      </div>
    </div>
    <div class="y-value empty" id="yVal">0</div>

    <div class="decode-row">
      <span class="label">输入 y₀ 还原图案</span>
      <input id="yInput" type="text" placeholder="粘贴任意 y₀，回车还原…"
             inputmode="numeric" autocomplete="off" spellcheck="false" />
      <button id="btnDecode" class="primary">还原</button>
      <span class="mini-status" id="yStatus"></span>
    </div>
  </div>

  <div class="bottom-bar" id="bottomBar">
    <div class="row">
      <div class="grow">
        <input id="textInput" type="text" placeholder="输入文字后回车…"
               maxlength="20" autocomplete="off" spellcheck="false" />

        <div class="sel" id="fontSel" data-value="sans">
          <button type="button" class="sel-trigger" aria-haspopup="listbox">
            <span class="sel-label">无衬线</span>
            <svg class="sel-arrow" viewBox="0 0 10 6" fill="none" aria-hidden="true">
              <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="sel-panel" role="listbox">
            <div class="sel-opt selected" data-value="sans" role="option">无衬线</div>
            <div class="sel-opt" data-value="serif" role="option">衬线</div>
            <div class="sel-opt" data-value="mono" role="option">等宽</div>
          </div>
        </div>

        <button id="btnDraw" class="primary">画文字</button>
      </div>
      <div class="tool-group">
        <button id="btnClear">清空</button>
        <button id="btnInvert">反色</button>
        <button id="btnRandom">随机</button>
      </div>
    </div>

    <div class="row">
      <span class="label">分辨率</span>

      <div class="sel" id="scaleSel" data-value="1">
        <button type="button" class="sel-trigger" aria-haspopup="listbox">
          <span class="sel-label">经典 ×1</span>
          <svg class="sel-arrow" viewBox="0 0 10 6" fill="none" aria-hidden="true">
            <path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="sel-panel" role="listbox">
          <div class="sel-opt selected" data-value="1" role="option">经典 ×1</div>
          <div class="sel-opt" data-value="2" role="option">×2</div>
          <div class="sel-opt" data-value="3" role="option">×3</div>
          <div class="sel-opt" data-value="5" role="option">×5</div>
          <div class="sel-opt" data-value="custom" role="option">自定义</div>
        </div>
      </div>

      <input id="customScale" type="number" min="1" max="10" value="4" />
      <span class="scale-info" id="scaleInfo">106 × 17</span>

      <!-- 鼠标感应开关（默认勾选） -->
      <div class="chk checked" id="mouseRepelChk" role="checkbox" aria-checked="true" tabindex="0">
        <span class="chk-box">
          <svg viewBox="0 0 12 10" width="10" height="8" fill="none" aria-hidden="true">
            <path d="M1 5L4.5 8.5L11 1.5" stroke="#fff" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>鼠标感应</span>
      </div>

      <span class="mode-badge init" id="modeBadge">计算模式 · 初始化中</span>
    </div>
  </div>

  <div class="hint" id="hint">移动鼠标让粒子感应散开 · 点击方格涂黑</div>

<script>
(function () {
  "use strict";

  /* ==================== 配置 ==================== */
  const BASE_COLS = 106;
  const BASE_ROWS = 17;

  let COLS = BASE_COLS;
  let ROWS = BASE_ROWS;
  let TOTAL = COLS * ROWS;

  const REPEL_RADIUS = 110;
  const REPEL_FORCE  = 1.05;
  const SPRING       = 0.021;
  const FRICTION     = 0.865;

  /* ==================== DOM ==================== */
  const canvas    = document.getElementById("scene");
  const ctx       = canvas.getContext("2d", { alpha: false });
  const hint      = document.getElementById("hint");
  const yValEl    = document.getElementById("yVal");
  const yStatus   = document.getElementById("yStatus");
  const topBar    = document.getElementById("topBar");
  const bottomBar = document.getElementById("bottomBar");
  const scaleInfo = document.getElementById("scaleInfo");
  const modeBadge = document.getElementById("modeBadge");

  let DPR = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0;
  let CELL = 12, originX = 0, originY = 0;

  /* ==================== 状态 ==================== */
  let gridData  = new Uint8Array(TOTAL);
  let particles = new Array(TOTAL).fill(null);
  const mouse = { x: -9999, y: -9999, active: false };
  let rawY = "0";

  // ★ 鼠标感应开关：默认开启
  let mouseRepel = true;

  /* ====================================================
     自绘下拉组件
     ==================================================== */
  function closeAllSelects(except) {
    const list = document.querySelectorAll(".sel.open");
    for (let i = 0; i < list.length; i++) {
      if (list[i] !== except) list[i].classList.remove("open");
    }
  }

  function createSelect(rootEl, onChange) {
    const trigger = rootEl.querySelector(".sel-trigger");
    const labelEl = rootEl.querySelector(".sel-label");
    const options = Array.prototype.slice.call(rootEl.querySelectorAll(".sel-opt"));

    let value = rootEl.dataset.value || (options[0] && options[0].dataset.value) || "";

    function render() {
      for (let i = 0; i < options.length; i++) {
        const opt = options[i];
        const isSel = opt.dataset.value === value;
        opt.classList.toggle("selected", isSel);
        if (isSel) labelEl.textContent = opt.textContent.trim();
      }
      rootEl.dataset.value = value;
    }

    function setValue(v, silent) {
      if (v === value) return;
      value = v;
      render();
      if (!silent && onChange) onChange(v);
    }

    function open() {
      closeAllSelects(rootEl);
      rootEl.classList.add("open");
      trigger.setAttribute("aria-expanded", "true");
    }
    function close() {
      rootEl.classList.remove("open");
      trigger.setAttribute("aria-expanded", "false");
    }

    trigger.addEventListener("click", function (e) {
      e.stopPropagation();
      if (rootEl.classList.contains("open")) close();
      else open();
    });

    for (let i = 0; i < options.length; i++) {
      (function (opt) {
        opt.addEventListener("click", function (e) {
          e.stopPropagation();
          const v = opt.dataset.value;
          close();
          setValue(v);
        });
      })(options[i]);
    }

    trigger.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (!rootEl.classList.contains("open")) { open(); return; }
        let idx = options.findIndex(function (o) { return o.dataset.value === value; });
        let next = e.key === "ArrowDown" ? idx + 1 : idx - 1;
        if (next < 0) next = options.length - 1;
        if (next >= options.length) next = 0;
        setValue(options[next].dataset.value);
      } else if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        if (rootEl.classList.contains("open")) close();
        else open();
      } else if (e.key === "Escape") {
        e.preventDefault();
        close();
      }
    });

    trigger.setAttribute("aria-expanded", "false");
    render();

    return {
      get value() { return value; },
      setValue: function (v) { setValue(v); },
      close: close
    };
  }

  document.addEventListener("click", function () { closeAllSelects(null); });
  window.addEventListener("blur", function () { closeAllSelects(null); });

  /* ====================================================
     自绘复选框
     ==================================================== */
  function createCheckbox(rootEl, onChange) {
    let checked = rootEl.classList.contains("checked");

    function render() {
      rootEl.classList.toggle("checked", checked);
      rootEl.setAttribute("aria-checked", checked ? "true" : "false");
    }

    function toggle() {
      checked = !checked;
      render();
      if (onChange) onChange(checked);
    }

    rootEl.addEventListener("click", function (e) {
      e.preventDefault();
      toggle();
    });

    rootEl.addEventListener("keydown", function (e) {
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        toggle();
      }
    });

    render();

    return {
      get checked() { return checked; },
      setChecked: function (v) {
        v = !!v;
        if (v === checked) return;
        checked = v;
        render();
        if (onChange) onChange(checked);
      }
    };
  }

  /* ====================================================
     编解码
     ==================================================== */
  function encodeGridMain(grid, cols, rows) {
    const total = cols * rows;
    const bits = new Array(total);
    for (let bit = total - 1, i = 0; bit >= 0; bit--, i++) {
      const c = Math.floor(bit / rows);
      const r = rows - 1 - (bit % rows);
      bits[i] = grid[r * cols + c] ? "1" : "0";
    }
    const bin = bits.join("");
    if (bin.indexOf("1") === -1) return "0";
    return (BigInt("0b" + bin) * BigInt(rows)).toString();
  }

  function decodeYMain(y0Str, cols, rows) {
    const total = cols * rows;
    const H = BigInt(rows);

    let y0Big;
    try { y0Big = BigInt(String(y0Str).replace(/[^0-9]/g, "") || "0"); }
    catch (e) { y0Big = 0n; }

    const m = y0Big / H;
    const wasAligned = (y0Big % H) === 0n;
    const alignedY0 = (m * H).toString();

    let bin = m.toString(2);
    if (bin.length > total) bin = bin.slice(bin.length - total);
    while (bin.length < total) bin = "0" + bin;

    const grid = new Uint8Array(total);
    for (let i = 0; i < total; i++) {
      if (bin.charCodeAt(i) === 49) {
        const bit = total - 1 - i;
        const c = Math.floor(bit / rows);
        const r = rows - 1 - (bit % rows);
        grid[r * cols + c] = 1;
      }
    }
    return { grid: grid, alignedY0: alignedY0, wasAligned: wasAligned };
  }

  /* ====================================================
     Worker + 健康检查 + 降级
     ==================================================== */
  const workerSrc = [
    'self.onmessage = function(e) {',
    '  var d = e.data;',
    '  if (d.type === "ping") {',
    '    self.postMessage({ type: "pong", reqId: d.reqId });',
    '    return;',
    '  }',
    '  if (d.type === "encode") {',
    '    var grid = d.grid, cols = d.cols, rows = d.rows;',
    '    var total = cols * rows;',
    '    var s = "";',
    '    for (var bit = total - 1; bit >= 0; bit--) {',
    '      var c = Math.floor(bit / rows);',
    '      var r = rows - 1 - (bit % rows);',
    '      s += grid[r * cols + c] ? "1" : "0";',
    '    }',
    '    var y0 = 0n;',
    '    if (s.indexOf("1") !== -1) {',
    '      y0 = BigInt("0b" + s) * BigInt(rows);',
    '    }',
    '    self.postMessage({ type: "encoded", y0: y0.toString(), reqId: d.reqId });',
    '  } else if (d.type === "decode") {',
    '    var cols = d.cols, rows = d.rows, total = cols * rows;',
    '    var H = BigInt(rows);',
    '    var y0Big;',
    '    try { y0Big = BigInt(d.y0Str); } catch (ex) { y0Big = 0n; }',
    '    var m = y0Big / H;',
    '    var wasAligned = (y0Big % H) === 0n;',
    '    var alignedY0 = (m * H).toString();',
    '    var bin = m.toString(2);',
    '    if (bin.length > total) bin = bin.slice(bin.length - total);',
    '    while (bin.length < total) bin = "0" + bin;',
    '    var grid = new Uint8Array(total);',
    '    for (var i = 0; i < total; i++) {',
    '      if (bin.charCodeAt(i) === 49) {',
    '        var bit = total - 1 - i;',
    '        var c = Math.floor(bit / rows);',
    '        var r = rows - 1 - (bit % rows);',
    '        grid[r * cols + c] = 1;',
    '      }',
    '    }',
    '    self.postMessage({ type: "decoded", grid: grid, alignedY0: alignedY0, wasAligned: wasAligned, reqId: d.reqId }, [grid.buffer]);',
    '  }',
    '};'
  ].join('\n');

  let computeMode = 'init';
  let worker = null;
  let workerUsable = false;
  let workerReadyTimer = null;
  let workerObjectUrl = null;
  let encodeReqId = 0;
  let decodeReqId = 0;

  function setMode(mode) {
    computeMode = mode;
    if (mode === 'worker') {
      modeBadge.textContent = '计算模式 · Web Worker';
      modeBadge.className = 'mode-badge worker';
    } else if (mode === 'main') {
      modeBadge.textContent = '计算模式 · 主线程降级';
      modeBadge.className = 'mode-badge main';
    } else if (mode === 'dead') {
      modeBadge.textContent = '计算模式 · 不可用';
      modeBadge.className = 'mode-badge dead';
    } else {
      modeBadge.textContent = '计算模式 · 初始化中';
      modeBadge.className = 'mode-badge init';
    }
  }

  function workerFail(reason) {
    if (workerUsable && computeMode !== 'worker') return;
    console.warn('[计算降级] ' + reason + ' → 改用主线程');
    workerUsable = false;
    computeMode = 'main';
    setMode('main');
    if (workerReadyTimer) { clearTimeout(workerReadyTimer); workerReadyTimer = null; }
    if (worker) {
      try { worker.terminate(); } catch (e) {}
      worker = null;
    }
    if (workerObjectUrl) {
      try { URL.revokeObjectURL(workerObjectUrl); } catch (e) {}
      workerObjectUrl = null;
    }
  }

  function handleWorkerMessage(e) {
    const d = e.data;
    if (d.type === 'pong') {
      if (!workerUsable) {
        workerUsable = true;
        if (workerReadyTimer) { clearTimeout(workerReadyTimer); workerReadyTimer = null; }
        setMode('worker');
      }
      return;
    }
    if (d.type === 'encoded') {
      if (d.reqId !== encodeReqId) return;
      rawY = d.y0;
      setYDisplay(d.y0);
      return;
    }
    if (d.type === 'decoded') {
      if (d.reqId !== decodeReqId) return;
      applyDecodedGrid(d.grid, d.alignedY0);
      setStatus(d.wasAligned ? "已还原 ✓" : "已按 ⌊y₀/H⌋×H 对齐", d.wasAligned ? "ok" : "warn");
      return;
    }
  }

  function initWorker() {
    if (typeof Worker === 'undefined' || typeof Blob === 'undefined' ||
        typeof URL === 'undefined' || typeof URL.createObjectURL !== 'function') {
      workerFail('浏览器不支持 Worker/Blob/URL');
      return;
    }
    try {
      const blob = new Blob([workerSrc], { type: 'application/javascript' });
      workerObjectUrl = URL.createObjectURL(blob);
      worker = new Worker(workerObjectUrl);
    } catch (e) {
      workerFail('Worker 创建抛异常：' + (e && e.message ? e.message : e));
      return;
    }
    worker.onerror = function (err) {
      workerFail('Worker onerror：' + (err && err.message ? err.message : '未知错误'));
    };
    worker.onmessage = handleWorkerMessage;
    try {
      worker.postMessage({ type: 'ping', reqId: 0 });
    } catch (e) {
      workerFail('Worker postMessage 失败：' + (e && e.message ? e.message : e));
      return;
    }
    workerReadyTimer = setTimeout(function () {
      if (!workerUsable) workerFail('Worker 1.5s 内未响应（疑似 CSP 拦截）');
    }, 1500);
    setMode('init');
  }

  /* ====================================================
     编解码入口
     ==================================================== */
  let encodeTimer = null;

  function requestEncode() {
    if (encodeTimer) clearTimeout(encodeTimer);
    encodeTimer = setTimeout(function () {
      encodeTimer = null;
      if (worker && workerUsable && computeMode === 'worker') {
        encodeReqId++;
        const copy = new Uint8Array(gridData);
        try {
          worker.postMessage({
            type: 'encode', grid: copy,
            cols: COLS, rows: ROWS, reqId: encodeReqId
          });
          return;
        } catch (e) {
          workerFail('encode postMessage 失败：' + (e && e.message ? e.message : e));
        }
      }
      const y0 = encodeGridMain(gridData, COLS, ROWS);
      rawY = y0;
      setYDisplay(y0);
    }, 40);
  }

  function requestDecode(y0Str) {
    if (worker && workerUsable && computeMode === 'worker') {
      decodeReqId++;
      try {
        worker.postMessage({
          type: 'decode', y0Str: y0Str,
          cols: COLS, rows: ROWS, reqId: decodeReqId
        });
        return;
      } catch (e) {
        workerFail('decode postMessage 失败：' + (e && e.message ? e.message : e));
      }
    }
    const r = decodeYMain(y0Str, COLS, ROWS);
    applyDecodedGrid(r.grid, r.alignedY0);
    setStatus(r.wasAligned ? "已还原 ✓" : "已按 ⌊y₀/H⌋×H 对齐", r.wasAligned ? "ok" : "warn");
  }

  /* ==================== 布局 ==================== */
  function computeLayout() {
    const tb = topBar.getBoundingClientRect().height;
    const bb = bottomBar.getBoundingClientRect().height;
    const isNarrow = W < 720;
    const padX = isNarrow ? 14 : 50;
    const padTop = tb + (isNarrow ? 14 : 24);
    const padBottom = bb + (isNarrow ? 14 : 24);

    const availW = W - padX * 2;
    const availH = Math.max(50, H - padTop - padBottom);

    CELL = Math.min(availW / COLS, availH / ROWS);
    CELL = Math.max(0.8, Math.min(14, CELL));

    const gridW = CELL * COLS;
    const gridH = CELL * ROWS;
    originX = (W - gridW) / 2;
    originY = padTop + (availH - gridH) / 2;

    hint.style.bottom = (bb + 20) + "px";
  }

  function homeOf(col, row) {
    return {
      x: originX + col * CELL + CELL / 2,
      y: originY + row * CELL + CELL / 2
    };
  }

  function updateAllHomes(teleport) {
    for (let i = 0; i < TOTAL; i++) {
      const p = particles[i];
      if (!p) continue;
      const h = homeOf(p.col, p.row);
      p.homeX = h.x; p.homeY = h.y;
      if (teleport) { p.x = h.x; p.y = h.y; p.vx = 0; p.vy = 0; }
    }
  }

  let relayoutScheduled = false;
  function relayout() {
    if (relayoutScheduled) return;
    relayoutScheduled = true;
    requestAnimationFrame(function () {
      relayoutScheduled = false;
      computeLayout();
      updateAllHomes(true);
    });
  }

  /* ==================== 粒子 ==================== */
  function makeParticle(col, row) {
    const h = homeOf(col, row);
    return { col: col, row: row, homeX: h.x, homeY: h.y, x: h.x, y: h.y, vx: 0, vy: 0 };
  }

  function setCell(row, col, on) {
    const idx = row * COLS + col;
    if (on) {
      if (particles[idx]) return;
      particles[idx] = makeParticle(col, row);
      gridData[idx] = 1;
    } else {
      particles[idx] = null;
      gridData[idx] = 0;
    }
  }

  function clearAll() {
    particles.fill(null);
    gridData.fill(0);
    rawY = "0";
    setYDisplay("0");
  }

  /* ==================== y₀ 显示 ==================== */
  function group(s) {
    return s.replace(/\B(?=(\d{6})+(?!\d))/g, " ");
  }

  function setYDisplay(s) {
    if (!s || s === "0") {
      yValEl.textContent = "0";
      yValEl.classList.add("empty");
      return;
    }
    yValEl.classList.remove("empty");
    if (s.length <= 2000) {
      yValEl.textContent = group(s);
    } else {
      yValEl.textContent = group(s.slice(0, 1200)) + "  …  " + group(s.slice(-500));
    }
    relayout();
  }

  function setStatus(text, cls) {
    yStatus.textContent = text;
    yStatus.className = "mini-status" + (cls ? " " + cls : "");
  }
  function clearStatus() {
    yStatus.textContent = "";
    yStatus.className = "mini-status";
  }

  function applyDecodedGrid(grid, alignedY0) {
    for (let i = 0; i < TOTAL; i++) {
      if (grid[i]) {
        if (!particles[i]) {
          const r = Math.floor(i / COLS);
          const c = i % COLS;
          particles[i] = makeParticle(c, r);
        }
        gridData[i] = 1;
      } else {
        particles[i] = null;
        gridData[i] = 0;
      }
    }
    rawY = alignedY0;
    setYDisplay(alignedY0);
  }

  /* ==================== 文字 → 网格 ==================== */
  const FONT_STACKS = {
    sans:  'system-ui, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif',
    serif: 'Georgia, "Times New Roman", "Songti SC", "SimSun", serif',
    mono:  'ui-monospace, Menlo, Consolas, "Courier New", monospace'
  };

  const off = document.createElement("canvas");
  const octx = off.getContext("2d", { willReadFrequently: true });

  function buildFromText(text, fontKey) {
    const fontStack = FONT_STACKS[fontKey] || FONT_STACKS.sans;
    const SS = COLS <= 200 ? 6 : (COLS <= 500 ? 4 : 3);

    off.width = COLS * SS;
    off.height = ROWS * SS;

    octx.setTransform(1, 0, 0, 1, 0, 0);
    octx.clearRect(0, 0, off.width, off.height);

    let fontSize = ROWS * SS * 0.80;
    octx.font = '700 ' + fontSize + 'px ' + fontStack;

    const maxW = COLS * SS * 0.96;
    const measured = octx.measureText(text).width;
    if (measured > maxW && measured > 0) {
      fontSize = Math.max(4, fontSize * maxW / measured);
      octx.font = '700 ' + fontSize + 'px ' + fontStack;
    }

    octx.fillStyle = "#000";
    octx.textAlign = "center";
    octx.textBaseline = "middle";
    octx.fillText(text, off.width / 2, off.height / 2);

    const data = octx.getImageData(0, 0, off.width, off.height).data;

    particles.fill(null);
    gridData.fill(0);

    const threshold = Math.max(2, Math.round(SS * SS * 0.17));

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        let hits = 0;
        for (let sy = 0; sy < SS; sy++) {
          const rowBase = (r * SS + sy) * off.width;
          for (let sx = 0; sx < SS; sx++) {
            if (data[(rowBase + c * SS + sx) * 4 + 3] > 110) hits++;
          }
        }
        if (hits >= threshold) {
          const idx = r * COLS + c;
          gridData[idx] = 1;
          particles[idx] = makeParticle(c, r);
        }
      }
    }
    requestEncode();
  }

  /* ==================== 渲染 ==================== */
  function render() {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(0,0,0,0.26)";
    ctx.fillRect(0, 0, W, H);

    if (CELL > 4) {
      ctx.strokeStyle = "rgba(120,160,220,0.045)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      const gw = COLS * CELL, gh = ROWS * CELL;
      for (let c = 0; c <= COLS; c++) {
        const x = originX + c * CELL + 0.5;
        ctx.moveTo(x, originY);
        ctx.lineTo(x, originY + gh);
      }
      for (let r = 0; r <= ROWS; r++) {
        const y = originY + r * CELL + 0.5;
        ctx.moveTo(originX, y);
        ctx.lineTo(originX + gw, y);
      }
      ctx.stroke();
    }

    ctx.globalCompositeOperation = "lighter";

    const mr = REPEL_RADIUS, mr2 = mr * mr;
    const active = mouseRepel && mouse.active;
    const mx = mouse.x, my = mouse.y;

    const baseR = Math.max(0.5, CELL * 0.11);
    const extraR = CELL * 0.30;
    const dispScale = 1 / (CELL * 3.6);
    const useRect = CELL < 3;

    for (let i = 0; i < TOTAL; i++) {
      const p = particles[i];
      if (!p) continue;

      if (active) {
        const dx = p.x - mx, dy = p.y - my;
        if (Math.abs(dx) < mr && Math.abs(dy) < mr) {
          const d2 = dx * dx + dy * dy;
          if (d2 < mr2 && d2 > 0.0001) {
            const dist = Math.sqrt(d2);
            const force = (mr - dist) / mr;
            const k = (force * force * REPEL_FORCE) / dist;
            p.vx += dx * k;
            p.vy += dy * k;
          }
        }
      }

      p.vx += (p.homeX - p.x) * SPRING;
      p.vy += (p.homeY - p.y) * SPRING;
      p.vx *= FRICTION;
      p.vy *= FRICTION;
      p.x += p.vx;
      p.y += p.vy;

      const ddx = p.x - p.homeX, ddy = p.y - p.homeY;
      const disp = Math.min(1, Math.sqrt(ddx * ddx + ddy * ddy) * dispScale);

      const r = baseR + disp * extraR;
      const a = 0.55 + disp * 0.45;

      if (useRect) {
        ctx.fillStyle = "rgba(220,240,255," + a + ")";
        ctx.fillRect(p.x - r, p.y - r, r + r, r + r);
      } else {
        ctx.beginPath();
        ctx.fillStyle = "rgba(220,240,255," + a + ")";
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      if (disp > 0.35 && !useRect) {
        ctx.beginPath();
        ctx.fillStyle = "rgba(120,200,255," + ((disp - 0.35) * 0.18) + ")";
        ctx.arc(p.x, p.y, r * 2.6, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(render);
  }

  /* ==================== 坐标换算 ==================== */
  function cellFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const c = Math.floor((x - originX) / CELL);
    const r = Math.floor((y - originY) / CELL);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    return { r: r, c: c };
  }

  function lineTo(r0, c0, r1, c1, cb) {
    const dr = Math.abs(r1 - r0), dc = Math.abs(c1 - c0);
    const sr = r0 < r1 ? 1 : -1, sc = c0 < c1 ? 1 : -1;
    let err = dc - dr;
    let r = r0, c = c0;
    for (;;) {
      cb(r, c);
      if (r === r1 && c === c1) break;
      const e2 = 2 * err;
      if (e2 > -dr) { err -= dr; c += sc; }
      if (e2 < dc) { err += dc; r += sr; }
    }
  }

  /* ==================== 指针交互 ==================== */
  let painting = false, paintOn = true, lastR = -1, lastC = -1;

  function setMouse(x, y) {
    mouse.x = x; mouse.y = y; mouse.active = true;
    if (hint && !hint.classList.contains("fade")) hint.classList.add("fade");
  }

  canvas.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

    const p = cellFromEvent(e);
    if (!p) return;

    setMouse(e.clientX, e.clientY);
    clearStatus();

    const idx = p.r * COLS + p.c;
    paintOn = !gridData[idx];
    painting = true;
    lastR = p.r; lastC = p.c;

    setCell(p.r, p.c, paintOn);
    requestEncode();
  });

  canvas.addEventListener("pointermove", function (e) {
    setMouse(e.clientX, e.clientY);
    if (!painting) return;
    e.preventDefault();
    const p = cellFromEvent(e);
    if (!p) return;
    if (p.r === lastR && p.c === lastC) return;
    lineTo(lastR, lastC, p.r, p.c, function (rr, cc) { setCell(rr, cc, paintOn); });
    lastR = p.r; lastC = p.c;
    requestEncode();
  });

  function endPaint() {
    if (painting) requestEncode();
    painting = false;
    lastR = lastC = -1;
  }
  canvas.addEventListener("pointerup", endPaint);
  canvas.addEventListener("pointercancel", endPaint);
  canvas.addEventListener("lostpointercapture", endPaint);

  window.addEventListener("pointerleave", function () {
    mouse.active = false;
    mouse.x = -9999; mouse.y = -9999;
  });

  /* ==================== 工具按钮 ==================== */
  document.getElementById("btnClear").addEventListener("click", function () {
    clearAll();
    clearStatus();
  });

  document.getElementById("btnInvert").addEventListener("click", function () {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const idx = r * COLS + c;
        setCell(r, c, !gridData[idx]);
      }
    }
    clearStatus();
    requestEncode();
  });

  document.getElementById("btnRandom").addEventListener("click", function () {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        setCell(r, c, Math.random() < 0.45);
      }
    }
    clearStatus();
    requestEncode();
  });

  /* ==================== 自绘下拉初始化 ==================== */
  const customScale = document.getElementById("customScale");

  const scaleSelect = createSelect(document.getElementById("scaleSel"), function (v) {
    if (v === "custom") {
      customScale.style.display = "inline-block";
      customScale.focus();
      changeScale(parseInt(customScale.value, 10) || 4);
    } else {
      customScale.style.display = "none";
      changeScale(parseInt(v, 10));
    }
  });

  const fontSelect = createSelect(document.getElementById("fontSel"), function () {
    if (textInput.value.trim()) applyText();
  });

  /* ==================== 自绘复选框（默认开启） ==================== */
  const mouseRepelChk = createCheckbox(document.getElementById("mouseRepelChk"), function (checked) {
    mouseRepel = checked;
    if (!checked) {
      mouse.active = false;
      mouse.x = -9999;
      mouse.y = -9999;
    }
  });
  // 初始化状态
  mouseRepel = mouseRepelChk.checked;   // 默认 true

  /* ==================== 文字输入 ==================== */
  const textInput = document.getElementById("textInput");

  function applyText() {
    const v = textInput.value.trim();
    if (!v) { textInput.focus(); return; }
    buildFromText(v, fontSelect.value);
    clearStatus();
    textInput.blur();
  }

  document.getElementById("btnDraw").addEventListener("click", applyText);
  textInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); applyText(); }
  });

  /* ==================== y₀ 输入框 ==================== */
  const yInput = document.getElementById("yInput");

  function applyY() {
    const v = yInput.value.trim();
    if (!v) { yInput.focus(); return; }
    requestDecode(v);
  }
  document.getElementById("btnDecode").addEventListener("click", applyY);
  yInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); applyY(); }
  });

  /* ==================== 分辨率切换 ==================== */
  function changeScale(k) {
    k = Math.max(1, Math.min(10, Math.round(k)));
    COLS = BASE_COLS * k;
    ROWS = BASE_ROWS * k;
    TOTAL = COLS * ROWS;

    gridData  = new Uint8Array(TOTAL);
    particles = new Array(TOTAL).fill(null);
    rawY = "0";
    setYDisplay("0");
    scaleInfo.textContent = COLS + " × " + ROWS;
    clearStatus();

    resize();
  }

  customScale.addEventListener("change", function () {
    if (scaleSelect.value === "custom") {
      changeScale(parseInt(customScale.value, 10) || 1);
    }
  });
  customScale.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      if (scaleSelect.value === "custom") {
        changeScale(parseInt(customScale.value, 10) || 1);
      }
    }
  });

  /* ==================== 复制 ==================== */
  function flash(btn, label) {
    const old = btn.textContent;
    btn.textContent = label || "已复制 ✓";
    btn.classList.add("copied");
    setTimeout(function () {
      btn.textContent = old;
      btn.classList.remove("copied");
    }, 1200);
  }

  function copyText(text, btn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        function () { flash(btn); },
        function () { fallbackCopy(text, btn); }
      );
    } else {
      fallbackCopy(text, btn);
    }
  }

  function fallbackCopy(text, btn) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); flash(btn); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.getElementById("copyY").addEventListener("click", function () {
    copyText(rawY, this);
  });

  /* ====================================================
     ★ 下载独立 HTML（不可更改 + 顶部 Y 轴 + 底部画布 + 鼠标感应）
     ==================================================== */
  document.getElementById("btnDownload").addEventListener("click", function () {
    // 重新算一次，确保 y₀ 是最新的
    const y0 = encodeGridMain(gridData, COLS, ROWS);
    const cols = COLS;
    const rows = ROWS;

    const SCRIPT_END = "<" + "/script>";

    const html = [
'<!DOCTYPE html>',
'<html lang="zh-CN">',
'<head>',
'<meta charset="UTF-8" />',
'<meta name="viewport" content="width=device-width, initial-scale=1.0" />',
'<title>万物自指公式 · 图案</title>',
'<style>',
'  * { margin: 0; padding: 0; box-sizing: border-box; }',
'  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }',
'  body {',
'    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;',
'    color: #e6edf7; -webkit-font-smoothing: antialiased;',
'  }',
'  #scene { display: block; width: 100vw; height: 100vh; cursor: crosshair; touch-action: none; }',
'  .top {',
'    position: fixed; top: 0; left: 0; right: 0; z-index: 20;',
'    background: rgba(10,15,25,.86);',
'    border-bottom: 1px solid rgba(90,130,190,.22);',
'    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);',
'    box-shadow: 0 10px 34px -22px rgba(0,0,0,.95);',
'    padding: 12px 18px 13px;',
'    display: flex; flex-direction: column; gap: 9px;',
'  }',
'  .y-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }',
'  .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #6b7d99; white-space: nowrap; }',
'  .y-value {',
'    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;',
'    font-size: 14.5px; line-height: 1.55; color: #7dd3fc;',
'    word-break: break-all; font-variant-numeric: tabular-nums;',
'    text-shadow: 0 0 18px rgba(76,201,240,.35);',
'    max-height: 132px; overflow-y: auto; overflow-x: hidden;',
'    padding-right: 4px; letter-spacing: .2px;',
'  }',
'  .y-value.empty { color: #3f4c60; text-shadow: none; }',
'  button {',
'    font: inherit; font-size: 12.5px; padding: 7px 14px;',
'    border-radius: 8px; border: 1px solid rgba(76,201,240,.8);',
'    background: linear-gradient(135deg, rgba(29,78,216,.95), rgba(76,201,240,.95));',
'    color: #fff; cursor: pointer; white-space: nowrap;',
'    box-shadow: 0 0 22px -6px rgba(76,201,240,.7);',
'    transition: filter .16s;',
'  }',
'  button:hover { filter: brightness(1.12); }',
'  button.copied { background: rgba(20,83,45,.95); border-color: #22c55e; color: #86efac; }',
'  .hint {',
'    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);',
'    color: rgba(160,185,220,.4); font-size: 12.5px; letter-spacing: .1em;',
'    user-select: none; pointer-events: none; white-space: nowrap;',
'    transition: opacity .7s;',
'  }',
'  .hint.fade { opacity: 0; }',
'  @media (max-width: 720px) {',
'    .top { padding: 10px 12px 11px; }',
'    .y-value { font-size: 13px; max-height: 96px; }',
'    .hint { display: none; }',
'  }',
'</style>',
'</head>',
'<body>',
'  <canvas id="scene"></canvas>',
'  <div class="top" id="topBar">',
'    <div class="y-row">',
'      <span class="label">y 起始值 &nbsp;y₀</span>',
'      <button id="copyY">复制 y₀</button>',
'    </div>',
'    <div class="y-value" id="yVal"></div>',
'  </div>',
'  <div class="hint" id="hint">移动鼠标 / 滑动手指，让粒子散开又聚拢</div>',
'<script>',
'(function () {',
'  "use strict";',
'  var COLS = ' + cols + ';',
'  var ROWS = ' + rows + ';',
'  var Y0   = "' + y0 + '";',
'  var TOTAL = COLS * ROWS;',
'',
'  var REPEL_RADIUS = 110;',
'  var REPEL_FORCE  = 1.05;',
'  var SPRING       = 0.021;',
'  var FRICTION     = 0.865;',
'',
'  var canvas = document.getElementById("scene");',
'  var ctx = canvas.getContext("2d", { alpha: false });',
'  var hint = document.getElementById("hint");',
'  var yValEl = document.getElementById("yVal");',
'  var topBar = document.getElementById("topBar");',
'',
'  var DPR = Math.min(window.devicePixelRatio || 1, 2);',
'  var W = 0, H = 0;',
'  var CELL = 12, originX = 0, originY = 0;',
'',
'  // ---- 显示 y₀ ----',
'  function group(s) { return s.replace(/\\B(?=(\\d{6})+(?!\\d))/g, " "); }',
'  if (Y0 === "0") {',
'    yValEl.textContent = "0";',
'    yValEl.classList.add("empty");',
'  } else {',
'    var yStr = String(Y0);',
'    if (yStr.length <= 2000) yValEl.textContent = group(yStr);',
'    else yValEl.textContent = group(yStr.slice(0, 1200)) + "  …  " + group(yStr.slice(-500));',
'  }',
'',
'  // ---- 从 y₀ 解码网格 ----',
'  var grid = new Uint8Array(TOTAL);',
'  (function () {',
'    try {',
'      var y = BigInt(Y0);',
'      var Hb = BigInt(ROWS);',
'      var m = y / Hb;',
'      var bin = m.toString(2);',
'      if (bin.length > TOTAL) bin = bin.slice(bin.length - TOTAL);',
'      while (bin.length < TOTAL) bin = "0" + bin;',
'      for (var i = 0; i < TOTAL; i++) {',
'        if (bin.charCodeAt(i) === 49) {',
'          var bit = TOTAL - 1 - i;',
'          var c = Math.floor(bit / ROWS);',
'          var r = ROWS - 1 - (bit % ROWS);',
'          grid[r * COLS + c] = 1;',
'        }',
'      }',
'    } catch (e) {}',
'  })();',
'',
'  // ---- 粒子 ----',
'  var particles = new Array(TOTAL).fill(null);',
'  var mouse = { x: -9999, y: -9999, active: false };',
'',
'  function homeOf(col, row) {',
'    return {',
'      x: originX + col * CELL + CELL / 2,',
'      y: originY + row * CELL + CELL / 2',
'    };',
'  }',
'',
'  function makeParticle(col, row) {',
'    var h = homeOf(col, row);',
'    return { col: col, row: row, homeX: h.x, homeY: h.y, x: h.x, y: h.y, vx: 0, vy: 0 };',
'  }',
'',
'  function buildParticles() {',
'    for (var i = 0; i < TOTAL; i++) {',
'      if (grid[i]) {',
'        var r = Math.floor(i / COLS);',
'        var c = i % COLS;',
'        particles[i] = makeParticle(c, r);',
'      } else {',
'        particles[i] = null;',
'      }',
'    }',
'  }',
'',
'  function updateHomes(teleport) {',
'    for (var i = 0; i < TOTAL; i++) {',
'      var p = particles[i];',
'      if (!p) continue;',
'      var h = homeOf(p.col, p.row);',
'      p.homeX = h.x; p.homeY = h.y;',
'      if (teleport) { p.x = h.x; p.y = h.y; p.vx = 0; p.vy = 0; }',
'    }',
'  }',
'',
'  function computeLayout() {',
'    var tb = topBar.getBoundingClientRect().height;',
'    var isNarrow = W < 720;',
'    var padX = isNarrow ? 14 : 50;',
'    var padTop = tb + (isNarrow ? 14 : 26);',
'    var padBottom = isNarrow ? 40 : 60;',
'    var availW = W - padX * 2;',
'    var availH = Math.max(50, H - padTop - padBottom);',
'    CELL = Math.min(availW / COLS, availH / ROWS);',
'    CELL = Math.max(0.8, Math.min(14, CELL));',
'    var gw = CELL * COLS, gh = CELL * ROWS;',
'    originX = (W - gw) / 2;',
'    originY = padTop + (availH - gh) / 2;',
'  }',
'',
'  function resize() {',
'    DPR = Math.min(window.devicePixelRatio || 1, 2);',
'    W = window.innerWidth; H = window.innerHeight;',
'    canvas.width  = W * DPR;',
'    canvas.height = H * DPR;',
'    canvas.style.width  = W + "px";',
'    canvas.style.height = H + "px";',
'    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);',
'    ctx.fillStyle = "#000";',
'    ctx.fillRect(0, 0, W, H);',
'    computeLayout();',
'    updateHomes(true);',
'  }',
'',
'  function render() {',
'    ctx.globalCompositeOperation = "source-over";',
'    ctx.fillStyle = "rgba(0,0,0,0.26)";',
'    ctx.fillRect(0, 0, W, H);',
'',
'    if (CELL > 4) {',
'      ctx.strokeStyle = "rgba(120,160,220,0.045)";',
'      ctx.lineWidth = 1;',
'      ctx.beginPath();',
'      var gw = COLS * CELL, gh = ROWS * CELL;',
'      for (var c = 0; c <= COLS; c++) {',
'        var x = originX + c * CELL + 0.5;',
'        ctx.moveTo(x, originY);',
'        ctx.lineTo(x, originY + gh);',
'      }',
'      for (var r = 0; r <= ROWS; r++) {',
'        var y = originY + r * CELL + 0.5;',
'        ctx.moveTo(originX, y);',
'        ctx.lineTo(originX + gw, y);',
'      }',
'      ctx.stroke();',
'    }',
'',
'    ctx.globalCompositeOperation = "lighter";',
'',
'    var mr = REPEL_RADIUS, mr2 = mr * mr;',
'    var active = mouse.active;',
'    var mx = mouse.x, my = mouse.y;',
'',
'    var baseR = Math.max(0.5, CELL * 0.11);',
'    var extraR = CELL * 0.30;',
'    var dispScale = 1 / (CELL * 3.6);',
'    var useRect = CELL < 3;',
'',
'    for (var i = 0; i < TOTAL; i++) {',
'      var p = particles[i];',
'      if (!p) continue;',
'',
'      if (active) {',
'        var dx = p.x - mx, dy = p.y - my;',
'        if (Math.abs(dx) < mr && Math.abs(dy) < mr) {',
'          var d2 = dx * dx + dy * dy;',
'          if (d2 < mr2 && d2 > 0.0001) {',
'            var dist = Math.sqrt(d2);',
'            var force = (mr - dist) / mr;',
'            var k = (force * force * REPEL_FORCE) / dist;',
'            p.vx += dx * k;',
'            p.vy += dy * k;',
'          }',
'        }',
'      }',
'',
'      p.vx += (p.homeX - p.x) * SPRING;',
'      p.vy += (p.homeY - p.y) * SPRING;',
'      p.vx *= FRICTION;',
'      p.vy *= FRICTION;',
'      p.x += p.vx;',
'      p.y += p.vy;',
'',
'      var ddx = p.x - p.homeX, ddy = p.y - p.homeY;',
'      var disp = Math.min(1, Math.sqrt(ddx * ddx + ddy * ddy) * dispScale);',
'      var rr = baseR + disp * extraR;',
'      var a = 0.55 + disp * 0.45;',
'',
'      if (useRect) {',
'        ctx.fillStyle = "rgba(220,240,255," + a + ")";',
'        ctx.fillRect(p.x - rr, p.y - rr, rr + rr, rr + rr);',
'      } else {',
'        ctx.beginPath();',
'        ctx.fillStyle = "rgba(220,240,255," + a + ")";',
'        ctx.arc(p.x, p.y, rr, 0, Math.PI * 2);',
'        ctx.fill();',
'      }',
'',
'      if (disp > 0.35 && !useRect) {',
'        ctx.beginPath();',
'        ctx.fillStyle = "rgba(120,200,255," + ((disp - 0.35) * 0.18) + ")";',
'        ctx.arc(p.x, p.y, rr * 2.6, 0, Math.PI * 2);',
'        ctx.fill();',
'      }',
'    }',
'',
'    ctx.globalCompositeOperation = "source-over";',
'    requestAnimationFrame(render);',
'  }',
'',
'  function setMouse(x, y) {',
'    mouse.x = x; mouse.y = y; mouse.active = true;',
'    if (hint && !hint.classList.contains("fade")) hint.classList.add("fade");',
'  }',
'',
'  canvas.addEventListener("pointermove", function (e) { setMouse(e.clientX, e.clientY); });',
'  canvas.addEventListener("pointerdown", function (e) { setMouse(e.clientX, e.clientY); });',
'  window.addEventListener("pointerleave", function () {',
'    mouse.active = false; mouse.x = -9999; mouse.y = -9999;',
'  });',
'  window.addEventListener("touchmove", function (e) {',
'    if (e.touches[0]) setMouse(e.touches[0].clientX, e.touches[0].clientY);',
'  }, { passive: true });',
'  window.addEventListener("touchend", function () { mouse.active = false; });',
'',
'  var resizeTimer = null;',
'  window.addEventListener("resize", function () {',
'    clearTimeout(resizeTimer);',
'    resizeTimer = setTimeout(function () { resize(); }, 120);',
'  });',
'',
'  document.getElementById("copyY").addEventListener("click", function () {',
'    var btn = this;',
'    function done() {',
'      var old = btn.textContent;',
'      btn.textContent = "已复制 ✓";',
'      btn.classList.add("copied");',
'      setTimeout(function () {',
'        btn.textContent = old; btn.classList.remove("copied");',
'      }, 1200);',
'    }',
'    var text = Y0;',
'    if (navigator.clipboard && navigator.clipboard.writeText) {',
'      navigator.clipboard.writeText(text).then(done, function () {',
'        var ta = document.createElement("textarea");',
'        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";',
'        document.body.appendChild(ta); ta.select();',
'        try { document.execCommand("copy"); done(); } catch (e) {}',
'        document.body.removeChild(ta);',
'      });',
'    } else {',
'      var ta = document.createElement("textarea");',
'      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";',
'      document.body.appendChild(ta); ta.select();',
'      try { document.execCommand("copy"); done(); } catch (e) {}',
'      document.body.removeChild(ta);',
'    }',
'  });',
'',
'  resize();',
'  buildParticles();',
'  updateHomes(true);',
'  render();',
'})();',
SCRIPT_END,
'</body>',
'</html>'
    ].join('\n');

    // 触发下载
    try {
      var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = '万物自指-' + cols + 'x' + rows + '.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
      flash(this, '已下载 ✓');
    } catch (err) {
      console.error(err);
      flash(this, '下载失败 ✗');
    }
  });

  /* ==================== 尺寸自适应 ==================== */
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.width  = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width  = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    computeLayout();
    updateAllHomes(true);
  }

  let resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });

  if (window.ResizeObserver) {
    const ro = new ResizeObserver(relayout);
    ro.observe(topBar);
    ro.observe(bottomBar);
  }

  /* ==================== 启动 ==================== */
  resize();
  buildFromText("万物自指", "sans");
  initWorker();
  render();

})();
</script>
</body>
</html>
