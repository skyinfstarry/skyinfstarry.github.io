<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>意见反馈 | 星际通讯</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #03050b; color: #fff; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
        #starCanvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .main-container { position: relative; z-index: 3; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; padding: 1.5rem; overflow-y: auto; }
        
        /* 液态玻璃卡片 */
        .feedback-card { width: 100%; max-width: 600px; background: rgba(255,255,255,0.055); border-radius: 32px; padding: 2.5rem; box-shadow: inset 0.5px 0 0 0 rgba(255,255,255,0.35), inset -0.5px 0 0 0 rgba(255,255,255,0.18), inset 0 0.5px 0 0 rgba(255,255,255,0.50), inset 0 -0.5px 0 0 rgba(255,255,255,0.22), 0 20px 50px rgba(0,0,0,0.5); animation: floatUp 0.8s cubic-bezier(0.2,0.9,0.4,1.1); position: relative; }
        .feedback-card::before { content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 1px; background: linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent); }
        .title-section { text-align: center; margin-bottom: 2rem; }
        .main-title { font-size: clamp(1.6rem, 5vw, 2.2rem); font-weight: 700; background: linear-gradient(135deg,#FFFFFF,#C0E0FF,#AAD0FF); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 0 20px rgba(170,208,255,0.4); letter-spacing: 2px; }
        .subtitle { font-size: 0.9rem; opacity: 0.7; margin-top: 0.5rem; }
        
        /* 表单通用 */
        .form-group { margin-bottom: 1.2rem; position: relative; }
        .form-label { display: block; font-size: 0.85rem; color: #A0B8D8; margin-bottom: 0.5rem; }
        .form-input, .form-textarea { width: 100%; padding: 0.9rem 1.1rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; font-size: 0.95rem; color: #fff; outline: none; transition: 0.25s; }
        .form-input:focus, .form-textarea:focus { border-color: rgba(120,180,255,0.6); background: rgba(0,0,0,0.5); box-shadow: 0 0 0 3px rgba(120,180,255,0.15); }
        .form-textarea { min-height: 120px; resize: vertical; }
        .form-textarea::placeholder, .form-input::placeholder { color: rgba(255,255,255,0.25); }

        /* ========== 自定义液态下拉选择器 ========== */
        .custom-select-wrapper { position: relative; width: 100%; user-select: none; }
        .custom-select-trigger {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 0.9rem 1.1rem;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; font-size: 0.95rem; color: #fff;
            cursor: pointer; transition: 0.25s; outline: none;
        }
        .custom-select-trigger:hover { border-color: rgba(120,180,255,0.4); }
        .custom-select-wrapper.open .custom-select-trigger {
            border-color: rgba(120,180,255,0.6); background: rgba(0,0,0,0.5);
            box-shadow: 0 0 0 3px rgba(120,180,255,0.15);
        }
        .custom-select-label { color: rgba(255,255,255,0.3); }
        .custom-select-wrapper.has-value .custom-select-label { color: #fff; }
        .custom-select-arrow {
            width: 12px; height: 12px; fill: none; stroke: #A0B8D8;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            transition: transform 0.3s ease;
        }
        .custom-select-wrapper.open .custom-select-arrow { transform: rotate(180deg); }

        .custom-select-options {
            position: absolute; top: calc(100% + 6px); left: 0; right: 0;
            background: rgba(18, 22, 35, 0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px; padding: 6px; z-index: 100;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            opacity: 0; visibility: hidden;
            transform: translateY(-10px) scaleY(0.95); transform-origin: top;
            transition: all 0.25s cubic-bezier(0.2,0.9,0.4,1.1);
        }
        .custom-select-wrapper.open .custom-select-options {
            opacity: 1; visibility: visible; transform: translateY(0) scaleY(1);
        }
        .custom-option {
            padding: 0.8rem 1rem; border-radius: 10px; font-size: 0.9rem;
            color: #C0D0E8; cursor: pointer; transition: 0.15s; display: flex; align-items: center; gap: 8px;
        }
        .custom-option:hover { background: rgba(120,180,255,0.15); color: #fff; }
        .custom-option.selected { background: rgba(120,180,255,0.2); color: #fff; font-weight: 600; }
        /* 隐藏原生 select（表单提交需要） */
        #feedbackType { position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0; }

        /* 提交按钮 */
        .submit-btn { position: relative; width: 100%; margin-top: 0.8rem; padding: 1rem; border: none; border-radius: 999px; font-size: 1.1rem; font-weight: 600; color: #fff; cursor: pointer; background: rgba(255,255,255,0.08); box-shadow: inset 0 0.5px 0 0 rgba(255,255,255,0.35), inset 0 -0.5px 0 0 rgba(255,255,255,0.18), 0 10px 26px rgba(0,0,0,0.38); transition: 0.25s; overflow: hidden; backdrop-filter: blur(10px); }
        .submit-btn:hover { transform: translateY(-3px); background: rgba(255,255,255,0.15); box-shadow: 0 18px 34px rgba(0,0,0,0.45), 0 0 24px rgba(140,190,255,0.35); }
        .submit-btn:active { transform: translateY(1px); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .ripple-effect { position: absolute; border-radius: 50%; pointer-events: none; background: radial-gradient(circle,rgba(255,255,255,0.55) 0%,transparent 75%); transform: scale(0); z-index: 2; }
        
        #toast { position: fixed; bottom: 10%; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(10,20,35,0.9); border: 1px solid rgba(255,255,255,0.4); border-radius: 60px; padding: 12px 28px; color: #fff; z-index: 9999; opacity: 0; transition: 0.4s; pointer-events: none; font-size: 0.95rem; }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.success { border-color: rgba(100,255,180,0.6); }
        #toast.error { border-color: rgba(255,100,120,0.6); }
        @keyframes floatUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) { .feedback-card { padding: 1.8rem 1.5rem; } .form-input, .form-textarea { font-size: 16px; } .custom-select-trigger { font-size: 16px; } }
    </style>
</head>
<body>
    <canvas id="starCanvas"></canvas>
    <div class="main-container">
        <div class="feedback-card">
            <div class="title-section">
                <div class="main-title">✦ 意见反馈 ✦</div>
                <div class="subtitle">星际通讯 · 你的每一条建议都很重要</div>
            </div>
            <form id="feedbackForm">
                <div class="form-group">
                    <label class="form-label">反馈类型</label>
                    <!-- 自定义下拉选择器 -->
                    <div class="custom-select-wrapper" id="customSelect">
                        <div class="custom-select-trigger" id="selectTrigger">
                            <span class="custom-select-label" id="selectLabel">请选择反馈类型...</span>
                            <svg class="custom-select-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        <div class="custom-select-options" id="selectOptions">
                            <div class="custom-option" data-value="bug">🐛 Bug 反馈</div>
                            <div class="custom-option" data-value="feature">✨ 功能建议</div>
                            <div class="custom-option" data-value="ui">🎨 UI/UX 体验</div>
                            <div class="custom-option" data-value="other">💬 其他吐槽</div>
                        </div>
                    </div>
                    <!-- 隐藏的原生 select，用于表单提交取值 -->
                    <select id="feedbackType" required>
                        <option value="" disabled selected></option>
                        <option value="bug">🐛 Bug 反馈</option>
                        <option value="feature">✨ 功能建议</option>
                        <option value="ui">🎨 UI/UX 体验</option>
                        <option value="other">💬 其他吐槽</option>
                    </select>
                </div>

                <div class="form-group"><label class="form-label">标题</label><input type="text" class="form-input" id="feedbackTitle" placeholder="简单概括一下你的反馈..." maxlength="50" required></div>
                <div class="form-group"><label class="form-label">详细描述</label><textarea class="form-textarea" id="feedbackDesc" placeholder="请详细描述遇到的问题或你的建议..." required></textarea></div>
                <div class="form-group"><label class="form-label">联系方式（选填）</label><input type="text" class="form-input" id="feedbackContact" placeholder="QQ / 邮箱 / 其他"></div>
                <button type="submit" class="submit-btn" id="submitBtn"><span id="submitText">🚀 发送反馈</span></button>
            </form>
        </div>
    </div>
    <div id="toast">✨ 提示</div>

    <script>
    (function() {
        'use strict';
        const SUPABASE_URL = 'https://xdavyegtdbrfmwkmsfns.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkYXZ5ZWd0ZGJyZm13a21zZm5zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2Mjk3MDUsImV4cCI6MjEwMDIwNTcwNX0.J0MO1VcuhRXI6AwmAZ4sC7PHnVewWiSEE6llUfp1RpY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ========== 自定义下拉选择器逻辑 ==========
        const customSelect = document.getElementById('customSelect');
        const selectTrigger = document.getElementById('selectTrigger');
        const selectLabel = document.getElementById('selectLabel');
        const selectOptions = document.getElementById('selectOptions');
        const hiddenSelect = document.getElementById('feedbackType');
        
        selectTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            customSelect.classList.toggle('open');
        });

        selectOptions.querySelectorAll('.custom-option').forEach(option => {
            option.addEventListener('click', (e) => {
                e.stopPropagation();
                const value = option.dataset.value;
                const text = option.textContent;
                selectLabel.textContent = text;
                customSelect.classList.add('has-value');
                hiddenSelect.value = value;
                selectOptions.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                customSelect.classList.remove('open');
            });
        });

        document.addEventListener('click', () => { customSelect.classList.remove('open'); });

        // ========== 星空背景 ==========
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let stars = []; let width, height;
        function initStars() { stars = []; for (let i = 0; i < 150; i++) { stars.push({ x: Math.random() * width, y: Math.random() * height, radius: Math.random() * 2 + 1, alpha: Math.random() * 0.5 + 0.3, speed: 0.002 + Math.random() * 0.008, offset: Math.random() * Math.PI * 2 }); } }
        function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; initStars(); }
        let lastFrameTime = 0;
        function renderLoop(now) {
            if (lastFrameTime === 0) lastFrameTime = now;
            const dtSec = (now - lastFrameTime) / 1000; lastFrameTime = now;
            ctx.clearRect(0, 0, width, height); ctx.fillStyle = '#03050b'; ctx.fillRect(0, 0, width, height);
            const nowSec = now / 1000;
            for (let i = 0; i < stars.length; i++) { const s = stars[i]; const twinkle = 0.5 + 0.5 * Math.sin(nowSec * s.speed * 2.5 + s.offset); const alpha = Math.min(s.alpha * (0.6 + twinkle * 0.5), 0.95); ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(225,235,255,' + alpha + ')'; ctx.fill(); }
            requestAnimationFrame(renderLoop);
        }

        // ========== Toast ==========
        const toast = document.getElementById('toast');
        let toastTimer = null;
        function showToast(msg, type = 'success') { toast.textContent = msg; toast.className = 'show ' + type; if (toastTimer) clearTimeout(toastTimer); toastTimer = setTimeout(() => { toast.className = ''; }, 3000); }

        // ========== 防刷限制与提交 ==========
        function getDeviceId() { let devId = localStorage.getItem('star_device_id'); if (!devId) { devId = 'dev_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now(); localStorage.setItem('star_device_id', devId); } return devId; }
        async function checkDailyLimit(deviceId) {
            const today = new Date().toISOString().slice(0, 10);
            const { count, error } = await supabaseClient.from('feedbacks').select('*', { count: 'exact', head: true }).eq('device_id', deviceId).gte('created_at', today + 'T00:00:00Z');
            if (error) { console.error('检查限制失败:', error); return true; }
            return count < 3;
        }

        const form = document.getElementById('feedbackForm');
        const submitBtn = document.getElementById('submitBtn');
        const submitText = document.getElementById('submitText');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const type = hiddenSelect.value;
            const title = document.getElementById('feedbackTitle').value.trim();
            const desc = document.getElementById('feedbackDesc').value.trim();
            const contact = document.getElementById('feedbackContact').value.trim();

            if (!type || !title || !desc) { showToast('请把必填项填完整哦 ✨', 'error'); return; }

            submitBtn.disabled = true; submitText.textContent = '🔄 验证发送限制...';
            const deviceId = getDeviceId();
            const allowed = await checkDailyLimit(deviceId);
            if (!allowed) { submitBtn.disabled = false; submitText.textContent = '🚀 发送反馈'; showToast('今天的反馈次数已用完（每天最多3条），明天再来吧 ✨', 'error'); return; }

            submitText.textContent = '🔄 发送中...';
            try {
                const { error } = await supabaseClient.from('feedbacks').insert({ device_id: deviceId, type, title, content: desc, contact, status: 'pending' });
                if (error) throw error;
                submitText.textContent = '✅ 发送成功'; showToast('✨ 感谢你的反馈！已安全送达', 'success');
                form.reset();
                selectLabel.textContent = '请选择反馈类型...';
                customSelect.classList.remove('has-value');
                selectOptions.querySelectorAll('.custom-option').forEach(o => o.classList.remove('selected'));
            } catch (err) { console.error('提交失败:', err); submitText.textContent = '❌ 发送失败'; showToast('发送失败，请检查网络后重试', 'error'); }
            finally { setTimeout(() => { submitBtn.disabled = false; submitText.textContent = '🚀 发送反馈'; }, 2000); }
        });

        // ========== 启动 ==========
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas(); requestAnimationFrame(renderLoop);
        function createRipple(e) { const btn = e.currentTarget; if (btn.querySelector('.ripple-effect')) return; let cx, cy; if (e.touches && e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; } else { cx = e.clientX; cy = e.clientY; } const rect = btn.getBoundingClientRect(); const dia = Math.max(rect.width, rect.height) * 1.6; const rad = dia / 2; const x = cx - rect.left - rad; const y = cy - rect.top - rad; const ripple = document.createElement('span'); ripple.className = 'ripple-effect'; Object.assign(ripple.style, { width: dia + 'px', height: dia + 'px', left: x + 'px', top: y + 'px', transition: 'transform .5s ease-out, opacity .6s ease' }); btn.appendChild(ripple); requestAnimationFrame(() => { ripple.style.transform = 'scale(2.2)'; ripple.style.opacity = '0'; }); setTimeout(() => { if (ripple.parentNode) ripple.remove(); }, 620); }
        submitBtn.addEventListener('mousedown', createRipple);
        submitBtn.addEventListener('touchstart', createRipple, { passive: true });
    })();
    </script>
</body>
</html>
