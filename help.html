<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统诊断 · 环境检测报告</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#03050b;
  --panel:rgba(255,255,255,.045);
  --panel-hover:rgba(255,255,255,.085);
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.20);
  --text:#e9efff;
  --muted:#93a3c4;

  --pass:#34d399;
  --pass-soft:#6ee7b7;
  --pass-bg:rgba(52,211,153,.11);
  --pass-border:rgba(52,211,153,.34);

  --warn:#fbbf24;
  --warn-soft:#fcd34d;
  --warn-bg:rgba(251,191,36,.11);
  --warn-border:rgba(251,191,36,.34);

  --fail:#f87171;
  --fail-soft:#fca5a5;
  --fail-bg:rgba(248,113,113,.11);
  --fail-border:rgba(248,113,113,.34);

  --info:#60a5fa;
  --info-soft:#bfdbfe;
  --info-bg:rgba(96,165,250,.10);
  --info-border:rgba(96,165,250,.32);
}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(1200px 800px at 12% -8%, rgba(59,130,246,.22), transparent 62%),
    radial-gradient(1000px 700px at 92% 6%,  rgba(139,92,246,.20), transparent 60%),
    radial-gradient(900px 900px at 50% 110%, rgba(16,185,129,.12), transparent 65%);
  background-attachment:fixed;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  line-height:1.6;
  padding:28px 16px 90px;
  -webkit-font-smoothing:antialiased;
}
#bgCanvas{
  position:fixed;inset:0;width:100%;height:100%;
  display:block;z-index:0;pointer-events:none;
}
.wrap{position:relative;z-index:2;max-width:1020px;margin:0 auto}

/* ================= FPS 监视器 ================= */
#fpsMonitor{
  position:fixed;
  top:14px;
  right:14px;
  z-index:9999;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(10,16,28,.62);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  box-shadow:
    inset 0 .5px 0 0 rgba(255,255,255,.20),
    0 6px 18px rgba(0,0,0,.45);
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.76rem;
  font-weight:700;
  letter-spacing:.5px;
  color:#dfeaff;
  pointer-events:none;
  user-select:none;
  transition:color .25s, border-color .25s, box-shadow .25s;
}
#fpsMonitor .fps-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 10px currentColor;
  flex:none;
}
#fpsMonitor .fps-num{
  min-width:3ch;
  text-align:right;
  font-variant-numeric:tabular-nums;
  color:inherit;
}
#fpsMonitor .fps-unit{
  opacity:.55;
  font-weight:500;
}
#fpsMonitor.fps-good{
  color:#34d399;
  border-color:rgba(52,211,153,.35);
  box-shadow:
    inset 0 .5px 0 0 rgba(255,255,255,.20),
    0 6px 18px rgba(0,0,0,.45),
    0 0 14px rgba(52,211,153,.25);
}
#fpsMonitor.fps-mid{
  color:#fbbf24;
  border-color:rgba(251,191,36,.35);
  box-shadow:
    inset 0 .5px 0 0 rgba(255,255,255,.20),
    0 6px 18px rgba(0,0,0,.45),
    0 0 14px rgba(251,191,36,.25);
}
#fpsMonitor.fps-bad{
  color:#f87171;
  border-color:rgba(248,113,113,.4);
  box-shadow:
    inset 0 .5px 0 0 rgba(255,255,255,.20),
    0 6px 18px rgba(0,0,0,.45),
    0 0 14px rgba(248,113,113,.3);
}

/* ================= 顶部 ================= */
.hero{text-align:center;margin-bottom:30px}
.hero h1{
  font-size:clamp(1.5rem,4vw,2.2rem);
  font-weight:800;
  letter-spacing:1px;
  color:#e9efff;
  margin-bottom:8px;
}
.hero p{color:var(--muted);font-size:.92rem}
.bar{
  margin:22px auto 8px;height:6px;width:100%;max-width:520px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.06);
  border-radius:99px;overflow:hidden;
}
.bar-fill{
  height:100%;width:0%;border-radius:99px;
  background:linear-gradient(90deg,#3b82f6,#8b5cf6,#10b981);
  box-shadow:0 0 16px rgba(96,165,250,.7);
  transition:width .35s cubic-bezier(.3,.9,.4,1);
}
.bar-text{font-size:.82rem;color:var(--muted);letter-spacing:.5px;min-height:20px}

/* ================= 概览卡 ================= */
.overview{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:26px 0 8px}
.ov-card{
  flex:1 1 150px;min-width:140px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;text-align:center;
  box-shadow:
    inset 0 .5px 0 0 rgba(255,255,255,.18),
    0 10px 26px rgba(0,0,0,.35);
}
.ov-num{font-size:1.9rem;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.ov-num.pass{color:var(--pass);text-shadow:0 0 18px rgba(52,211,153,.45)}
.ov-num.warn{color:var(--warn);text-shadow:0 0 18px rgba(251,191,36,.45)}
.ov-num.fail{color:var(--fail);text-shadow:0 0 18px rgba(248,113,113,.45)}
.ov-num.info{color:var(--info);text-shadow:0 0 18px rgba(96,165,250,.45)}
.ov-label{font-size:.76rem;color:var(--muted);letter-spacing:1px;margin-top:2px}

/* ================= 分区 ================= */
.section{margin-top:30px}
.sec-title{
  font-size:1.05rem;font-weight:700;letter-spacing:1px;
  padding-left:12px;margin-bottom:12px;position:relative;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.sec-title::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:3px;height:16px;border-radius:3px;
  background:linear-gradient(180deg,#3b82f6,#8b5cf6);
  box-shadow:0 0 12px rgba(96,165,250,.8);
}
.sec-count{
  font-size:.72rem;font-weight:600;color:var(--muted);
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  padding:1px 9px;border-radius:20px;letter-spacing:0;
}

/* ================= 检测项（纯 backdrop blur，不折射，性能友好）================= */
.list{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;gap:12px;align-items:flex-start;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;padding:12px 16px;
  transition:background .2s,border-color .2s;
}
.row:hover{background:var(--panel-hover);border-color:rgba(255,255,255,.18)}
.dot{
  width:9px;height:9px;border-radius:50%;flex:none;margin-top:7px;
  box-shadow:0 0 10px currentColor;
}
.row.pass .dot{background:var(--pass);color:var(--pass)}
.row.warn .dot{background:var(--warn);color:var(--warn)}
.row.fail .dot{background:var(--fail);color:var(--fail)}
.row.info .dot{background:var(--info);color:var(--info)}
.row-main{flex:1;min-width:0}
.row-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.row-name{font-size:.9rem;font-weight:600;flex:none}
.row-msg{font-size:.84rem;color:var(--muted);word-break:break-word}
.row.pass .row-msg{color:var(--pass-soft)}
.row.warn .row-msg{color:var(--warn-soft)}
.row.fail .row-msg{color:var(--fail-soft)}
.row-sol{
  margin-top:7px;font-size:.79rem;line-height:1.65;
  color:#cfe0ff;
  background:var(--info-bg);
  border-left:2px solid rgba(96,165,250,.65);
  border-radius:0 8px 8px 0;padding:7px 12px;
  word-break:break-word;
}

/* ================= 工具矩阵（折射卡片）================= */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tool{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;
  box-shadow:inset 0 .5px 0 0 rgba(255,255,255,.14);
  transition:background .2s,border-color .2s;
}
.tool:hover{background:var(--panel-hover);border-color:rgba(255,255,255,.18)}
.tool::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;z-index:2;
}
.tool.pass::before{background:var(--pass);box-shadow:0 0 16px rgba(52,211,153,.7)}
.tool.warn::before{background:var(--warn);box-shadow:0 0 16px rgba(251,191,36,.7)}
.tool.fail::before{background:var(--fail);box-shadow:0 0 16px rgba(248,113,113,.7)}
.tool-head{display:flex;align-items:center;gap:8px;margin-bottom:3px;flex-wrap:wrap}
.tool-name{font-size:.92rem;font-weight:700}
.tool-badge{
  font-size:.65rem;font-weight:700;padding:2px 8px;border-radius:20px;
  letter-spacing:.5px;
}
.tool.pass .tool-badge{background:var(--pass-bg);color:var(--pass-soft);border:1px solid var(--pass-border)}
.tool.warn .tool-badge{background:var(--warn-bg);color:var(--warn-soft);border:1px solid var(--warn-border)}
.tool.fail .tool-badge{background:var(--fail-bg);color:var(--fail-soft);border:1px solid var(--fail-border)}
.tool-path{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.72rem;color:var(--muted);margin-bottom:9px;
  word-break:break-all;
}
.tool-deps{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-size:.7rem;padding:3px 9px;border-radius:20px;
  border:1px solid transparent;white-space:nowrap;
  display:inline-flex;align-items:center;gap:4px;
}
.chip.ok{background:var(--pass-bg);border-color:var(--pass-border);color:var(--pass-soft)}
.chip.bad{background:var(--fail-bg);border-color:var(--fail-border);color:var(--fail-soft)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-soft)}
.chip.na{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:var(--muted)}
.tool-note{
  margin-top:9px;font-size:.75rem;line-height:1.6;color:#cfe0ff;
  background:var(--info-bg);
  border:1px solid rgba(96,165,250,.18);
  border-radius:8px;padding:7px 10px;
}

/* ================= 按钮（折射）================= */
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.btn{
  padding:11px 26px;border-radius:40px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.06);
  color:var(--text);
  font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;
  transition:all .2s;
}
.btn:hover:not(:disabled){
  background:rgba(255,255,255,.13);
  border-color:rgba(255,255,255,.32);
  transform:translateY(-1px);
  box-shadow:0 10px 26px rgba(0,0,0,.4);
}
.btn.primary{
  background:linear-gradient(135deg,rgba(37,99,235,.75),rgba(59,130,246,.75));
  border-color:rgba(96,165,250,.7);color:#fff;
  box-shadow:0 8px 24px -6px rgba(37,99,235,.75), 0 0 22px rgba(59,130,246,.3);
}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ================= 降级 ================= */
.no-glass .ov-card,
.no-glass .tool,
.no-glass .btn{
  background:rgba(30,45,75,.55);
}
.no-glass .btn.primary{background:linear-gradient(135deg,#2563eb,#3b82f6)}

.footer{
  text-align:center;margin-top:44px;font-size:.74rem;color:var(--muted);
  border-top:1px solid var(--border);padding-top:20px;
}

@media (max-width:640px){
  body{padding:18px 10px 70px}
  .row{padding:11px 13px}
  .tools{grid-template-columns:1fr}
  .ov-card{flex:1 1 120px;padding:13px 12px}
  .ov-num{font-size:1.5rem}
  #fpsMonitor{
    top:10px;
    right:10px;
    padding:5px 10px;
    font-size:.7rem;
  }
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- FPS 监视器（右上角常驻，每帧刷新） -->
<div id="fpsMonitor" class="fps-good" aria-label="当前帧率" title="实时帧率">
  <span class="fps-dot"></span>
  <span class="fps-num">--</span>
  <span class="fps-unit">FPS</span>
</div>

<div class="wrap">

  <div class="hero">
    <h1>🔍 系统诊断报告</h1>
    <p>自动检测当前运行环境，评估站内全部工具的可用性</p>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="bar-text" id="barText">准备开始检测…</div>
  </div>

  <div class="overview" id="overview"></div>
  <div id="report"></div>

  <div class="actions">
    <button class="btn primary glass-target" id="btnRerun">🔄 重新检测</button>
    <button class="btn glass-target" id="btnCopy">📋 复制报告</button>
    <button class="btn glass-target" id="btnDownload">⬇️ 下载报告</button>
  </div>

  <div class="footer">
    诊断工具 · 本地运行 · 不上传任何数据
  </div>
</div>

<!-- ============================================================
     星空背景
     ============================================================ -->
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('bgCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  let W = 0, H = 0, dpr = 1;
  let stars = [];
  const meteors = [];
  const STAR_COUNT = 240;
  const MAX_METEORS = 3;

  let nextMeteorTime = 0;
  let burstRemaining = 0;
  let nextBurstShotTime = 0;
  let nextBurstCheckTime = 0;
  let lastFrameTime = 0;

  function scheduleNextMeteor(now) {
    nextMeteorTime = now + 2600 + Math.random() * 6000;
  }
  function scheduleNextBurstShot(now) {
    nextBurstShotTime = now + 200 + Math.random() * 600;
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        radius: Math.random() * 1.6 + 0.5,
        alpha: Math.random() * 0.5 + 0.3,
        speed: 0.002 + Math.random() * 0.008,
        offset: Math.random() * Math.PI * 2
      });
    }
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initStars();
  }

  function spawnMeteor(speedBoost, now) {
    if (meteors.length >= MAX_METEORS) return;

    const baseSpeed = 300 + Math.random() * 400;
    const speed = speedBoost ? baseSpeed * 1.4 : baseSpeed;
    const pad = 120;

    const edge = Math.floor(Math.random() * 4);
    let startX, startY;
    if (edge === 0) {
      startX = Math.random() * W;  startY = -pad;
    } else if (edge === 1) {
      startX = W + pad;            startY = Math.random() * H;
    } else if (edge === 2) {
      startX = Math.random() * W;  startY = H + pad;
    } else {
      startX = -pad;               startY = Math.random() * H;
    }

    const targetX = W * (0.1 + Math.random() * 0.8);
    const targetY = H * (0.1 + Math.random() * 0.8);
    const dx = targetX - startX;
    const dy = targetY - startY;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;

    const warm = Math.random() < 0.22;
    meteors.push({
      x: startX,
      y: startY,
      vx: (dx / d) * speed,
      vy: (dy / d) * speed,
      len: 90 + Math.random() * 200,
      width: 0.8 + Math.random() * 1.4,
      bornAt: now,
      fadeIn: 60 + Math.random() * 80,
      hue: warm ? '255, 240, 220' : '198, 224, 255'
    });
  }

  function updateMeteors(now, dtSec) {
    if (now >= nextMeteorTime) {
      spawnMeteor(false, now);
      scheduleNextMeteor(now);
    }

    if (burstRemaining === 0 && now >= nextBurstCheckTime) {
      if (Math.random() < 0.5) {
        burstRemaining = 2 + Math.floor(Math.random() * 2);
        nextBurstShotTime = now;
      }
      nextBurstCheckTime = now + 30000 + Math.random() * 60000;
    }
    if (burstRemaining > 0 && now >= nextBurstShotTime) {
      spawnMeteor(true, now);
      burstRemaining--;
      if (burstRemaining > 0) scheduleNextBurstShot(now);
    }

    const pad = 100;
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx * dtSec;
      m.y += m.vy * dtSec;
      const offDist = Math.max(
        -m.x - pad, m.x - W - pad,
        -m.y - pad, m.y - H - pad,
        0
      );
      if (offDist > 320) meteors.splice(i, 1);
    }
  }

  function drawMeteors(now) {
    const pad = 100;
    for (let i = 0; i < meteors.length; i++) {
      const m = meteors[i];

      const d = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
      const ux = m.vx / d;
      const uy = m.vy / d;
      const tailX = m.x - ux * m.len;
      const tailY = m.y - uy * m.len;

      let a = 1;
      const age = now - m.bornAt;
      if (age < m.fadeIn) a = age / m.fadeIn;

      const offDist = Math.max(
        -m.x - pad, m.x - W - pad,
        -m.y - pad, m.y - H - pad,
        0
      );
      a *= 1 - Math.min(1, offDist / 250);
      if (a <= 0.02) continue;

      const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
      grad.addColorStop(0,    'rgba(255, 255, 255, ' + (a * 0.95) + ')');
      grad.addColorStop(0.12, 'rgba(' + m.hue + ', ' + (a * 0.72) + ')');
      grad.addColorStop(0.55, 'rgba(' + m.hue + ', ' + (a * 0.20) + ')');
      grad.addColorStop(1,    'rgba(' + m.hue + ', 0)');

      ctx.save();
      ctx.lineCap = 'round';

      ctx.strokeStyle = grad;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = m.width * 3.2;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();

      ctx.globalAlpha = 1;
      ctx.strokeStyle = grad;
      ctx.lineWidth = m.width;
      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(tailX, tailY);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(m.x, m.y, m.width * 3.4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + m.hue + ', ' + (a * 0.13) + ')';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(m.x, m.y, m.width * 0.9, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, ' + (a * 0.92) + ')';
      ctx.fill();

      ctx.restore();
    }
  }

  function renderLoop(now) {
    if (lastFrameTime === 0) lastFrameTime = now;
    const dt = Math.min(now - lastFrameTime, 100);
    lastFrameTime = now;
    const dtSec = dt / 1000;

    ctx.clearRect(0, 0, W, H);

    const nowSec = now / 1000;
    for (let i = 0; i < stars.length; i++) {
      const star = stars[i];
      const twinkle = 0.5 + 0.5 * Math.sin(nowSec * star.speed * 2.5 + star.offset);
      const alpha = Math.min(star.alpha * (0.6 + twinkle * 0.5), 0.95);

      ctx.beginPath();
      ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(225, 235, 255, ' + alpha + ')';
      ctx.fill();

      if (star.radius > 1.2 && twinkle > 0.72) {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius * 1.6, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(160, 200, 255, ' + (alpha * 0.18) + ')';
        ctx.fill();
      }
    }

    updateMeteors(now, dtSec);
    drawMeteors(now);

    requestAnimationFrame(renderLoop);
  }

  window.addEventListener('resize', resize, { passive: true });

  resize();
  const t0 = performance.now();
  nextMeteorTime = t0 + 900 + Math.random() * 1600;
  nextBurstCheckTime = t0 + 30000 + Math.random() * 30000;
  requestAnimationFrame(renderLoop);
})();
</script>

<!-- ============================================================
     FPS 监视器（右上角常驻，每帧刷新）
     ============================================================ -->
<script>
(function () {
  'use strict';

  const el = document.getElementById('fpsMonitor');
  if (!el) return;

  const numEl = el.querySelector('.fps-num');
  if (!numEl) return;

  // 用指数移动平均平滑瞬时帧率，每帧都刷新数字，但不会剧烈跳动
  const SMOOTH = 0.12;   // 0 = 完全不平滑（剧烈抖动），1 = 完全不动
  let ema = 60;          // 初值随便，几帧内就会收敛到真实值
  let last = performance.now();
  let lastShown = -1;    // 避免每帧都写 DOM，只在整数变化时更新

  function setLevel(fps) {
    el.classList.remove('fps-good', 'fps-mid', 'fps-bad');
    if (fps >= 55) el.classList.add('fps-good');
    else if (fps >= 30) el.classList.add('fps-mid');
    else el.classList.add('fps-bad');
  }

  function loop(now) {
    const dt = now - last;
    last = now;

    // 只对合理的帧间隔采样（排除后台恢复、断点调试等异常大值）
    if (dt > 0 && dt < 500) {
      const instant = 1000 / dt;              // 瞬时帧率
      ema += (instant - ema) * SMOOTH;        // 指数移动平均
      const fps = Math.round(ema);
      if (fps !== lastShown) {
        lastShown = fps;
        numEl.textContent = fps;
        setLevel(fps);
      }
    }

    requestAnimationFrame(loop);
  }

  // 页面切回前台时重置基准，避免一帧巨大的 dt 污染 EMA
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      last = performance.now();
      ema = 60;
      lastShown = -1;
    }
  });

  requestAnimationFrame(loop);
})();
</script>

<!-- ============================================================
     Snell 折射引擎（液态玻璃核心）
     ============================================================ -->
<script>
(function () {
  'use strict';

  /* ============================================================
     配置
     ============================================================ */
  const GLASS = {
    THICKNESS: 62,
    IOR: 2.4,
    BEZEL_RATIO: 0.55,
    BEZEL_MAX: 18,
    SPECULAR_OPACITY: 0.24,
    SPECULAR_ANGLE: Math.PI * 0.75,
    BLUR: 0.4,
    SCALE_RATIO: 0.55,
    MAX_PIXELS: 280000      // 超过这个像素数就跳过，防止大卡片拖慢
  };

  let defsEl = null;

  /* ============================================================
     Snell 折射剖面
     ============================================================ */
  function calculateRefractionProfile(glassThickness, bezelWidth, heightFn, ior, samples) {
    samples = samples || 128;
    var eta = 1 / ior;
    function refract(nx, ny) {
      var dot = ny;
      var k = 1 - eta * eta * (1 - dot * dot);
      if (k < 0) return null;
      var sq = Math.sqrt(k);
      return [-(eta * dot + sq) * nx, eta - (eta * dot + sq) * ny];
    }
    var profile = new Float64Array(samples);
    for (var i = 0; i < samples; i++) {
      var x = i / samples;
      var y = heightFn(x);
      var dx = x < 1 ? 0.0001 : -0.0001;
      var y2 = heightFn(x + dx);
      var deriv = (y2 - y) / dx;
      var mag = Math.sqrt(deriv * deriv + 1);
      var ref = refract(-deriv / mag, -1 / mag);
      if (!ref) { profile[i] = 0; continue; }
      profile[i] = ref[0] * ((y * bezelWidth + glassThickness) / ref[1]);
    }
    return profile;
  }

  function squircleSurface(t) {
    return Math.pow(1 - Math.pow(1 - t, 4), 0.25);
  }

  /* ============================================================
     位移贴图（R/G 通道编码 x/y 位移量）
     ============================================================ */
  function generateDisplacementMap(w, h, radius, bezelWidth, profile, maxDisp) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    var img = ctx.createImageData(w, h);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      d[i] = 128; d[i + 1] = 128; d[i + 2] = 0; d[i + 3] = 255;
    }
    var r = Math.min(radius, Math.min(w, h) / 2 - 1);
    if (r <= 0) return c.toDataURL();
    var clampedBezel = Math.min(bezelWidth, r - 1);
    if (clampedBezel <= 1) return c.toDataURL();
    var rSq = r * r;
    var r1Sq = (r + 1) * (r + 1);
    var rBSq = Math.max(r - clampedBezel, 0) * Math.max(r - clampedBezel, 0);
    var wB = w - r * 2;
    var hB = h - r * 2;
    var S = profile.length;
    if (wB < 0 || hB < 0) return c.toDataURL();

    for (var y1 = 0; y1 < h; y1++) {
      for (var x1 = 0; x1 < w; x1++) {
        var dx, dy;
        if (x1 < r) { dx = x1 - r; }
        else if (x1 >= w - r) { dx = x1 - r - wB; }
        else { dx = 0; }
        if (y1 < r) { dy = y1 - r; }
        else if (y1 >= h - r) { dy = y1 - r - hB; }
        else { dy = 0; }
        var dSq = dx * dx + dy * dy;
        if (dSq > r1Sq || dSq < rBSq) continue;
        var dist = Math.sqrt(dSq);
        var fromSide = r - dist;
        var op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
        if (op <= 0 || dist === 0) continue;
        var cos = dx / dist;
        var sin = dy / dist;
        var bi = Math.min(Math.floor((fromSide / clampedBezel) * S), S - 1);
        var disp = profile[bi] || 0;
        var dX = (-cos * disp) / maxDisp;
        var dY = (-sin * disp) / maxDisp;
        var idx = (y1 * w + x1) * 4;
        d[idx]     = Math.min(255, Math.max(0, (128 + dX * 127 * op + 0.5) | 0));
        d[idx + 1] = Math.min(255, Math.max(0, (128 + dY * 127 * op + 0.5) | 0));
      }
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL();
  }

  /* ============================================================
     镜面高光贴图（沿光方向的高光弧）
     ============================================================ */
  function generateSpecularMap(w, h, radius, bezelWidth, angle) {
    angle = angle != null ? angle : Math.PI / 3;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    var img = ctx.createImageData(w, h);
    var d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      d[i] = 0; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = 0;
    }
    var r = Math.min(radius, Math.min(w, h) / 2 - 1);
    if (r <= 0) return c.toDataURL();
    var clampedBezel = Math.min(bezelWidth, r - 1);
    if (clampedBezel <= 1) return c.toDataURL();
    var rSq = r * r;
    var r1Sq = (r + 1) * (r + 1);
    var rBSq = Math.max(r - clampedBezel, 0) * Math.max(r - clampedBezel, 0);
    var wB = w - r * 2;
    var hB = h - r * 2;
    var lightVec = [Math.cos(angle), Math.sin(angle)];

    for (var y1 = 0; y1 < h; y1++) {
      for (var x1 = 0; x1 < w; x1++) {
        var dx, dy;
        if (x1 < r) { dx = x1 - r; }
        else if (x1 >= w - r) { dx = x1 - r - wB; }
        else { dx = 0; }
        if (y1 < r) { dy = y1 - r; }
        else if (y1 >= h - r) { dy = y1 - r - hB; }
        else { dy = 0; }
        var dSq = dx * dx + dy * dy;
        if (dSq > r1Sq || dSq < rBSq) continue;
        var dist = Math.sqrt(dSq);
        var fromSide = r - dist;
        var op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
        if (op <= 0 || dist === 0) continue;
        var cos = dx / dist;
        var sin = -dy / dist;
        var dot = Math.abs(cos * lightVec[0] + sin * lightVec[1]);
        var edge = Math.sqrt(Math.max(0, 1 - Math.pow(1 - fromSide, 2)));
        var coeff = dot * edge;
        var col = (255 * coeff) | 0;
        var alpha = Math.min(255, Math.max(0, (col * coeff * op * 0.85) | 0));
        var idx = (y1 * w + x1) * 4;
        d[idx] = col; d[idx + 1] = col; d[idx + 2] = col; d[idx + 3] = alpha;
      }
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL();
  }

  /* ============================================================
     组装 SVG 滤镜链
     ============================================================ */
  function buildSVGFilter(filterId, dispUrl, specUrl, scale, w, h, specOpacity) {
    specOpacity = specOpacity != null ? specOpacity : 0.3;
    var fc = '';
    fc += '<feImage href="' + dispUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="disp_map" />';
    fc += '<feDisplacementMap in="SourceGraphic" in2="disp_map" scale="' + scale +
          '" xChannelSelector="R" yChannelSelector="G" result="displaced" />';
    if (specUrl) {
      fc += '<feImage href="' + specUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="spec_layer" />';
      fc += '<feComposite in="displaced" in2="spec_layer" operator="in" result="spec_masked" />';
      fc += '<feComponentTransfer in="spec_layer" result="spec_faded">' +
            '<feFuncA type="linear" slope="' + specOpacity + '" /></feComponentTransfer>';
      fc += '<feBlend in="spec_masked" in2="displaced" mode="screen" result="with_spec" />';
      fc += '<feBlend in="spec_faded" in2="with_spec" mode="screen" />';
    }
    return fc;
  }

  /* ============================================================
     SVG defs 管理
     ============================================================ */
  function ensureSVG() {
    let svg = document.getElementById('lg-svg');
    if (!svg) {
      svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('id', 'lg-svg');
      svg.setAttribute('width', '0');
      svg.setAttribute('height', '0');
      svg.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;');
      svg.setAttribute('color-interpolation-filters', 'sRGB');
      svg.setAttribute('aria-hidden', 'true');
      document.body.appendChild(svg);
    }
    defsEl = svg.querySelector('defs');
    if (!defsEl) {
      defsEl = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      svg.appendChild(defsEl);
    }
  }

  function writeFilter(id, html) {
    if (!defsEl) return;
    const old = defsEl.querySelector('#' + id);
    if (old) old.remove();
    if (!html) return;
    const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
    filter.setAttribute('id', id);
    filter.setAttribute('x', '0%');
    filter.setAttribute('y', '0%');
    filter.setAttribute('width', '100%');
    filter.setAttribute('height', '100%');
    filter.innerHTML = html;
    defsEl.appendChild(filter);
  }

  /* ============================================================
     应用到单个元素
     ============================================================ */
  function applyGlass(el, index) {
    const w = Math.round(el.offsetWidth);
    const h = Math.round(el.offsetHeight);
    if (w < 14 || h < 14) return;
    if (w * h > GLASS.MAX_PIXELS) return;

    const maxRadius = Math.min(w, h) / 2 - 1;
    let radius = parseFloat(el.dataset.glassRadius || '0');
    if (!radius || isNaN(radius)) radius = maxRadius;
    radius = Math.min(radius, maxRadius);
    if (radius <= 1.5) return;

    const bezel = Math.min(radius * GLASS.BEZEL_RATIO, GLASS.BEZEL_MAX, radius - 1);
    if (bezel <= 1) return;

    let profile, maxDisp = 0;
    try {
      profile = calculateRefractionProfile(GLASS.THICKNESS, bezel, squircleSurface, GLASS.IOR, 128);
      for (let k = 0; k < profile.length; k++) {
        const a = Math.abs(profile[k]);
        if (a > maxDisp) maxDisp = a;
      }
      if (maxDisp < 0.001) maxDisp = 1;
    } catch (e) { return; }
    const scale = maxDisp * GLASS.SCALE_RATIO;

    let dispUrl, specUrl = '';
    try {
      dispUrl = generateDisplacementMap(w, h, radius, bezel, profile, maxDisp);
      if (GLASS.SPECULAR_OPACITY > 0.001) {
        specUrl = generateSpecularMap(w, h, radius, bezel * 2.2, GLASS.SPECULAR_ANGLE);
      }
    } catch (e) { return; }

    const id = 'lg-f-' + index;
    writeFilter(id, buildSVGFilter(id, dispUrl, specUrl, scale, w, h, GLASS.SPECULAR_OPACITY));

    let bf = 'url(#' + id + ')';
    if (GLASS.BLUR > 0) bf += ' blur(' + GLASS.BLUR.toFixed(1) + 'px)';

    el.style.setProperty('backdrop-filter', bf, 'important');
    el.style.setProperty('-webkit-backdrop-filter', bf, 'important');
  }

  /* ============================================================
     全量重建
     ============================================================ */
  function buildLiquidGlass() {
    if (!defsEl) return;
    // 清掉旧滤镜，防止累积
    defsEl.innerHTML = '';
    const els = document.querySelectorAll('.glass-target');
    for (let i = 0; i < els.length; i++) {
      try { applyGlass(els[i], i); } catch (e) { /* 单个失败不影响其他 */ }
    }
  }

  /* 尺寸签名——避免无意义重建 */
  let glassSig = '';
  let glassTimer = null;

  function scheduleGlass(force) {
    clearTimeout(glassTimer);
    glassTimer = setTimeout(function () {
      const els = document.querySelectorAll('.glass-target');
      let sig = '';
      for (let i = 0; i < els.length; i++) {
        sig += Math.round(els[i].offsetWidth) + 'x' + Math.round(els[i].offsetHeight) + '|';
      }
      if (!force && sig === glassSig) return;
      glassSig = sig;
      buildLiquidGlass();
    }, 90);
  }

  /* ============================================================
     对外接口
     ============================================================ */
  window.__lgEngine = {
    ensureSVG: ensureSVG,
    build: buildLiquidGlass,
    schedule: scheduleGlass,
    supported: function () {
      return !!(window.CSS && window.CSS.supports) &&
        (window.CSS.supports('backdrop-filter', 'blur(2px)') ||
         window.CSS.supports('-webkit-backdrop-filter', 'blur(2px)'));
    }
  };

  // 窗口尺寸变化时重建
  window.addEventListener('resize', function () { scheduleGlass(true); }, { passive: true });

  // 字体加载完成后重建（尺寸可能变化）
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { scheduleGlass(true); });
  }

  // 初始化
  ensureSVG();
  if (!window.__lgEngine.supported()) {
    document.body.classList.add('no-glass');
  } else {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { scheduleGlass(true); });
    });
  }
})();
</script>

<!-- ============================================================
     诊断主逻辑
     ============================================================ -->
<script>
(function () {
  'use strict';

  const R    = [];
  const FEAT = {};
  const NET  = {};
  let   isRunning = false;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));

  function add(cat, name, status, msg, sol) {
    R.push({ cat, name, status, msg: msg || '', sol: sol || '' });
  }
  function setFeat(key, ok, label, msg) {
    FEAT[key] = { ok: !!ok, label: label || key, msg: msg || '' };
  }

  function progress(text, pct) {
    $('barFill').style.width = pct + '%';
    $('barText').textContent = text;
  }

  const _warnedKeys = new Set();
  function warnOnce(key, toolTitle) {
    if (_warnedKeys.has(key)) return;
    _warnedKeys.add(key);
    console.warn('[诊断] 未定义的依赖 key：' + key + '（首次出现于：' + toolTitle + '）');
  }

  function refreshGlass(force) {
    if (window.__lgEngine) window.__lgEngine.schedule(!!force);
  }

  /* ============================================================
     浏览器探测
     ============================================================ */
  function detectBrowser() {
    const ua = navigator.userAgent;
    const list = [
      ['iOS Chrome',       /CriOS\/([\d.]+)/],
      ['iOS Firefox',      /FxiOS\/([\d.]+)/],
      ['Samsung Internet', /SamsungBrowser\/([\d.]+)/],
      ['微信内置浏览器',   /MicroMessenger\/([\d.]+)/],
      ['QQ 浏览器',        /QQBrowser\/([\d.]+)/],
      ['UC 浏览器',        /UCBrowser\/([\d.]+)/],
      ['Microsoft Edge',   /Edg\/([\d.]+)/],
      ['Opera',            /OPR\/([\d.]+)/],
      ['Firefox',          /Firefox\/([\d.]+)/],
      ['Chrome',           /Chrome\/([\d.]+)/],
      ['Safari',           /Version\/([\d.]+).*Safari/]
    ];
    for (const [name, re] of list) {
      const m = ua.match(re);
      if (m) return { name, version: m[1] };
    }
    return { name: '未知浏览器', version: '-' };
  }

  /* ============================================================
     CDN 探测
     ============================================================ */
  async function probeFetch(url, timeout) {
    const t0 = Date.now();
    const remain = () => Math.max(500, timeout - (Date.now() - t0));
    const hasAC = (typeof AbortController !== 'undefined');

    const corsResult = await new Promise(resolve => {
      let done = false;
      let timer = null;
      let ctrl = null;
      const finish = result => {
        if (done) return;
        done = true;
        if (timer !== null) { clearTimeout(timer); timer = null; }
        resolve(result);
      };

      timer = setTimeout(() => {
        if (ctrl) { try { ctrl.abort(); } catch (e) {} }
        finish({ fallback: true });
      }, remain());

      try {
        const opts = {
          mode: 'cors', cache: 'no-store',
          credentials: 'omit', redirect: 'follow'
        };
        if (hasAC) {
          ctrl = new AbortController();
          opts.signal = ctrl.signal;
        }
        fetch(url, opts).then(res => {
          finish({ ok: res.ok, status: res.status, uncertain: false });
        }).catch(() => {
          finish({ fallback: true });
        });
      } catch (e) {
        finish({ fallback: true });
      }
    });
    if (!corsResult.fallback) return corsResult;

    return await new Promise(resolve => {
      let done = false;
      let timer = null;
      let ctrl = null;
      const finish = result => {
        if (done) return;
        done = true;
        if (timer !== null) { clearTimeout(timer); timer = null; }
        resolve(result);
      };

      timer = setTimeout(() => {
        if (ctrl) { try { ctrl.abort(); } catch (e) {} }
        finish({ ok: false, status: 0, uncertain: false, error: '超时' });
      }, remain());

      try {
        const opts = {
          mode: 'no-cors', cache: 'no-store',
          credentials: 'omit', redirect: 'follow'
        };
        if (hasAC) {
          ctrl = new AbortController();
          opts.signal = ctrl.signal;
        }
        fetch(url, opts).then(() => {
          finish({ ok: true, status: 0, uncertain: true });
        }).catch(err => {
          finish({ ok: false, status: 0, uncertain: false, error: err && err.message });
        });
      } catch (e) {
        finish({ ok: false, status: 0, uncertain: false, error: e && e.message });
      }
    });
  }

  function probeUrl(url, timeout) {
    return probeFetch(url, timeout || 5000);
  }

  function cssSupports(prop, val) {
    try {
      if (!window.CSS || !CSS.supports) return false;
      return CSS.supports(prop, val);
    } catch (e) { return false; }
  }

  /* ============================================================
     1. 运行环境
     ============================================================ */
  function checkEnvironment() {
    const br = detectBrowser();
    const ua = navigator.userAgent;
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(ua);

    const platform = (navigator.userAgentData && navigator.userAgentData.platform)
      || navigator.platform || '未提供';

    add('运行环境', '浏览器内核', 'info', `${br.name} ${br.version}`);
    add('运行环境', '设备类型', 'info', isMobile ? '移动设备 / 触屏' : '桌面设备');
    add('运行环境', '操作系统', 'info', platform);
    add('运行环境', '界面语言', 'info', navigator.language || '未提供');
    add('运行环境', '屏幕分辨率', 'info',
      `${screen.width}×${screen.height} @ ${(window.devicePixelRatio || 1).toFixed(2)}x`);
    add('运行环境', '视口尺寸', 'info', `${window.innerWidth}×${window.innerHeight}`);

    if (navigator.onLine === false) {
      add('运行环境', '网络状态', 'info',
        '系统报告离线（仅供参考，实际以 CDN 探测结果为准）');
    } else {
      add('运行环境', '网络状态', 'info', '系统报告在线（仅供参考）');
    }

    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn && conn.effectiveType) {
      const et = conn.effectiveType;
      let desc = '有效连接类型：' + et;
      if (conn.downlink) desc += ' · 下行 ~' + conn.downlink + ' Mbps';
      if (conn.rtt) desc += ' · RTT ~' + conn.rtt + ' ms';
      add('运行环境', '网络质量', 'info', desc);
    }

    const proto = location.protocol;
    if (proto === 'https:') {
      add('运行环境', '页面协议', 'pass', 'HTTPS（安全上下文）');
    } else if (proto === 'http:') {
      const isLocal = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
      if (isLocal) {
        add('运行环境', '页面协议', 'pass', 'HTTP（本地回环，等同安全上下文）');
      } else {
        add('运行环境', '页面协议', 'warn', 'HTTP（非安全上下文）',
          '非 localhost 的 HTTP 不是安全上下文，crypto.subtle 不可用，' +
          'AES 加密 / BTC 模拟交易 / 暴力破解器都会失效。请改用 HTTPS。');
      }
    } else if (proto === 'file:') {
      add('运行环境', '页面协议', 'fail', 'file:// 直接打开',
        '把网站直接双击打开的，几乎所有依赖 Web API 的功能都废了：' +
        'Web Worker / crypto.subtle / fetch / localStorage 全部不可用。' +
        '部署到服务器用 http(s) 访问。');
    }

    let inIframe = false;
    try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
    if (inIframe) {
      add('运行环境', '运行位置', 'warn', '当前页面被嵌套在 iframe 中',

      add('核心能力', 'sessionStorage', 'warn', '不可用：' + e.message,
        'AES 加密工具将无法缓存性能校准结果，每次刷新都会重新校准。');
      setFeat('sessionStorage', false, 'sessionStorage', e.message);
    }

    /* SVG 滤镜 */
    let svgEl = null;
    let probeEl = null;
    try {
      if (typeof SVGFEDisplacementMapElement === 'undefined' ||
          typeof SVGFEImageElement === 'undefined') {
        throw new Error('缺少 SVGFEDisplacementMapElement / SVGFEImageElement 接口');
      }

      const NS = 'http://www.w3.org/2000/svg';
      const XLINK_NS = 'http://www.w3.org/1999/xlink';
      const svg = document.createElementNS(NS, 'svg');
      const filter = document.createElementNS(NS, 'filter');
      filter.setAttribute('id', '__diag_f__');

      const dataUri = 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
      const feImage = document.createElementNS(NS, 'feImage');
      feImage.setAttribute('href', dataUri);
      try { feImage.setAttributeNS(XLINK_NS, 'xlink:href', dataUri); } catch (e) {}
      feImage.setAttribute('result', 'i');

      const feDisp = document.createElementNS(NS, 'feDisplacementMap');
      feDisp.setAttribute('in', 'SourceGraphic');
      feDisp.setAttribute('in2', 'i');
      feDisp.setAttribute('scale', '5');
      feDisp.setAttribute('xChannelSelector', 'R');
      feDisp.setAttribute('yChannelSelector', 'G');

      filter.appendChild(feImage);
      filter.appendChild(feDisp);
      svg.appendChild(filter);
      svg.setAttribute('style', 'position:absolute;width:0;height:0;');
      document.body.appendChild(svg);
      svgEl = svg;

      const el = document.createElement('div');
      el.style.cssText = 'width:10px;height:10px;filter:url(#__diag_f__)';
      document.body.appendChild(el);
      probeEl = el;

      const cs = getComputedStyle(el).filter || '';
      if (cs && cs.indexOf('url') !== -1) {
        add('核心能力', 'SVG 滤镜（液态玻璃折射）', 'pass',
          'feDisplacementMap 语法解析正常（接口 + CSS 属性均可用）',
          '注：这是语法级检查。部分旧版 Safari 在 feImage + data URI 上有已知兼容问题，本检测无法覆盖——' +
          '若液态玻璃按钮的折射实际看起来是普通模糊，请使用 Chrome / Edge 获得最佳效果。');
        setFeat('svgFilter', true, 'SVG 滤镜');
      } else {
        add('核心能力', 'SVG 滤镜（液态玻璃折射）', 'warn', 'SVG 滤镜可能未生效',
          '液态玻璃按钮的折射会退化为普通模糊。建议使用 Chrome / Edge。');
        setFeat('svgFilter', false, 'SVG 滤镜', '未生效');
      }
    } catch (e) {
      add('核心能力', 'SVG 滤镜（液态玻璃折射）', 'warn', '检测异常：' + e.message,
        '推荐使用 Chrome / Edge 最新版。');
      setFeat('svgFilter', false, 'SVG 滤镜', e.message);
    } finally {
      if (probeEl && probeEl.parentNode) probeEl.parentNode.removeChild(probeEl);
      if (svgEl && svgEl.parentNode) svgEl.parentNode.removeChild(svgEl);
    }
  }

  async function checkNetwork() {
    const settled = await Promise.allSettled(
      CDN_LIST.map(item => probeUrl(item.url).then(r => ({ item, r })))
    );

    settled.forEach((res, i) => {
      const item = CDN_LIST[i];

      if (res.status === 'rejected') {
        NET[item.key] = { ok: false, uncertain: false, status: 0 };
        const reason = (res.reason && res.reason.message) || res.reason || '未知错误';
        add('外部 CDN', item.key, item.critical ? 'fail' : 'warn',
          '探测异常：' + reason + '（' + item.tool + '）',
          '该条目无法判断可达性。建议用浏览器或 curl 手动访问以下地址确认：\n' +
          item.url + '\n' +
          '受影响：' + item.tool);
        return;
      }

      const r = res.value.r;
      NET[item.key] = {
        ok: !!r.ok,
        uncertain: !!r.uncertain,
        status: r.status || 0
      };

      if (r.ok && !r.uncertain) {
        add('外部 CDN', item.key, 'pass',
          '可访问（HTTP ' + r.status + '）');
      } else if (r.ok && r.uncertain) {
        add('外部 CDN', item.key, 'warn',
          '网络层可达（跨域策略受限，无法确认 HTTP 状态码）',
          (item.note ? item.note + '\n' : '') +
          '浏览器跨域策略不允许读取响应状态码，此处仅能确认服务器在线并响应了请求。\n' +
          '若实际使用异常（例如返回 404），请用 curl / 浏览器开发者工具查看真实状态码。\n' +
          '受影响：' + item.tool);
      } else {
        const sol = item.critical
          ? '⚠️ 必需依赖，缺失会导致「' + item.tool + '」完全不可用。\n' +
            '解决：① 检查网络/代理；② 若网络不稳定，可将文件下载到本地改为相对路径引用。'

        add('外部 CDN', item.key, item.critical ? 'fail' : 'warn',
          '无法访问（' + item.tool + '）', sol);
      }
    });
  }

  async function checkPerf() {
    if (navigator.storage && navigator.storage.estimate) {
      try {
        const est = await navigator.storage.estimate();
        const usage = (est.usage / 1048576).toFixed(2);
        const quota = (est.quota / 1048576).toFixed(0);
        add('存储与性能', '存储配额', 'info',
          '已用 ' + usage + ' MB / 可用约 ' + quota + ' MB');
      } catch (e) {
        add('存储与性能', '存储配额', 'info', '无法获取（不影响使用）');
      }
    } else {
      add('存储与性能', '存储配额', 'info', '当前浏览器不提供配额查询接口');
    }

    const cores = navigator.hardwareConcurrency;
    if (cores) {
      const lvl = cores >= 4 ? 'pass' : 'warn';
      add('存储与性能', 'CPU 逻辑核心', lvl, cores + ' 核',
        cores < 4
          ? '核心数较少，PBKDF2 高迭代次数（500 万次以上）会明显变慢；粒子海洋 / 物理沙盒等 Canvas 重度工具可能掉帧。建议 AES 加密时选 10 万 ~ 100 万次。'
          : '');
    } else {
      add('存储与性能', 'CPU 逻辑核心', 'info', '浏览器未提供该信息');
    }

    const mem = navigator.deviceMemory;
    if (mem) {
      const lvl = mem >= 4 ? 'pass' : 'warn';
      add('存储与性能', '设备内存', lvl, '约 ' + mem + ' GB',
        mem < 4 ? '内存偏小，处理大于 50MB 的文件（AES 加密、星空画板打开大图）以及物理沙盒的复杂场景可能卡顿或崩溃。' : '');
    } else {
      add('存储与性能', '设备内存', 'info', '浏览器未提供（Chrome / Edge 支持）');
    }

    if (window.crypto && window.crypto.subtle) {
      const benchPromise = (async () => {
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey(
          'raw', enc.encode('bench'), { name: 'PBKDF2' }, false, ['deriveKey']);
        const t0 = performance.now();
        await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: new Uint8Array(16), iterations: 100000, hash: 'SHA-256' },
          baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
        return performance.now() - t0;
      })();

      let benchTimer = null;
      const dt = await Promise.race([
        benchPromise.catch(() => null),
        new Promise(resolve => {
          benchTimer = setTimeout(() => resolve('timeout'), 4000);
        })
      ]);
      if (benchTimer !== null) { clearTimeout(benchTimer); benchTimer = null; }

      if (dt === 'timeout') {
        add('存储与性能', 'PBKDF2 基准（10 万次）', 'fail',
          '> 4 秒（超时）',
          '设备性能极弱，10 万次 PBKDF2 都无法在 4 秒内完成。\n' +
          '强烈建议在 AES 加密工具中选择 10 万次以下迭代（如 5 万次），或更换设备。');
      } else if (dt === null) {
        add('存储与性能', 'PBKDF2 基准', 'info', '无法测量（执行异常）');
      } else {
        let lvl, tip;
        if (dt < 120)      { lvl = 'pass'; tip = '性能优秀，可使用 200 万次以上迭代。'; }
        else if (dt < 400) { lvl = 'pass'; tip = '性能良好，建议迭代次数 100 万 ~ 200 万次。'; }
        else if (dt < 1200){ lvl = 'warn'; tip = '性能偏弱，建议迭代不超过 100 万次，否则加密会明显等待。'; }
        else               { lvl = 'fail'; tip = '性能很弱，强烈建议使用 10 万 ~ 50 万次迭代，或更换设备。'; }

        add('存储与性能', 'PBKDF2 基准（10 万次）', lvl, dt.toFixed(0) + ' ms', tip);
      }
    }

    if (document.hidden) {
      add('存储与性能', '渲染帧率（粗测）', 'info', '页面在后台，跳过检测',
        '浏览器暂停了后台标签页的 requestAnimationFrame，无法测量帧率。请保持本页在前台后重新检测。');
    } else {
      const fpsResult = await measureFPS(2500);
      if (fpsResult.fps === null) {
        add('存储与性能', '渲染帧率（粗测）', 'info', '无法测量（' + fpsResult.reason + '）');
      } else {
        const fps = fpsResult.fps;
        const lvl = fps >= 50 ? 'pass' : fps >= 30 ? 'warn' : 'fail';
        const tip = fps >= 50 ? ''
          : fps >= 30 ? '动画流畅度一般，星空 + 粒子 + 液态玻璃同时开启时可能掉帧。'
          : '动画明显卡顿，粒子海洋 / 物理沙盒等高密度场景可能无法正常运行。建议关闭部分粒子效果，或更换设备 / 开启硬件加速。';
        add('存储与性能', '渲染帧率（粗测）', lvl, fps + ' FPS', tip);
      }
    }
  }

  function measureFPS(timeoutMs) {
    const SAMPLE_MS = 1200;
    return new Promise(resolve => {
      let timer = null;
      let resolved = false;
      const finish = result => {
        if (resolved) return;
        resolved = true;
        if (timer !== null) { clearTimeout(timer); timer = null; }
        resolve(result);
      };

      timer = setTimeout(
        () => finish({ fps: null, reason: '测量超时（可能页面被切到后台）' }),
        timeoutMs
      );

      let frames = 0;
      const t0 = performance.now();
      function loop() {
        if (resolved) return;
        frames++;
        const dt = performance.now() - t0;
        if (dt >= SAMPLE_MS) {
          finish({ fps: Math.round(frames / (dt / 1000)) });
          return;
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    });
  }

  function evaluateTools() {
    TOOL_MATRIX.forEach(tool => {
      const reqChips = [];
      const optChips = [];
      let hardFail = false;
      let undefinedDep = false;

      (tool.require || []).forEach(k => {
        const f = FEAT[k];
        if (!f) {
          warnOnce('FEAT:' + k, tool.title);
          undefinedDep = true;
          reqChips.push({ label: k + '（未检测）', state: 'warn' });
          return;
        }
        if (f.ok === false) hardFail = true;
        reqChips.push({ label: f.label, state: f.ok ? 'ok' : 'bad' });
      });

      (tool.optional || []).forEach(k => {
        const f = FEAT[k];
        if (!f) {
          warnOnce('FEAT:' + k, tool.title);
          undefinedDep = true;
          optChips.push({ label: k + '（未检测）', state: 'warn' });
          return;
        }
        optChips.push({ label: f.label, state: f.ok ? 'ok' : 'warn' });
      });

      (tool.requireNet || []).forEach(n => {
        const v = NET[n];
        if (!v) {
          warnOnce('NET:' + n, tool.title);
          undefinedDep = true;
          reqChips.push({ label: n + ' ·CDN（未检测）', state: 'warn' });
          return;
        }
        let state;
        if (!v.ok) { state = 'bad'; hardFail = true; }
        else if (v.uncertain) { state = 'warn'; }
        else { state = 'ok'; }
        reqChips.push({ label: n + ' ·CDN', state });
      });

      (tool.optionalNet || []).forEach(n => {
        const v = NET[n];
        if (!v) {
          warnOnce('NET:' + n, tool.title);
          undefinedDep = true;
          optChips.push({ label: n + ' ·CDN（未检测）', state: 'warn' });
          return;
        }
        let state;
        if (!v.ok) state = 'warn';
        else if (v.uncertain) state = 'warn';
        else state = 'ok';
        optChips.push({ label: n + ' ·CDN', state });
      });

      const hasWarn = reqChips.some(c => c.state === 'warn')
                   || optChips.some(c => c.state === 'warn');

      let level = 'pass';
      if (hardFail) level = 'fail';
      else if (hasWarn || undefinedDep || tool.restricted) level = 'warn';

      tool._level = level;
      tool._req   = reqChips;
      tool._opt   = optChips;
    });
  }

  /* ============================================================
     渲染
     ============================================================ */
  function renderOverview() {
    const counts = { pass:0, warn:0, fail:0, info:0 };
    R.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });

    const toolsPass = TOOL_MATRIX.filter(t => t._level === 'pass').length;
    const toolsWarn = TOOL_MATRIX.filter(t => t._level === 'warn').length;
    const toolsFail = TOOL_MATRIX.filter(t => t._level === 'fail').length;

    $('overview').innerHTML =
      ovCard(counts.pass, '通过', 'pass') +
      ovCard(counts.warn, '警告', 'warn') +
      ovCard(counts.fail, '失败', 'fail') +
      ovCard(toolsPass, '工具可用', 'pass') +
      ovCard(toolsWarn + toolsFail, '工具受限', toolsFail > 0 ? 'fail' : 'warn');
  }

  function ovCard(num, label, cls) {
    // 每一张概览卡都是液态玻璃折射目标
    return '<div class="ov-card glass-target" data-glass-radius="16">' +
           '<div class="ov-num ' + cls + '">' + num + '</div>' +
           '<div class="ov-label">' + label + '</div></div>';
  }

  const PREFERRED_CATS = ['运行环境', '核心能力', 'CSS 特性', '外部 CDN', '存储与性能'];
  function getCategoryOrder() {
    const allCats = [];
    R.forEach(r => { if (allCats.indexOf(r.cat) === -1) allCats.push(r.cat); });
    const head = PREFERRED_CATS.filter(c => allCats.indexOf(c) !== -1);
    const tail = allCats.filter(c => PREFERRED_CATS.indexOf(c) === -1);
    return head.concat(tail);
  }

  function toolBadgeText(level, tool) {
    if (level === 'pass') return '可正常使用';
    if (level === 'fail') return '无法使用';
    if (tool && tool.restricted) return '功能受限';
    return '部分功能降级';
  }

  function categorySummary(items) {
    const failCount = items.filter(i => i.status === 'fail').length;
    const warnCount = items.filter(i => i.status === 'warn').length;
    const passCount = items.filter(i => i.status === 'pass').length;
    const infoCount = items.filter(i => i.status === 'info').length;

    if (failCount)
      return '<span style="color:#fca5a5">' + failCount + ' 项失败</span>';
    if (warnCount)
      return '<span style="color:#fcd34d">' + warnCount + ' 项警告</span>';
    if (infoCount && passCount)
      return '<span style="color:#6ee7b7">' + passCount + ' 项通过</span>' +
             ' · <span style="color:#93a3c4">' + infoCount + ' 项信息</span>';
    if (passCount)
      return '<span style="color:#6ee7b7">全部通过</span>';
    return '<span style="color:#93a3c4">' + infoCount + ' 项信息</span>';
  }

  function renderReport() {
    const root = $('report');
    root.innerHTML = '';

    const order = getCategoryOrder();

    order.forEach(cat => {
      const items = R.filter(r => r.cat === cat);
      if (!items.length) return;

      const sec = document.createElement('section');
      sec.className = 'section';

      sec.innerHTML =
        '<h2 class="sec-title">' + esc(cat) +
        '<span class="sec-count">' + items.length + ' 项 · ' + categorySummary(items) + '</span></h2>' +
        '<div class="list"></div>';

      const list = sec.querySelector('.list');
      items.forEach(it => {
        const row = document.createElement('div');
        // 检测行不加折射（行数多、圆角小、折射效果不明显），保留纯半透明
        row.className = 'row ' + it.status;
        row.innerHTML =
          '<span class="dot"></span>' +
          '<div class="row-main">' +
            '<div class="row-head">' +
              '<span class="row-name">' + esc(it.name) + '</span>' +
              '<span class="row-msg">' + esc(it.msg) + '</span>' +
            '</div>' +
            (it.sol ? '<div class="row-sol">💡 ' + esc(it.sol).replace(/\n/g, '<br>') + '</div>' : '') +
          '</div>';
        list.appendChild(row);
      });

      root.appendChild(sec);
    });

    const sec = document.createElement('section');
    sec.className = 'section';
    sec.innerHTML = '<h2 class="sec-title">工具可用性评估' +
      '<span class="sec-count">共 ' + TOOL_MATRIX.length + ' 个工具</span></h2>' +
      '<div class="tools" id="toolGrid"></div>';
    root.appendChild(sec);

    const grid = sec.querySelector('#toolGrid');

    TOOL_MATRIX.forEach(tool => {
      const level = tool._level || 'warn';
      const req   = tool._req  || [];
      const opt   = tool._opt  || [];

      const card = document.createElement('div');
      // 工具卡片走折射
      card.className = 'tool ' + level + ' glass-target';
      card.dataset.glassRadius = '16';

      let chips = '';
      req.forEach(c => {
        chips += '<span class="chip ' + c.state + '">' +
          (c.state === 'bad' ? '✕ ' : c.state === 'warn' ? '⚠ ' : '✓ ') + esc(c.label) + '</span>';
      });
      opt.forEach(c => {
        chips += '<span class="chip ' + (c.state === 'warn' ? 'warn' : 'ok') + '">' +
          (c.state === 'warn' ? '⚠ ' : '✓ ') + esc(c.label) + '</span>';
      });
      if (!chips) chips = '<span class="chip na">无特殊依赖</span>';

      let noteHtml = '';
      if (tool.note) {
        noteHtml = '<div class="tool-note">' + esc(tool.note) + '</div>';
      }

      card.innerHTML =
        '<div class="tool-head">' +
          '<span class="tool-name">' + esc(tool.title) + '</span>' +
          '<span class="tool-badge">' + toolBadgeText(level, tool) + '</span>' +
        '</div>' +
        '<div class="tool-path">' + esc(tool.file) + '</div>' +
        '<div class="tool-deps">' + chips + '</div>' +
        noteHtml;

      grid.appendChild(card);
    });

    const sumSec = document.createElement('section');
    sumSec.className = 'section';
    sumSec.innerHTML = '<h2 class="sec-title">结论与修复建议</h2>' +
      '<div id="summaryBox"></div>';
    root.appendChild(sumSec);

    const fails = R.filter(r => r.status === 'fail');
    const warns = R.filter(r => r.status === 'warn');
    const box = sumSec.querySelector('#summaryBox');

    const lines = [];

    if (fails.length === 0 && warns.length === 0) {
      lines.push('🎉 <b style="color:#6ee7b7">当前环境完全通过检测</b>，站内所有工具都可以正常使用。');
    } else {
      if (fails.length) {
        lines.push('🚨 <b style="color:#fca5a5">发现 ' + fails.length + ' 项致命问题</b>，会导致部分工具无法使用：');
        fails.forEach(f => lines.push('&nbsp;&nbsp;• <b>' + esc(f.name) + '</b> — ' + esc(f.msg)));
      }
      if (warns.length) {
        lines.push('');
        lines.push('⚠️ <b style="color:#fcd34d">发现 ' + warns.length + ' 项警告</b>，功能会降级但不致命：');
        warns.forEach(w => lines.push('&nbsp;&nbsp;• <b>' + esc(w.name) + '</b> — ' + esc(w.msg)));
      }
    }

    lines.push('');
    lines.push('<b>📌 通用最佳实践</b>');
    lines.push('&nbsp;&nbsp;1. 若在国内网络环境，建议把 CDN 资源（JSZip、Ace、diff_match_patch、html2canvas、Google Fonts）' +
      '下载到本地，改为相对路径引用，可彻底摆脱网络波动影响。');

    const toolFails = TOOL_MATRIX.filter(t => t._level === 'fail');
    if (toolFails.length) {
      lines.push('&nbsp;&nbsp;2. 受影响无法使用的工具：' +
        toolFails.map(t => '<b>' + esc(t.title) + '</b>').join('、'));
    }

    box.innerHTML = '<div style="background:rgba(96,165,250,.10);' +
      'border:1px solid rgba(96,165,250,.30);color:#cfe0ff;padding:16px 20px;border-radius:16px;' +
      'font-size:.82rem;line-height:1.9;box-shadow:inset 0 .5px 0 0 rgba(255,255,255,.12)">' +
      lines.join('<br>') + '</div>';
  }

  /* ============================================================
     报告导出
     ============================================================ */
  function buildTextReport() {
    const lines = [];
    lines.push('═══════════════════════════════════════════');
    lines.push('  系统诊断报告');
    lines.push('  生成时间：' + new Date().toLocaleString('zh-CN'));
    lines.push('  页面地址：' + location.href);
    lines.push('═══════════════════════════════════════════');
    lines.push('');

    const order = getCategoryOrder();
    order.forEach(cat => {
      const items = R.filter(r => r.cat === cat);
      if (!items.length) return;
      lines.push('【' + cat + '】');
      items.forEach(it => {
        const icon = it.status === 'pass' ? '[✓]'
                   : it.status === 'warn' ? '[!]'
                   : it.status === 'fail' ? '[✗]' : '[i]';
        lines.push('  ' + icon + ' ' + it.name + '：' + it.msg);
        if (it.sol && typeof it.sol === 'string' && it.sol.length > 0) {
          it.sol.split('\n').forEach(s => lines.push('      ↳ ' + s));
        }
      });
      lines.push('');
    });

    lines.push('【工具可用性】');
    TOOL_MATRIX.forEach(t => {
      const level = t._level || 'warn';
      const icon = level === 'pass' ? '[✓]'
                 : level === 'warn' ? '[!]' : '[✗]';
      const tag = t.restricted ? '  ⟪功能受限：外部站点策略⟫' : '';
      lines.push('  ' + icon + ' ' + t.title + '（' + t.file + '）' + tag);
      if (t.note) lines.push('      ↳ ' + t.note);
    });
    lines.push('');

    lines.push('【总结】');
    const fails = R.filter(r => r.status === 'fail');
    const warns = R.filter(r => r.status === 'warn');
    lines.push('  失败项：' + fails.length + '  警告项：' + warns.length +
               '  通过项：' + R.filter(r => r.status === 'pass').length);
    if (fails.length === 0 && warns.length === 0) {
      lines.push('  ✅ 当前环境完全通过检测。');
    } else {
      if (fails.length) {
        lines.push('  致命问题：');
        fails.forEach(f => lines.push('    • ' + f.name + ' — ' + f.msg));
      }
      if (warns.length) {
        lines.push('  警告项：');
        warns.forEach(w => lines.push('    • ' + w.name + ' — ' + w.msg));
      }
    }
    lines.push('');
    lines.push('═══════════════════════════════════════════');
    return lines.join('\n');
  }

  function copyReport() {
    const text = buildTextReport();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(
        () => flashBtn($('btnCopy'), '✅ 已复制'),
        () => fallbackCopy(text)
      );
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      flashBtn($('btnCopy'), '✅ 已复制');
    } catch (e) {
      alert('复制失败，请手动选择文本');
    }
    document.body.removeChild(ta);
  }

  function downloadReport() {
    if (typeof Blob === 'undefined' ||
        typeof URL === 'undefined' ||
        typeof URL.createObjectURL !== 'function') {
      flashBtn($('btnDownload'), '❌ 不支持下载');
      return;
    }
    try {
      const text = buildTextReport();
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '诊断报告_' +
        new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 500);
      flashBtn($('btnDownload'), '✅ 已下载');
    } catch (e) {
      console.error('[诊断] 下载失败：', e);
      flashBtn($('btnDownload'), '❌ 下载失败');
    }
  }

  function flashBtn(btn, text) {
    if (btn._flashTimer) {
      clearTimeout(btn._flashTimer);
      btn._flashTimer = null;
      if (btn._flashOriginal != null) btn.textContent = btn._flashOriginal;
    } else {
      btn._flashOriginal = btn.textContent;
    }
    btn.textContent = text;
    btn.disabled = true;
    btn._flashTimer = setTimeout(() => {
      btn.textContent = btn._flashOriginal;
      btn.disabled = isRunning;
      btn._flashTimer = null;
      btn._flashOriginal = null;
      // 按钮文字恢复后重建玻璃（宽度可能微变）
      refreshGlass(true);
    }, 1400);
  }

  /* ============================================================
     主流程
     ============================================================ */
  const ALL_BTN_IDS = ['btnRerun', 'btnCopy', 'btnDownload'];

  function setAllBtnsDisabled(disabled) {
    ALL_BTN_IDS.forEach(id => { $(id).disabled = disabled; });
  }

  async function run() {
    if (isRunning) return;
    isRunning = true;
    setAllBtnsDisabled(true);

    R.length = 0;
    Object.keys(FEAT).forEach(k => delete FEAT[k]);
    Object.keys(NET).forEach(k => delete NET[k]);
    _warnedKeys.clear();
    $('barFill').style.width = '0%';
    $('report').innerHTML = '';
    $('overview').innerHTML = '';

    try {
      progress('正在检测运行环境…', 10);
      checkEnvironment();

      progress('正在检测 CSS 特性…', 20);
      checkCSS();

      progress('正在并行测试核心 API / 外部 CDN / 性能…', 35);

      const tasks = [
        { name: '核心能力检测', promise: checkCore()    },
        { name: '外部 CDN 检测', promise: checkNetwork() },
        { name: '性能检测',     promise: checkPerf()    }
      ];
      const settled = await Promise.allSettled(tasks.map(t => t.promise));
      settled.forEach((r, i) => {
        if (r.status === 'rejected') {
          const reason = (r.reason && r.reason.message) || r.reason || '未知错误';
          add('运行环境', tasks[i].name + '异常', 'fail',
            '检测过程抛出异常：' + reason,
            '该分类的部分数据可能缺失。请刷新页面后重试；若反复出现，请更换浏览器并在控制台查看完整堆栈。');
          console.error('[诊断] ' + tasks[i].name + ' reject：', r.reason);
        }
      });

      progress('正在评估各工具可用性…', 85);
      evaluateTools();

      progress('正在生成诊断报告…', 95);
      renderOverview();
      renderReport();

      // 报告卡片渲染完成后，构建液态玻璃折射
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          refreshGlass(true);
        });
      });

      $('barFill').style.width = '100%';
      const fails = R.filter(r => r.status === 'fail').length;
      const warns = R.filter(r => r.status === 'warn').length;
      $('barText').textContent = fails === 0 && warns === 0
        ? '✅ 检测完成 · 环境完全正常'
        : '✅ 检测完成 · ' + fails + ' 项失败 / ' + warns + ' 项警告';

    } catch (e) {
      $('barText').textContent = '❌ 诊断过程出错：' + (e.message || e);
      add('运行环境', '诊断流程', 'fail', e.message || String(e),
        '请刷新页面后重试。若反复出现，请更换浏览器。');
      renderOverview();
      renderReport();
      requestAnimationFrame(function () { refreshGlass(true); });
    } finally {
      isRunning = false;
      setAllBtnsDisabled(false);
      // 按钮从禁用恢复后重建
      setTimeout(function () { refreshGlass(true); }, 60);
    }
  }

  $('btnRerun').addEventListener('click', run);
  $('btnCopy').addEventListener('click', copyReport);
  $('btnDownload').addEventListener('click', downloadReport);

  if (document.readyState === 'complete') {
    setTimeout(run, 0);
  } else {
    window.addEventListener('load', run, { once: true });
  }

})();
</script>
</body>
</html>
