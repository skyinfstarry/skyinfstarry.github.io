<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星空 · 流星雨 · 月球背景</title>
<style>
    /* ========== 全局重置 ========== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
    }

    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
        background: #03050b;
        color: #fff;
    }

    /* 星空 + 流星雨画布 */
    #starCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
        pointer-events: none;
    }

    /* 月球层（NASA 贴图 · WebGL 渲染，遮挡其背后的星星与流星） */
    #moonCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 1;
        pointer-events: none;
    }

    /* 微粒子层 */
    #particleCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 2;
        pointer-events: none;
    }

    /* 你的内容放这里（z-index: 3 以上） */
    .content {
        position: relative;
        z-index: 3;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
</style>
</head>
<body>

    <!-- 星空 + 流星雨画布 -->
    <canvas id="starCanvas"></canvas>
    <!-- 月球层 -->
    <canvas id="moonCanvas"></canvas>
    <!-- 微粒子层 -->
    <canvas id="particleCanvas"></canvas>

    <!-- 示例内容层：不需要可直接删除 -->
    <div class="content"></div>

<script>
(function () {
    "use strict";

    /* ============================================================
       第一部分：星空 + 全区域随机方向流星雨
       （时间戳驱动，跨帧率表现一致）
       ============================================================ */

    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');

    let stars = [];
    const STAR_COUNT = 220;
    let width = 0, height = 0;

    const meteors = [];
    const MAX_METEORS = 3;

    let nextMeteorTime = 0;
    let burstRemaining = 0;
    let nextBurstShotTime = 0;
    let nextBurstCheckTime = 0;

    function scheduleNextMeteor(now) {
        nextMeteorTime = now + 2500 + Math.random() * 5500;
    }

    function scheduleNextBurstShot(now) {
        nextBurstShotTime = now + 200 + Math.random() * 600;
    }

    function initStars() {
        stars = [];
        for (let i = 0; i < STAR_COUNT; i++) {
            stars.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 2.2 + 0.8,
                alpha: Math.random() * 0.5 + 0.3,
                speed: 0.002 + Math.random() * 0.008,
                offset: Math.random() * Math.PI * 2
            });
        }
    }

    function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        /* 高分屏适配：backing store 乘 devicePixelRatio，逻辑坐标仍用 CSS 像素 */
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initStars();
    }

    /* 从屏幕四边随机位置生成流星，方向指向画面内部随机点 */
    function spawnMeteor(speedBoost, now) {
        if (meteors.length >= MAX_METEORS) return;

        const baseSpeed = 320 + Math.random() * 420;
        const speed = speedBoost ? baseSpeed * 1.4 : baseSpeed;
        const pad = 120;

        const edge = Math.floor(Math.random() * 4);
        let startX, startY;
        if (edge === 0) {
            startX = Math.random() * width;  startY = -pad;
        } else if (edge === 1) {
            startX = width + pad;            startY = Math.random() * height;
        } else if (edge === 2) {
            startX = Math.random() * width;  startY = height + pad;
        } else {
            startX = -pad;                   startY = Math.random() * height;
        }

        const targetX = width  * (0.1 + Math.random() * 0.8);
        const targetY = height * (0.1 + Math.random() * 0.8);
        const dx = targetX - startX;
        const dy = targetY - startY;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;

        const warm = Math.random() < 0.22;  // 少量暖白色流星

        meteors.push({
            x: startX,
            y: startY,
            vx: (dx / d) * speed,
            vy: (dy / d) * speed,
            len: 80 + Math.random() * 200,
            width: 0.8 + Math.random() * 1.6,
            bornAt: now,
            fadeIn: 60 + Math.random() * 80,
            hue: warm ? '255, 240, 220' : '198, 224, 255'
        });
    }

    function updateMeteors(now, dtSec) {
        /* 常规单颗流星 */
        if (now >= nextMeteorTime) {
            spawnMeteor(false, now);
            scheduleNextMeteor(now);
        }

        /* 偶尔来一小段流星雨 */
        if (burstRemaining === 0 && now >= nextBurstCheckTime) {
            if (Math.random() < 0.5) {
                burstRemaining = 2 + Math.floor(Math.random() * 2);
                nextBurstShotTime = now;
            }
            nextBurstCheckTime = now + 30000 + Math.random() * 60000;
        }
        if (burstRemaining > 0 && now >= nextBurstShotTime) {
            spawnMeteor(true, now);
            burstRemaining--;
            if (burstRemaining > 0) scheduleNextBurstShot(now);
        }

        /* 位移 + 回收 */
        const pad = 100;
        for (let i = meteors.length - 1; i >= 0; i--) {
            const m = meteors[i];
            m.x += m.vx * dtSec;
            m.y += m.vy * dtSec;

            const offDist = Math.max(
                -m.x - pad, m.x - width - pad,
                -m.y - pad, m.y - height - pad,
                0
            );
            if (offDist > 320) meteors.splice(i, 1);
        }
    }

    function drawMeteors(now) {
        const pad = 100;

        for (let i = 0; i < meteors.length; i++) {
            const m = meteors[i];

            const d = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
            const ux = m.vx / d;
            const uy = m.vy / d;
            const tailX = m.x - ux * m.len;
            const tailY = m.y - uy * m.len;

            /* 淡入 + 出屏淡出 */
            let a = 1;
            const age = now - m.bornAt;
            if (age < m.fadeIn) a = age / m.fadeIn;

            const offDist = Math.max(
                -m.x - pad, m.x - width - pad,
                -m.y - pad, m.y - height - pad,
                0
            );
            a *= 1 - Math.min(1, offDist / 250);
            if (a <= 0.02) continue;

            const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
            grad.addColorStop(0,    'rgba(255, 255, 255, ' + (a * 0.95) + ')');
            grad.addColorStop(0.12, 'rgba(' + m.hue + ', ' + (a * 0.72) + ')');
            grad.addColorStop(0.55, 'rgba(' + m.hue + ', ' + (a * 0.20) + ')');
            grad.addColorStop(1,    'rgba(' + m.hue + ', 0)');

            ctx.save();
            ctx.lineCap = 'round';

            /* 外层辉光 */
            ctx.strokeStyle = grad;
            ctx.globalAlpha = 0.35;
            ctx.lineWidth = m.width * 3.2;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();

            /* 内层实线 */
            ctx.globalAlpha = 1;
            ctx.strokeStyle = grad;
            ctx.lineWidth = m.width;
            ctx.beginPath();
            ctx.moveTo(m.x, m.y);
            ctx.lineTo(tailX, tailY);
            ctx.stroke();

            /* 头部光晕 */
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.width * 3.4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + m.hue + ', ' + (a * 0.13) + ')';
            ctx.fill();

            /* 头部亮核 */
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.width * 0.9, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, ' + (a * 0.92) + ')';
            ctx.fill();

            ctx.restore();
        }
    }

    let lastFrameTime = 0;

    function renderLoop(now) {
        if (lastFrameTime === 0) lastFrameTime = now;
        const dt = Math.min(now - lastFrameTime, 100);
        lastFrameTime = now;
        const dtSec = dt / 1000;

        /* 背景 */
        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#03050b';
        ctx.fillRect(0, 0, width, height);

        /* 星星闪烁 */
        const nowSec = now / 1000;
        for (let i = 0; i < stars.length; i++) {
            const star = stars[i];
            const twinkle = 0.5 + 0.5 * Math.sin(nowSec * star.speed * 2.5 + star.offset);
            const alpha = Math.min(star.alpha * (0.6 + twinkle * 0.5), 0.95);

            ctx.beginPath();
            ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(225, 235, 255, ' + alpha + ')';
            ctx.fill();

            /* 大星额外光晕 */
            if (star.radius > 1.5 && twinkle > 0.7) {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(180, 210, 255, ' + (alpha * 0.2) + ')';
                ctx.fill();
            }
        }

        /* 流星 */
        updateMeteors(now, dtSec);
        drawMeteors(now);

        requestAnimationFrame(renderLoop);
    }

    /* ============================================================
       第二部分：微粒子层（缓慢漂浮的光尘）
       ============================================================ */

    const particleCanvas = document.getElementById('particleCanvas');
    const particleCtx = particleCanvas.getContext('2d');

    let particles = [];
    const PARTICLE_COUNT = 30;

    function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                size: Math.random() * 2 + 1,
                alpha: 0.2,
                vx: (Math.random() - 0.5) * 0.2,
                vy: (Math.random() - 0.5) * 0.1
            });
        }
    }

    function resizeParticleCanvas() {
        particleCanvas.width = window.innerWidth;
        particleCanvas.height = window.innerHeight;
        initParticles();
    }

    function animateParticles() {
        const W = particleCanvas.width, H = particleCanvas.height;
        particleCtx.clearRect(0, 0, W, H);

        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;

            /* 环绕出屏 */
            if (p.x < 0) p.x = W;
            if (p.x > W) p.x = 0;
            if (p.y < 0) p.y = H;
            if (p.y > H) p.y = 0;

            particleCtx.beginPath();
            particleCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            particleCtx.fillStyle = 'rgba(180, 200, 255, ' + (p.alpha * 0.5) + ')';
            particleCtx.fill();
        }

        requestAnimationFrame(animateParticles);
    }

    /* ============================================================
       第三部分：启动
       ============================================================ */

    function init() {
        /* 背景画布 */
        resizeCanvas();

        /* 粒子层 */
        resizeParticleCanvas();

        /* 首颗流星 & 首次流星雨判定 */
        const t0 = performance.now();
        nextMeteorTime = t0 + 1000 + Math.random() * 2000;
        nextBurstCheckTime = t0 + 30000 + Math.random() * 30000;

        /* 尺寸变化 */
        window.addEventListener('resize', function () {
            resizeCanvas();
            resizeParticleCanvas();
        });

        /* 开跑 */
        requestAnimationFrame(renderLoop);
        animateParticles();
    }

    init();
})();
</script>

    /* --- 可调参数 --- */
    const SUN_DIR = [-0.72, 0.45, 0.53];  /* 视空间太阳方向（x右 y上 z朝观察者），盈凸月约 75% 受照 */
    const GLOW_TIGHT = 0.11;              /* 紧贴盘面的亮晕强度 */
    const GLOW_WIDE  = 0.022;              /* 外围大范围微光 */
    const EARTHSHINE = 0.055;             /* 地照强度（夜侧） */
    const BUMP       = 2.6;               /* 地形法线扰动强度 */

    const canvas = document.getElementById('moonCanvas');
    let layout = { w: 0, h: 0, R: 0, cx: 0, cy: 0 };

    /* 桌面/竖屏两种排布：右上区域，不遮挡中央内容层 */
    function computeLayout() {
        const w = window.innerWidth, h = window.innerHeight;
        const portrait = h > w * 1.15;
        const R = portrait
            ? Math.min(Math.max(Math.min(w, h) * 0.20, 75), 150)
            : Math.min(Math.max(Math.min(w, h) * 0.21, 105), 210);
        layout = {
            w: w, h: h, R: R,
            cx: portrait ? w * 0.72 : w * 0.78,
            cy: portrait ? h * 0.17 : h * 0.22
        };
    }

    /* 离屏 WebGL 画布：月面渲染一次后拷贝为静态位图上屏，
       浏览器即可缓存该合成层 —— 无论真机 GPU 还是软渲染环境，
       每帧成本都趋近于零，星空/流星原有帧率不受影响 */
    const glCanvas = document.createElement('canvas');
    const gl = glCanvas.getContext('webgl', {
        alpha: true,
        antialias: true,
        premultipliedAlpha: true,
        preserveDrawingBuffer: true,
        depth: false,
        stencil: false
    });
    let viewCtx = null;

    /* WebGL 不可用时退化为 2D 近似渲染（纹理 + 光照渐变叠加） */
    if (!gl) { fallback2D(); } else { initGL(); }

    function initGL() {
        const VS = [
            'attribute vec2 aPos;',
            'varying vec2 vUV;',
            'void main(){ vUV = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }'
        ].join('\n');

        const FS = [
            '#ifdef GL_FRAGMENT_PRECISION_HIGH',
            'precision highp float;',
            '#else',
            'precision mediump float;',
            '#endif',
            'varying vec2 vUV;',
            'uniform vec2  uResolution;',
            'uniform vec2  uCenter;',
            'uniform float uRadius;',
            'uniform vec3  uSun;',
            'uniform sampler2D uMap;',
            'const float PI = 3.141592653589793;',

            'float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }',

            'void main(){',
            '  vec2 frag = vec2(vUV.x, 1.0 - vUV.y) * uResolution;',
            '  vec2 p = (frag - uCenter) / uRadius;',
            '  float r2 = dot(p, p);',
            '  vec4 outc = vec4(0.0);',

            '  if (r2 < 1.0) {',
            '    float z = sqrt(max(0.0, 1.0 - r2));',
            '    vec3 N = vec3(p.x, -p.y, z);',

            '    /* 等距圆柱展开：可见半球正对贴图中心 */',
            '    float lon = atan(N.x, N.z);',
            '    float lat = asin(clamp(N.y, -1.0, 1.0));',
            '    vec2 tuv = vec2(0.5 + lon / PI, 0.5 - lat / PI);',
            '    vec3 albedo = texture2D(uMap, tuv).rgb;',

            '    /* 亮度梯度 -> 法线扰动（暗色月海低洼、亮色高地隆起） */',
            '    vec2 texel = vec2(1.0 / 1024.0, 1.0 / 1024.0);',
            '    float hC = lum(albedo);',
            '    float hX = lum(texture2D(uMap, tuv + vec2(texel.x, 0.0)).rgb);',
            '    float hY = lum(texture2D(uMap, tuv + vec2(0.0, texel.y)).rgb);',
            '    vec3 east  = normalize(vec3(N.z, 0.0, -N.x));',
            '    vec3 north = cross(N, east);',
            '    float bumpAmt = ' + BUMP.toFixed(2) + ' * clamp(cos(lat), 0.25, 1.0);',
            '    vec3 Nb = normalize(N + (east * (hX - hC) + north * (hY - hC)) * bumpAmt);',

            '    float mu  = dot(Nb, uSun);',
            '    float mu0 = dot(N,  uSun);',

            '    /* 软明暗界线（晨昏线渐变）+ 冲日增亮 + 临边昏暗 */',
            '    float day   = clamp(mu, 0.0, 1.0);',
            '    float soft  = smoothstep(-0.08, 0.26, mu0);',
            '    float shade = day * mix(0.16, 1.0, soft);',
            '    float surge = 1.0 + 0.30 * pow(clamp(mu0, 0.0, 1.0), 4.0);',
            '    float limb  = 0.62 + 0.38 * pow(z, 0.45);',
            '    vec3 col = albedo * shade * surge * limb;',

            '    /* 地照：夜侧被地球照亮的极微弱冷光 */',
            '    float night = 1.0 - smoothstep(-0.18, 0.04, mu0);',
            '    col += albedo * vec3(0.30, 0.40, 0.62) * ' + EARTHSHINE.toFixed(3) + ' * night;',

            '    /* 光侧临边轻微前向散射（薄雾感轮廓光） */',
            '    col += vec3(0.90, 0.95, 1.0) * pow(1.0 - z, 7.0) * 0.10 * clamp(mu0 * 2.0, 0.0, 1.0);',

            '    /* 月面真实色彩：中灰偏暖褐，去一点蓝 */',
            '    col = pow(col, vec3(0.95, 0.93, 0.90));',
            '    col *= vec3(1.06, 1.02, 0.98);',

            '    outc = vec4(col, 1.0);',
            '  } else if (r2 < 36.0) {',
            '    /* 盘外光学：贴盘衍射微晕 + 大范围"月光冲刷"（地球大气散射，',
            '       会压暗明月附近的暗星，还原真实天文摄影观感） */',
            '    float r = sqrt(r2);',
            '    float d = r - 1.0;',
            '    vec2 q = p / max(r, 1e-4);',
            '    float litBias = clamp(dot(vec2(q.x, -q.y), normalize(uSun.xy)) * 0.5 + 0.5, 0.0, 1.0);',
            '    float tight = exp(-d * 8.0) * ' + GLOW_TIGHT.toFixed(2) + ';',
            '    float wide  = exp(-d * 1.8) * ' + GLOW_WIDE.toFixed(2) + ';',
            '    float wash  = exp(-d * 0.55) * 0.09;',
            '    float a = tight * (0.35 + 0.65 * litBias) + (wide + wash) * (0.45 + 0.55 * litBias);',
            '    outc = vec4(vec3(0.62, 0.72, 0.95) * a, a);',
            '  }',

            '  gl_FragColor = outc;',
            '}'
        ].join('\n');

        function compile(type, src) {
            const sh = gl.createShader(type);
            gl.shaderSource(sh, src);
            gl.compileShader(sh);
            if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
                console.error('moon shader:', gl.getShaderInfoLog(sh));
                return null;
            }
            return sh;
        }

        const vs = compile(gl.VERTEX_SHADER, VS);
        const fs = compile(gl.FRAGMENT_SHADER, FS);
        if (!vs || !fs) { fallback2D(); return; }

        const prog = gl.createProgram();
        gl.attachShader(prog, vs);
        gl.attachShader(prog, fs);
        gl.linkProgram(prog);
        if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { fallback2D(); return; }
        gl.useProgram(prog);

        /* 全屏四边形 */
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
        const locPos = gl.getAttribLocation(prog, 'aPos');
        gl.enableVertexAttribArray(locPos);
        gl.vertexAttribPointer(locPos, 2, gl.FLOAT, false, 0, 0);

        const uResolution = gl.getUniformLocation(prog, 'uResolution');
        const uCenter = gl.getUniformLocation(prog, 'uCenter');
        const uRadius = gl.getUniformLocation(prog, 'uRadius');
        const uSun = gl.getUniformLocation(prog, 'uSun');

        const sunLen = Math.hypot(SUN_DIR[0], SUN_DIR[1], SUN_DIR[2]) || 1;
        const sun = [SUN_DIR[0] / sunLen, SUN_DIR[1] / sunLen, SUN_DIR[2] / sunLen];

        /* 预乘 alpha 混合：月盘完全遮蔽背后星空，辉光如薄雾般罩住星星 */
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.disable(gl.DEPTH_TEST);

        let mapTex = null;
        let glReady = false;

        function render() {
            if (!glReady) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            glCanvas.width = Math.round(layout.w * dpr);
            glCanvas.height = Math.round(layout.h * dpr);
            gl.viewport(0, 0, glCanvas.width, glCanvas.height);
            gl.uniform2f(uResolution, glCanvas.width, glCanvas.height);
            gl.uniform2f(uCenter, layout.cx * dpr, layout.cy * dpr);
            gl.uniform1f(uRadius, layout.R * dpr);
            gl.uniform3f(uSun, sun[0], sun[1], sun[2]);
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

            /* 渲染结果拷贝到可见 2D 画布：静态位图，合成层可缓存 */
            if (!viewCtx) viewCtx = canvas.getContext('2d');
            canvas.width = glCanvas.width;
            canvas.height = glCanvas.height;
            viewCtx.drawImage(glCanvas, 0, 0);
        }

        function loadTexture() {
            const img = new Image();
            img.onload = function () {
                mapTex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, mapTex);
                gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
                gl.generateMipmap(gl.TEXTURE_2D);
                const ext = gl.getExtension('EXT_texture_filter_anisotropic');
                if (ext) {
                    gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT,
                        Math.min(8, gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
                }
                glReady = true;
                render();
            };
            img.onerror = function () { fallback2D(); };
            img.src = MOON_MAP_JPEG;
        }

        let resizeTimer = null;
        window.addEventListener('resize', function () {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                computeLayout();
                render();
            }, 120);
        });

        computeLayout();
        loadTexture();
    }

    /* ---------- 2D 降级：纹理 + 光照渐变的近似月面 ---------- */
    function fallback2D() {
        const ctx2d = canvas.getContext('2d');
        if (!ctx2d) return;
        const img = new Image();
        img.onload = function () {
            function paint() {
                const { w, h, R, cx, cy } = layout;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(h * dpr);
                ctx2d.setTransform(dpr, 0, 0, dpr, 0, 0);
                ctx2d.clearRect(0, 0, w, h);

                /* 辉光 */
                const glow = ctx2d.createRadialGradient(cx, cy, R * 0.85, cx, cy, R * 2.4);
                glow.addColorStop(0, 'rgba(200, 215, 255, 0.12)');
                glow.addColorStop(1, 'rgba(180, 200, 255, 0)');
                ctx2d.fillStyle = glow;
                ctx2d.fillRect(0, 0, w, h);

                /* 月盘：贴图中央可见半球 + 沿太阳方向的光照渐变 */
                ctx2d.save();
                ctx2d.beginPath();
                ctx2d.arc(cx, cy, R, 0, Math.PI * 2);
                ctx2d.clip();
                ctx2d.drawImage(img, 0, 0, img.width, img.height, cx - R, cy - R, R * 2, R * 2);

                const shade = ctx2d.createLinearGradient(cx + R * 0.9, cy - R * 0.55, cx - R, cy + R * 0.6);
                shade.addColorStop(0, 'rgba(0,0,0,0)');
                shade.addColorStop(0.55, 'rgba(2,4,10,0.45)');
                shade.addColorStop(0.78, 'rgba(2,4,10,0.88)');
                shade.addColorStop(1, 'rgba(2,4,10,0.97)');
                ctx2d.fillStyle = shade;
                ctx2d.fillRect(cx - R, cy - R, R * 2, R * 2);
                ctx2d.restore();
            }
            computeLayout();
            paint();
            let rt = null;
            window.addEventListener('resize', function () {
                clearTimeout(rt);
                rt = setTimeout(function () { computeLayout(); paint(); }, 120);
            });
        };
        img.src = MOON_MAP_JPEG;
    }
})();
</script>
