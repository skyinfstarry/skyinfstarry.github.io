<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>观测者手记 | 阅读</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body {
        width:100%; height:100%; overflow:hidden;
        background:#02040a; color:#fff;
        font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
    }

    #starCanvas {
        position:fixed; inset:0; width:100%; height:100%;
        display:block; z-index:0; pointer-events:none;
        opacity:0; transition:opacity 2.4s ease;
        background:transparent;
    }
    #starCanvas.show { opacity:0.65; }

    /* ============ 主题变量 ============ */
    :root{
        --font-size: 17px;
        --line-height: 2.15;
        --para-gap: 1.55em;
        --content-width: 660px;
        --paper-pad-x: 3.4rem;
        --paper-pad-y: 4.2rem;

        --text-main: #ccd6ec;
        --text-dim: #6a7899;
        --text-title: #eaf1ff;
        --text-chapter-sub: #56617d;

        --paper-bg: rgba(255,255,255,0.028);
        --paper-border: rgba(255,255,255,0.055);
        --paper-shadow: 0 30px 80px rgba(0,0,0,0.6);

        --accent: #8cbaff;
        --accent-soft: rgba(140,186,255,0.16);
        --ui-text: rgba(255,255,255,0.62);
        --ui-text-strong: #fff;
    }

    body[data-theme="warm"]{
        --text-main: #d9cbb4;
        --text-dim: #8a7c66;
        --text-title: #efe4cc;
        --text-chapter-sub: #6e6250;
        --paper-bg: rgba(40,32,22,0.35);
        --paper-border: rgba(180,150,110,0.1);
        --accent: #d4b073;
        --accent-soft: rgba(212,176,115,0.14);
    }

    body[data-theme="green"]{
        --text-main: #cfe4cd;
        --text-dim: #7c9179;
        --text-title: #e9f7e7;
        --text-chapter-sub: #5c6e59;
        --paper-bg: rgba(14,32,22,0.38);
        --paper-border: rgba(140,200,150,0.09);
        --accent: #8fe0a5;
        --accent-soft: rgba(143,224,165,0.14);
    }

    /* ============ 顶栏 ============ */
    .topbar {
        position:fixed; top:0; left:0; width:100%; height:52px;
        display:flex; align-items:center; justify-content:space-between;
        padding:0 1.1rem; gap:10px;
        z-index:30;
        background:rgba(2,4,10,0.35);
        backdrop-filter:blur(20px) saturate(140%);
        -webkit-backdrop-filter:blur(20px) saturate(140%);
        border-bottom:1px solid rgba(255,255,255,0.045);
        transition:transform .45s cubic-bezier(.2,.9,.4,1.1), opacity .35s ease;
    }
    body.immersive .topbar { transform:translateY(-100%); opacity:0; pointer-events:none; }
    body.immersive .progress-line { opacity:0; }

    .bar-btn {
        position:relative; display:inline-flex; align-items:center; justify-content:center;
        height:34px; padding:0 .95rem;
        font-family:inherit; font-size:.78rem; font-weight:500;
        letter-spacing:2.5px;
        color:var(--ui-text);
        background:transparent;
        border:1px solid rgba(255,255,255,0.07);
        border-radius:999px;
        cursor:pointer; white-space:nowrap;
        transition:color .25s ease, border-color .25s ease, background-color .25s ease;
    }
    .bar-btn:hover { color:#fff; border-color:rgba(255,255,255,0.22); background:rgba(255,255,255,0.04); }
    .bar-btn:active { transform:translateY(1px); }

    .bar-center {
        flex:1; min-width:0; text-align:center;
        font-size:.74rem; letter-spacing:5px;
        color:var(--ui-text); opacity:.55;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
        padding:0 .4rem;
    }

    .progress-line {
        position:fixed; top:52px; left:0; width:100%; height:1px;
        background:rgba(255,255,255,0.035);
        z-index:31; pointer-events:none;
        transition:opacity .4s ease;
    }
    .progress-fill {
        height:100%; width:0%;
        background:linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity:.7;
        transition:width .14s linear;
    }

    /* ============ 阅读区 ============ */
    .reading-area {
        position:relative; z-index:3;
        width:100%; height:100%;
        overflow-y:auto; overflow-x:hidden;
        -webkit-overflow-scrolling:touch;
        padding:96px 1.25rem 8rem;
        scroll-behavior:smooth;
        scrollbar-width:thin;
        scrollbar-color:rgba(255,255,255,0.14) transparent;
    }
    body.immersive .reading-area { padding-top:48px; }

    .reading-area::-webkit-scrollbar { width:5px; }
    .reading-area::-webkit-scrollbar-track { background:transparent; }
    .reading-area::-webkit-scrollbar-thumb {
        background:rgba(255,255,255,0.1);
        border-radius:10px;
    }

    .paper {
        position:relative;
        width:100%; max-width:var(--content-width);
        margin:0 auto;
        padding:var(--paper-pad-y) var(--paper-pad-x);
        background:var(--paper-bg);
        border:1px solid var(--paper-border);
        border-radius:4px;
        backdrop-filter:blur(20px) saturate(130%);
        -webkit-backdrop-filter:blur(20px) saturate(130%);
        box-shadow:var(--paper-shadow);
        transition:background-color .6s ease, border-color .6s ease, max-width .4s ease, padding .35s ease;
    }
    .paper::before {
        content:''; position:absolute; top:0; left:20%; right:20%; height:1px;
        background:linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
        pointer-events:none;
    }

    /* ============ 章节头 ============ */
    .chapter-head {
        text-align:center;
        margin-bottom:3.6rem;
        padding-bottom:2.4rem;
        position:relative;
    }
    .chapter-head::after {
        content:''; position:absolute; bottom:0; left:38%; right:38%; height:1px;
        background:linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    .chapter-mark {
        font-size:.65rem; letter-spacing:8px;
        color:var(--text-chapter-sub);
        margin-bottom:1.6rem;
        opacity:.7;
    }

    .chapter-title {
        font-size:clamp(1.3rem,4vw,1.65rem);
        font-weight:400;
        letter-spacing:6px;
        line-height:1.7;
        color:var(--text-title);
        text-shadow:0 0 40px rgba(140,190,255,0.14);
    }

    /* ============ 正文 ============ */
    .chapter-content {
        color:var(--text-main);
        user-select:text;
        -webkit-user-select:text;
    }
    .chapter-content p {
        font-size:var(--font-size);
        line-height:var(--line-height);
        letter-spacing:0.03em;
        margin-bottom:var(--para-gap);
        text-indent:2em;
        word-break:break-word;
        font-weight:300;
        transition:font-size .25s ease, line-height .25s ease;
    }
    .chapter-content p:last-child { margin-bottom:0; }

    .chapter-content p.solo {
        text-indent:0;
        font-size:calc(var(--font-size) * 1.06);
        color:var(--text-title);
        opacity:.95;
        letter-spacing:0.08em;
        margin-top:calc(var(--para-gap) * 0.5);
        margin-bottom:calc(var(--para-gap) * 0.5);
        padding-left:0.6em;
        border-left:1px solid var(--accent-soft);
        padding-top:.15em;
        padding-bottom:.15em;
    }

    .chapter-end {
        margin-top:3.6rem;
        text-align:center;
        font-size:.6rem;
        letter-spacing:12px;
        color:var(--text-dim);
        opacity:.35;
        user-select:none;
    }
    .chapter-end::before {
        content:'◆';
        display:block;
        font-size:.5rem;
        margin-bottom:1.2rem;
        opacity:.5;
    }

    /* ============ 底部翻章（桌面端默认布局） ============ */
    .chapter-nav {
        display:flex; align-items:center; justify-content:center;
        gap:1.4rem;
        width:100%; max-width:var(--content-width);
        margin:3rem auto 0;
        padding:0 .5rem;
    }

    .nav-btn {
        position:relative;
        display:inline-flex; align-items:center; justify-content:center;
        gap:10px;
        flex:0 0 auto;
        min-width:110px;
        padding:.72rem 1.3rem;
        font-family:inherit; font-size:.78rem; font-weight:400;
        letter-spacing:3px;
        color:var(--ui-text);
        background:transparent;
        border:1px solid rgba(255,255,255,0.07);
        border-radius:999px;
        cursor:pointer;
        white-space:nowrap;
        transition:color .25s ease, border-color .25s ease, background-color .25s ease, opacity .25s ease;
    }
    .nav-btn:hover:not(:disabled) {
        color:#fff;
        border-color:rgba(255,255,255,0.24);
        background:rgba(255,255,255,0.03);
    }
    .nav-btn:active:not(:disabled) { transform:translateY(1px); }
    .nav-btn:disabled { opacity:.22; cursor:not-allowed; }
    .nav-btn.primary {
        color:var(--ui-text-strong);
        border-color:rgba(140,186,255,0.32);
        background:var(--accent-soft);
    }
    .nav-btn.primary:hover:not(:disabled) {
        border-color:rgba(140,186,255,0.5);
        background:rgba(140,186,255,0.22);
    }

    .nav-index {
        flex:0 0 auto;
        font-size:.68rem;
        letter-spacing:3px;
        color:var(--text-dim);
        opacity:.6;
        white-space:nowrap;
        font-variant-numeric:tabular-nums;
    }

    /* ============ 遮罩 ============ */
    .mask {
        position:fixed; inset:0;
        background:rgba(0,0,0,0.6);
        backdrop-filter:blur(4px);
        -webkit-backdrop-filter:blur(4px);
        z-index:40;
        opacity:0; visibility:hidden;
        transition:opacity .35s ease, visibility 0s linear .35s;
    }
    .mask.show {
        opacity:1; visibility:visible;
        transition:opacity .35s ease, visibility 0s;
    }

    /* ============ 抽屉 ============ */
    .drawer {
        position:fixed; top:0; bottom:0;
        width:min(400px, 90vw);
        z-index:50;
        display:flex; flex-direction:column;
        background:rgba(4,7,16,0.88);
        backdrop-filter:blur(28px) saturate(150%);
        -webkit-backdrop-filter:blur(28px) saturate(150%);
        box-shadow:0 0 80px rgba(0,0,0,0.8);
        transition:transform .45s cubic-bezier(.2,.9,.4,1.1);
    }
    .drawer-toc { left:0; border-right:1px solid rgba(255,255,255,0.07); transform:translateX(-102%); }
    .drawer-toc.show { transform:translateX(0); }
    .drawer-settings { right:0; border-left:1px solid rgba(255,255,255,0.07); transform:translateX(102%); }
    .drawer-settings.show { transform:translateX(0); }

    .drawer-head {
        flex:none;
        display:flex; align-items:center; justify-content:space-between;
        padding:1.2rem 1.4rem 1rem;
        border-bottom:1px solid rgba(255,255,255,0.05);
    }
    .drawer-head h2 {
        font-size:.74rem;
        font-weight:500;
        letter-spacing:6px;
        color:var(--ui-text);
    }
    .drawer-close {
        width:30px; height:30px;
        display:flex; align-items:center; justify-content:center;
        font-size:.8rem;
        color:var(--ui-text);
        background:transparent;
        border:1px solid rgba(255,255,255,0.08);
        border-radius:50%;
        cursor:pointer;
        transition:color .2s ease, border-color .2s ease, transform .3s ease;
    }
    .drawer-close:hover { color:#fff; border-color:rgba(255,255,255,0.28); transform:rotate(90deg); }

    .toc-book {
        flex:none;
        padding:1.6rem 1.4rem 1.4rem;
        border-bottom:1px solid rgba(255,255,255,0.04);
        text-align:center;
    }
    .toc-book-title {
        font-size:1.05rem;
        font-weight:400;
        letter-spacing:8px;
        color:var(--text-title);
        margin-bottom:.7rem;
    }
    .toc-book-sub {
        font-size:.62rem;
        letter-spacing:5px;
        color:var(--text-dim);
        opacity:.6;
    }
    .toc-book-intro {
        margin-top:1.2rem;
        font-size:.7rem;
        line-height:2;
        letter-spacing:1px;
        color:var(--text-dim);
        opacity:.75;
        font-weight:300;
    }

    .toc-list {
        flex:1;
        overflow-y:auto;
        padding:.8rem .8rem 1.4rem;
    }
    .toc-list::-webkit-scrollbar { width:4px; }
    .toc-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.14); border-radius:10px; }

    .toc-item {
        display:block;
        width:100%;
        padding:.85rem 1rem;
        margin-bottom:2px;
        font-family:inherit;
        font-size:.82rem;
        font-weight:300;
        letter-spacing:1.5px;
        line-height:1.7;
        color:var(--text-dim);
        text-align:left;
        background:transparent;
        border:none;
        border-radius:2px;
        cursor:pointer;
        transition:color .2s ease, background-color .2s ease;
        position:relative;
    }
    .toc-item:hover { color:var(--text-main); background:rgba(255,255,255,0.025); }
    .toc-item.active {
        color:var(--text-title);
        background:rgba(255,255,255,0.04);
    }
    .toc-item.active::before {
        content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
        width:1px; height:60%;
        background:var(--accent);
        box-shadow:0 0 8px var(--accent);
    }
    .toc-num {
        display:inline-block;
        min-width:2.6em;
        font-family:ui-monospace,Menlo,Consolas,monospace;
        font-size:.62rem;
        color:var(--text-dim);
        opacity:.4;
        letter-spacing:0;
        vertical-align:1px;
    }
    .toc-item.active .toc-num { color:var(--accent); opacity:.85; }

    .drawer-foot {
        flex:none;
        padding:1rem 1.4rem;
        padding-bottom:calc(1rem + env(safe-area-inset-bottom));
        border-top:1px solid rgba(255,255,255,0.05);
    }
    .foot-link {
        display:inline-flex; align-items:center; gap:8px;
        font-size:.68rem; letter-spacing:3px;
        color:var(--text-dim);
        text-decoration:none;
        transition:color .2s ease;
    }
    .foot-link:hover { color:var(--accent); }

    /* ============ 设置面板 ============ */
    .settings-body {
        flex:1; overflow-y:auto;
        padding:1.5rem 1.4rem 3rem;
        padding-bottom:calc(3rem + env(safe-area-inset-bottom));
    }
    .settings-body::-webkit-scrollbar { width:4px; }
    .settings-body::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.14); border-radius:10px; }

    .set-group { margin-bottom:2.2rem; }
    .set-label {
        display:flex; align-items:baseline; justify-content:space-between;
        font-size:.6rem; letter-spacing:5px;
        color:var(--text-dim);
        margin-bottom:1rem;
        opacity:.75;
    }
    .set-value {
        font-family:ui-monospace,Menlo,Consolas,monospace;
        font-size:.66rem;
        color:var(--accent);
        letter-spacing:1px;
        opacity:.85;
    }

    .seg-row {
        display:flex;
        gap:0;
        border:1px solid rgba(255,255,255,0.07);
        border-radius:2px;
        overflow:hidden;
    }
    .seg-btn {
        flex:1;
        padding:.75rem .4rem;
        font-family:inherit;
        font-size:.7rem;
        font-weight:300;
        letter-spacing:2px;
        color:var(--text-dim);
        background:transparent;
        border:none;
        border-right:1px solid rgba(255,255,255,0.05);
        cursor:pointer;
        white-space:nowrap;
        transition:color .25s ease, background-color .25s ease;
    }
    .seg-btn:last-child { border-right:none; }
    .seg-btn:hover { color:var(--text-main); background:rgba(255,255,255,0.02); }
    .seg-btn.active {
        color:var(--text-title);
        background:rgba(255,255,255,0.05);
    }

    .step-row {
        display:flex; align-items:center; gap:14px;
        border:1px solid rgba(255,255,255,0.07);
        border-radius:2px;
        padding:.5rem .7rem;
    }
    .step-btn {
        width:30px; height:30px; flex:none;
        display:flex; align-items:center; justify-content:center;
        font-size:1.05rem; font-weight:300;
        color:var(--text-main);
        background:transparent;
        border:1px solid rgba(255,255,255,0.08);
        border-radius:2px;
        cursor:pointer;
        transition:color .2s ease, border-color .2s ease, background-color .2s ease;
    }
    .step-btn:hover:not(:disabled) {
        color:#fff;
        border-color:rgba(255,255,255,0.28);
        background:rgba(255,255,255,0.03);
    }
    .step-btn:disabled { opacity:.22; cursor:not-allowed; }
    .step-track {
        flex:1;
        height:1px;
        background:rgba(255,255,255,0.08);
        position:relative;
    }
    .step-fill {
        position:absolute; left:0; top:-1px;
        height:3px;
        background:var(--accent);
        box-shadow:0 0 10px var(--accent);
        opacity:.85;
        transition:width .25s cubic-bezier(.2,.9,.4,1.1);
    }

    .theme-grid {
        display:grid;
        grid-template-columns:repeat(3,1fr);
        gap:1px;
        background:rgba(255,255,255,0.05);
        border:1px solid rgba(255,255,255,0.05);
        border-radius:2px;
        overflow:hidden;
    }
    .theme-swatch {
        position:relative;
        height:64px;
        display:flex; align-items:center; justify-content:center;
        font-size:.6rem; letter-spacing:4px; font-weight:300;
        cursor:pointer;
        transition:transform .25s ease;
    }
    .theme-swatch:active { transform:scale(0.97); }
    .theme-swatch.active { box-shadow:inset 0 0 0 1px var(--accent); }
    .sw-void { background:linear-gradient(140deg, #0a1024, #02040a); color:#7a8aa8; }
    .sw-warm { background:linear-gradient(140deg, #2a2014, #0f0a06); color:#b89b6c; }
    .sw-green { background:linear-gradient(140deg, #102818, #06100a); color:#8fc9a0; }

    .switch-row {
        display:flex; align-items:center; justify-content:space-between;
        gap:12px;
        padding:.85rem .2rem;
        font-size:.75rem;
        letter-spacing:1.5px;
        color:var(--ui-text);
        font-weight:300;
    }
    .switch {
        position:relative;
        width:38px; height:22px; flex:none;
        border-radius:99px;
        background:rgba(255,255,255,0.06);
        border:1px solid rgba(255,255,255,0.1);
        cursor:pointer;
        transition:background-color .25s ease;
    }
    .switch::after {
        content:'';
        position:absolute; top:2px; left:2px;
        width:16px; height:16px;
        border-radius:50%;
        background:#6a7899;
        transition:transform .28s cubic-bezier(.2,.9,.4,1.1), background-color .25s ease;
    }
    .switch.on {
        background:var(--accent-soft);
        border-color:rgba(140,186,255,0.3);
    }
    .switch.on::after {
        transform:translateX(16px);
        background:var(--accent);
        box-shadow:0 0 10px var(--accent);
    }

    .set-tip {
        margin-top:2.5rem;
        padding-top:1.6rem;
        border-top:1px solid rgba(255,255,255,0.05);
        font-size:.64rem;
        line-height:2.1;
        letter-spacing:1px;
        color:var(--text-dim);
        opacity:.6;
        font-weight:300;
    }

    .reset-btn {
        width:100%;
        padding:.85rem;
        font-family:inherit;
        font-size:.66rem;
        font-weight:300;
        letter-spacing:4px;
        color:var(--text-dim);
        background:transparent;
        border:1px solid rgba(255,255,255,0.07);
        border-radius:2px;
        cursor:pointer;
        transition:color .2s ease, border-color .2s ease;
    }
    .reset-btn:hover { color:var(--text-main); border-color:rgba(255,255,255,0.2); }

    /* ============ 章节过渡 ============ */
    .fade-out { opacity:0; filter:blur(8px); transition:opacity .35s ease, filter .35s ease; }
    .fade-in  { animation:fadeInChapter .7s cubic-bezier(.2,.9,.4,1) forwards; }
    @keyframes fadeInChapter {
        0%   { opacity:0; filter:blur(14px); transform:translateY(10px); }
        100% { opacity:1; filter:blur(0);    transform:translateY(0); }
    }

    .chapter-head, .chapter-content p {
        animation:softIn .9s cubic-bezier(.2,.9,.4,1) backwards;
    }
    .chapter-head { animation-delay:0s; }
    .chapter-content p:nth-child(1)  { animation-delay:.08s; }
    .chapter-content p:nth-child(2)  { animation-delay:.16s; }
    .chapter-content p:nth-child(3)  { animation-delay:.24s; }
    .chapter-content p:nth-child(4)  { animation-delay:.32s; }
    .chapter-content p:nth-child(5)  { animation-delay:.40s; }
    .chapter-content p:nth-child(6)  { animation-delay:.48s; }
    .chapter-content p:nth-child(7)  { animation-delay:.56s; }
    .chapter-content p:nth-child(8)  { animation-delay:.64s; }
    .chapter-content p:nth-child(9)  { animation-delay:.72s; }
    .chapter-content p:nth-child(10) { animation-delay:.80s; }
    @keyframes softIn {
        0%   { opacity:0; filter:blur(6px); transform:translateY(8px); }
        100% { opacity:1; filter:blur(0);   transform:translateY(0); }
    }

    /* ============================================================
       ★ 手机端优化
       ============================================================ */
    @media (max-width: 680px) {
        :root {
            --paper-pad-x: 1.5rem;
            --paper-pad-y: 2.2rem;
            --content-width: 100%;
        }
