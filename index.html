<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>星星的网页 | 星际导航</title>
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', sans-serif;
            background: #03050b;
            color: #fff;
        }

        #starCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .title-section {
            text-align: center;
            margin-bottom: 3rem;
            animation: floatUp 1s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }
        .main-title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 700;
            background: linear-gradient(135deg, #FFFFFF, #C0E0FF, #AAD0FF);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(170, 208, 255, 0.5);
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            opacity: 0.8;
            margin-top: 0.6rem;
            letter-spacing: 1px;
            font-weight: 300;
            display: inline-block;
            padding: 0 1rem;
        }

        .buttons-grid {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .liquid-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 1rem 2.4rem;
            min-width: 180px;
            font-family: inherit;
            font-size: 1.35rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
            background: rgba(255, 255, 255, 0.055);
            border: none;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            box-shadow:
                inset  0.5px  0    0 0 rgba(255, 255, 255, 0.35),
                inset -0.5px  0    0 0 rgba(255, 255, 255, 0.18),
                inset  0      0.5px 0 0 rgba(255, 255, 255, 0.50),
                inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.22),
                0 10px 26px rgba(0, 0, 0, 0.38);
            transition:
                transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1),
                box-shadow 0.25s ease,
                background-color 0.25s ease,
                text-shadow 0.25s ease;
        }

        .liquid-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.11);
            box-shadow:
                inset  0.5px  0    0 0 rgba(255, 255, 255, 0.55),
                inset -0.5px  0    0 0 rgba(255, 255, 255, 0.3),
                inset  0      0.5px 0 0 rgba(255, 255, 255, 0.75),
                inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.35),
                0 18px 34px rgba(0, 0, 0, 0.45),
                0 0 24px rgba(140, 190, 255, 0.35);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
        }

        .liquid-btn:active {
            transform: translateY(1px);
            transition-duration: 0.05s;
            box-shadow:
                inset  0.5px  0    0 0 rgba(255, 255, 255, 0.4),
                inset -0.5px  0    0 0 rgba(255, 255, 255, 0.2),
                inset  0      0.5px 0 0 rgba(255, 255, 255, 0.6),
                inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.25),
                0 6px 14px rgba(0, 0, 0, 0.5);
        }

        .liquid-btn.active {
            background: rgba(140, 180, 255, 0.18);
            box-shadow:
                inset  0.5px  0    0 0 rgba(255, 255, 255, 0.55),
                inset -0.5px  0    0 0 rgba(255, 255, 255, 0.3),
                inset  0      0.5px 0 0 rgba(255, 255, 255, 0.75),
                inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.35),
                0 14px 30px rgba(0, 0, 0, 0.42),
                0 0 28px rgba(140, 190, 255, 0.5);
            text-shadow: 0 0 12px rgba(200, 225, 255, 0.9);
        }

        .no-glass .liquid-btn {
            background: rgba(40, 60, 100, 0.42);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.35),
                0 10px 26px rgba(0, 0, 0, 0.4);
        }

        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 75%);
            transform: scale(0);
            opacity: 1;
            z-index: 2;
        }

        .footer-note {
            margin-top: 3rem;
            font-size: 0.8rem;
            text-align: center;
            opacity: 0.6;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            pointer-events: none;
        }

        .ball {
            position: fixed;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            z-index: 4;
            cursor: grab;
            user-select: none;
            will-change: left, top;
            transition: box-shadow 0.15s ease;
            touch-action: none;
        }
        .ball:active {
            cursor: grabbing;
        }

        .ball-liquid {
            background: rgba(255, 255, 255, 0.05);
            box-shadow:
                inset  0.5px  0    0 0 rgba(255, 255, 255, 0.35),
                inset -0.5px  0    0 0 rgba(255, 255, 255, 0.18),
                inset  0      0.5px 0 0 rgba(255, 255, 255, 0.50),
                inset  0     -0.5px 0 0 rgba(255, 255, 255, 0.22),
                0 10px 26px rgba(0, 0, 0, 0.38);
        }

        .ball-frosted {
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.42);
            box-shadow:
                0 0 30px rgba(255, 255, 255, 0.18),
                inset 0 0 22px rgba(255, 255, 255, 0.5);
        }

        body.delete-mode {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><path fill="white" stroke="black" stroke-width="2" d="M8 4 L24 4 L28 12 L24 20 L8 20 L4 12 L8 4 Z M10 8 L14 8 L14 16 L10 16 L10 8 Z M18 8 L22 8 L22 16 L18 16 L18 8 Z M12 22 L20 22 L18 28 L14 28 L12 22 Z"/></svg>') 16 16, auto;
        }
        body.delete-mode .ball {
            filter: drop-shadow(0 0 9px rgba(255, 60, 60, 0.95));
            transition: filter 0.1s;
        }

        .manage-panel {
            position: fixed;
            z-index: 20;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 22px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5), 0 0 22px rgba(120, 170, 255, 0.15);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.92);
            transform-origin: center center;
            transition:
                opacity 0.22s ease,
                transform 0.28s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }
        .manage-panel.show {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .manage-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 15px;
            font-family: inherit;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.18);
        }
        .manage-btn:hover {
            background: rgba(255, 255, 255, 0.28);
            transform: scale(1.05);
        }
        .manage-btn.active {
            background: rgba(255, 100, 100, 0.5);
            border-color: rgba(255, 200, 200, 0.85);
            box-shadow: 0 0 16px rgba(255, 0, 0, 0.55);
        }

        .ball-context-menu {
            position: fixed;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 220px;
            padding: 8px;
            background: rgba(18, 26, 44, 0.86);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 16px;
            box-shadow:
                0 18px 44px rgba(0, 0, 0, 0.6),
                0 0 24px rgba(120, 170, 255, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
            opacity: 0;
            visibility: hidden;
            transform: scale(0.94);
            transform-origin: top left;
            pointer-events: none;
            transition:
                opacity 0.18s ease,
                transform 0.22s cubic-bezier(0.2, 0.9, 0.4, 1.1),
                visibility 0s linear 0.22s;
        }
        .ball-context-menu.show {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            pointer-events: auto;
            transition:
                opacity 0.18s ease,
                transform 0.22s cubic-bezier(0.2, 0.9, 0.4, 1.1),
                visibility 0s;
        }
        .ctx-title {
            padding: 6px 12px 8px;
            font-size: 12px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.55);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 3px;
        }
        .ctx-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 9px 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.92);
            letter-spacing: 1px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.15s ease;
            white-space: nowrap;
        }
        .ctx-item:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .ctx-item .ctx-check {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.05);
            font-size: 11px;
            line-height: 1;
            color: transparent;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }
        .ctx-item.active {
            background: rgba(120, 180, 255, 0.14);
            color: #fff;
        }
        .ctx-item.active .ctx-check {
            background: rgba(120, 200, 255, 0.95);
            border-color: rgba(180, 225, 255, 1);
            color: #0a1a2c;
            box-shadow: 0 0 8px rgba(120, 200, 255, 0.75);
        }

        .visit-counter {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 15px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            pointer-events: none;
            letter-spacing: 1px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        @media (max-width: 680px) {
            .buttons-grid {
                gap: 1.2rem;
                width: 100%;
            }
            .liquid-btn {
                padding: 0.75rem 1.6rem;
                min-width: 150px;
                font-size: 1rem;
            }
            .main-container {
                justify-content: flex-start;
                padding-top: 2rem;
            }
            .title-section { margin-bottom: 2rem; }
            .footer-note { margin-top: 1.6rem; }
            .ball { width: 60px; height: 60px; }
            .manage-panel {
                padding: 9px 14px;
                gap: 8px;
                border-radius: 28px;
            }
            .manage-btn { font-size: 13px; padding: 8px 13px; }
            .visit-counter { bottom: 10px; right: 10px; font-size: 13px; padding: 6px 12px; }
            .ball-context-menu { min-width: 190px; font-size: 13px; }
            .ctx-item { padding: 8px 10px; font-size: 13px; }
        }

        .main-container::-webkit-scrollbar { width: 5px; }
        .main-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .main-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 10px;
        }

        @keyframes floatUp {
            0%   { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .liquid-btn {
            animation: fadeIn 0.5s ease backwards;
            animation-delay: calc(var(--order, 0) * 0.08s);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <canvas id="starCanvas"></canvas>

    <div class="ball ball-liquid" id="ballLiquid"></div>
    <div class="ball ball-frosted" id="ballFrosted"></div>

    <div class="main-container">
        <div class="title-section">
            <div class="main-title">✨ 星星的网页 ✨</div>
            <div class="subtitle">星海浩瀚 · 一键启程</div>
        </div>

        <div class="buttons-grid" id="buttonGrid"></div>

        <div class="footer-note">
            🌟 拖动小球 · 右键设置属性 · 点击按钮开启旅程
        </div>
    </div>

    <div class="manage-panel" id="managePanel">
        <button class="manage-btn" id="deleteModeBtn">🔨 删除模式</button>
        <button class="manage-btn" id="addLiquidBtn">➕ 液态球</button>
        <button class="manage-btn" id="addFrostedBtn">➕ 磨砂球</button>
    </div>

    <div class="ball-context-menu" id="ballContextMenu">
        <div class="ctx-title">小球属性</div>
        <div class="ctx-item" data-prop="noGravity">
            <span>不受重力影响</span>
            <span class="ctx-check">✓</span>
        </div>
        <div class="ctx-item" data-prop="noFriction">
            <span>不受空气阻力</span>
            <span class="ctx-check">✓</span>
        </div>
        <div class="ctx-item" data-prop="fixed">
            <span>固定位置</span>
            <span class="ctx-check">✓</span>
        </div>
        <div class="ctx-item" data-prop="noCollision">
            <span>不受碰撞</span>
            <span class="ctx-check">✓</span>
        </div>
        <div class="ctx-item" data-prop="noDamping">
            <span>去掉碰撞衰减</span>
            <span class="ctx-check">✓</span>
        </div>
    </div>

    <div class="visit-counter">
        👁️ 总访问人次：<span id="busuanzi_value_site_pv"></span>
    </div>

    <script>
    (function () {
        "use strict";

        /* ============================================================
           第一部分：Snell 折射算法
           ============================================================ */

        function calculateRefractionProfile(glassThickness, bezelWidth, heightFn, ior, samples) {
            samples = samples || 128;
            var eta = 1 / ior;
            function refract(nx, ny) {
                var dot = ny;
                var k = 1 - eta * eta * (1 - dot * dot);
                if (k < 0) return null;
                var sq = Math.sqrt(k);
                return [-(eta * dot + sq) * nx, eta - (eta * dot + sq) * ny];
            }
            var profile = new Float64Array(samples);
            for (var i = 0; i < samples; i++) {
                var x = i / samples;
                var y = heightFn(x);
                var dx = x < 1 ? 0.0001 : -0.0001;
                var y2 = heightFn(x + dx);
                var deriv = (y2 - y) / dx;
                var mag = Math.sqrt(deriv * deriv + 1);
                var ref = refract(-deriv / mag, -1 / mag);
                if (!ref) { profile[i] = 0; continue; }
                profile[i] = ref[0] * ((y * bezelWidth + glassThickness) / ref[1]);
            }
            return profile;
        }

        function squircleSurface(t) {
            return Math.pow(1 - Math.pow(1 - t, 4), 0.25);
        }

        function generateDisplacementMap(w, h, radius, bezelWidth, profile, maxDisp) {
            var c = document.createElement('canvas');
            c.width = w; c.height = h;
            var ctx = c.getContext('2d');
            var img = ctx.createImageData(w, h);
            var d = img.data;
            for (var i = 0; i < d.length; i += 4) {
                d[i] = 128; d[i + 1] = 128; d[i + 2] = 0; d[i + 3] = 255;
            }
            var r = Math.min(radius, Math.min(w, h) / 2 - 1);
            if (r <= 0) return c.toDataURL();
            var clampedBezel = Math.min(bezelWidth, r - 1);
            if (clampedBezel <= 1) return c.toDataURL();
            var rSq = r * r;
            var r1Sq = (r + 1) * (r + 1);
            var rBSq = Math.max(r - clampedBezel, 0) * Math.max(r - clampedBezel, 0);
            var wB = w - r * 2;
            var hB = h - r * 2;
            var S = profile.length;
            if (wB < 0 || hB < 0) return c.toDataURL();

            for (var y1 = 0; y1 < h; y1++) {
                for (var x1 = 0; x1 < w; x1++) {
                    var dx, dy;
                    if (x1 < r) { dx = x1 - r; }
                    else if (x1 >= w - r) { dx = x1 - r - wB; }
                    else { dx = 0; }
                    if (y1 < r) { dy = y1 - r; }
                    else if (y1 >= h - r) { dy = y1 - r - hB; }
                    else { dy = 0; }
                    var dSq = dx * dx + dy * dy;
                    if (dSq > r1Sq || dSq < rBSq) continue;
                    var dist = Math.sqrt(dSq);
                    var fromSide = r - dist;
                    var op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
                    if (op <= 0 || dist === 0) continue;
                    var cos = dx / dist;
                    var sin = dy / dist;
                    var bi = Math.min(Math.floor((fromSide / clampedBezel) * S), S - 1);
                    var disp = profile[bi] || 0;
                    var dX = (-cos * disp) / maxDisp;
                    var dY = (-sin * disp) / maxDisp;
                    var idx = (y1 * w + x1) * 4;
                    d[idx]     = Math.min(255, Math.max(0, (128 + dX * 127 * op + 0.5) | 0));
                    d[idx + 1] = Math.min(255, Math.max(0, (128 + dY * 127 * op + 0.5) | 0));
                }
            }
            ctx.putImageData(img, 0, 0);
            return c.toDataURL();
        }

        function generateSpecularMap(w, h, radius, bezelWidth, angle) {
            angle = angle != null ? angle : Math.PI / 3;
            var c = document.createElement('canvas');
            c.width = w; c.height = h;
            var ctx = c.getContext('2d');
            var img = ctx.createImageData(w, h);
            var d = img.data;
            for (var i = 0; i < d.length; i += 4) {
                d[i] = 0; d[i + 1] = 0; d[i + 2] = 0; d[i + 3] = 0;
            }
            var r = Math.min(radius, Math.min(w, h) / 2 - 1);
            if (r <= 0) return c.toDataURL();
            var clampedBezel = Math.min(bezelWidth, r - 1);
            if (clampedBezel <= 1) return c.toDataURL();
            var rSq = r * r;
            var r1Sq = (r + 1) * (r + 1);
            var rBSq = Math.max(r - clampedBezel, 0) * Math.max(r - clampedBezel, 0);
            var wB = w - r * 2;
            var hB = h - r * 2;
            var lightVec = [Math.cos(angle), Math.sin(angle)];

            for (var y1 = 0; y1 < h; y1++) {
                for (var x1 = 0; x1 < w; x1++) {
                    var dx, dy;
                    if (x1 < r) { dx = x1 - r; }
                    else if (x1 >= w - r) { dx = x1 - r - wB; }
                    else { dx = 0; }
                    if (y1 < r) { dy = y1 - r; }
                    else if (y1 >= h - r) { dy = y1 - r - hB; }
                    else { dy = 0; }
                    var dSq = dx * dx + dy * dy;
                    if (dSq > r1Sq || dSq < rBSq) continue;
                    var dist = Math.sqrt(dSq);
                    var fromSide = r - dist;
                    var op = dSq < rSq ? 1 : 1 - (dist - Math.sqrt(rSq)) / (Math.sqrt(r1Sq) - Math.sqrt(rSq));
                    if (op <= 0 || dist === 0) continue;
                    var cos = dx / dist;
                    var sin = -dy / dist;
                    var dot = Math.abs(cos * lightVec[0] + sin * lightVec[1]);
                    var edge = Math.sqrt(Math.max(0, 1 - Math.pow(1 - fromSide, 2)));
                    var coeff = dot * edge;
                    var col = (255 * coeff) | 0;
                    var alpha = Math.min(255, Math.max(0, (col * coeff * op * 0.85) | 0));
                    var idx = (y1 * w + x1) * 4;
                    d[idx] = col; d[idx + 1] = col; d[idx + 2] = col; d[idx + 3] = alpha;
                }
            }
            ctx.putImageData(img, 0, 0);
            return c.toDataURL();
        }

        function buildDisplacementOnlyFilter(dispUrl, scale, w, h) {
            return '<feImage href="' + dispUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="disp_map" />' +
                   '<feDisplacementMap in="SourceGraphic" in2="disp_map" scale="' + scale +
                   '" xChannelSelector="R" yChannelSelector="G" />';
        }

        function buildSVGFilter(dispUrl, specUrl, scale, w, h, specOpacity) {
            specOpacity = specOpacity != null ? specOpacity : 0.3;
            var fc = '';
            fc += '<feImage href="' + dispUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="disp_map" />';
            fc += '<feDisplacementMap in="SourceGraphic" in2="disp_map" scale="' + scale +
                  '" xChannelSelector="R" yChannelSelector="G" result="displaced" />';
            if (specUrl) {
                fc += '<feImage href="' + specUrl + '" x="0" y="0" width="' + w + '" height="' + h + '" result="spec_layer" />';
                fc += '<feComposite in="displaced" in2="spec_layer" operator="in" result="spec_masked" />';
                fc += '<feComponentTransfer in="spec_layer" result="spec_faded">' +
                      '<feFuncA type="linear" slope="' + specOpacity + '" /></feComponentTransfer>';
                fc += '<feBlend in="spec_masked" in2="displaced" mode="screen" result="with_spec" />';
                fc += '<feBlend in="spec_faded" in2="with_spec" mode="screen" />';
            }
            return fc;
        }

        /* ============================================================
           第二部分：SVG 容器
           ============================================================ */
        let defsEl = null;

        function ensureSVG() {
            let svg = document.getElementById('lg-svg');
            if (!svg) {
                svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('id', 'lg-svg');
                svg.setAttribute('width', '0');
                svg.setAttribute('height', '0');
                svg.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;');
                svg.setAttribute('color-interpolation-filters', 'sRGB');
                svg.setAttribute('aria-hidden', 'true');
                document.body.appendChild(svg);
            }
            defsEl = svg.querySelector('defs');
            if (!defsEl) {
                defsEl = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
                svg.appendChild(defsEl);
            }
        }

        function writeFilter(id, filterHTML) {
            if (!defsEl) return;
            let filter = defsEl.querySelector('#' + id);
            if (!filter) {
                filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
                filter.setAttribute('id', id);
                filter.setAttribute('x', '0%');
                filter.setAttribute('y', '0%');
                filter.setAttribute('width', '100%');
                filter.setAttribute('height', '100%');
                defsEl.appendChild(filter);
            }
            filter.innerHTML = filterHTML;
        }

        /* ============================================================
           第三部分：按钮配置与构建
           ============================================================ */
        const buttonsConfig = [
            { text: "公　告", url: "gg.html" },
            { text: "更　多", url: "fz.html" },
            { text: "诊　断", url: "help.html" },
            { text: "管理小球", action: "manage" }
        ];

        const gridContainer = document.getElementById('buttonGrid');
        const managePanel = document.getElementById('managePanel');
        const ballContextMenu = document.getElementById('ballContextMenu');

        const GLASS = {
            THICKNESS: 70,
            IOR: 2.4,
            BEZEL_RATIO: 0.55,
            BEZEL_MAX: 16,
            SPECULAR_OPACITY: 0.26,
            SPECULAR_ANGLE: Math.PI * 0.75,
            BLUR: 0.4,
            SCALE_RATIO: 0.55
        };

        const dispCache = new Map();

        function getCachedDisplacement(w, h, radius, bezel) {
            const key = w + '|' + h + '|' + bezel.toFixed(2);
            if (dispCache.has(key)) return dispCache.get(key);
            const profile = calculateRefractionProfile(
                GLASS.THICKNESS, bezel, squircleSurface, GLASS.IOR, 128
            );
            let maxDisp = 0;
            for (let k = 0; k < profile.length; k++) {
                const a = Math.abs(profile[k]);
                if (a > maxDisp) maxDisp = a;
            }
            if (maxDisp < 0.001) maxDisp = 1;
            const scale = maxDisp * GLASS.SCALE_RATIO;
            const url = generateDisplacementMap(w, h, radius, bezel, profile, maxDisp);
            const result = { url: url, scale: scale };
            dispCache.set(key, result);
            return result;
        }

        function buildLiquidGlass() {
            const btns = gridContainer.querySelectorAll('.liquid-btn');
            if (!btns.length) return;

            btns.forEach(function (btn, i) {
                const w = Math.round(btn.offsetWidth);
                const h = Math.round(btn.offsetHeight);
                if (w < 8 || h < 8) return;

                const radius = Math.min(w, h) / 2;
                const bezel = Math.min(radius * GLASS.BEZEL_RATIO, GLASS.BEZEL_MAX, radius - 1);
                if (bezel <= 1) return;

                const disp = getCachedDisplacement(w, h, radius, bezel);
                const specUrl = generateSpecularMap(w, h, radius, bezel * 2.2, GLASS.SPECULAR_ANGLE);

                const id = 'lg-btn-filter-' + i;
                writeFilter(id, buildSVGFilter(disp.url, specUrl, disp.scale, w, h, GLASS.SPECULAR_OPACITY));

                let bf = 'url(#' + id + ')';
                if (GLASS.BLUR > 0) bf += ' blur(' + GLASS.BLUR.toFixed(1) + 'px)';

                btn.style.setProperty('backdrop-filter', bf, 'important');
                btn.style.setProperty('-webkit-backdrop-filter', bf, 'important');
            });
        }

        function buildButtons() {
            if (!gridContainer) return;
            gridContainer.innerHTML = '';

            buttonsConfig.forEach(function (btnCfg, idx) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'liquid-btn collidable-btn';
                button.setAttribute('data-index', idx);
                button.textContent = btnCfg.text;
                button.style.setProperty('--order', idx);

                if (btnCfg.action === 'manage') {
                    button.id = 'manageBallBtn';
                    button.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        toggleManagePanel();
                    });
                } else {
                    button.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        if (btnCfg.url && btnCfg.url.trim() !== '') {
                            window.location.href = btnCfg.url;
                        }
                    });
                }

                button.addEventListener('mousedown', createRipple);
                button.addEventListener('touchstart', createRipple, { passive: true });

                gridContainer.appendChild(button);
            });
        }

        function createRipple(e) {
            const btn = e.currentTarget;
            if (btn.querySelector('.ripple-effect')) return;

            let clientX, clientY;
            if (e.touches && e.touches.length) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const rect = btn.getBoundingClientRect();
            const diameter = Math.max(rect.width, rect.height) * 1.6;
            const radius = diameter / 2;
            const x = clientX - rect.left - radius;
            const y = clientY - rect.top - radius;

            const ripple = document.createElement('span');
            ripple.className = 'ripple-effect';
            Object.assign(ripple.style, {
                width: diameter + 'px',
                height: diameter + 'px',
                left: x + 'px',
                top: y + 'px',
                transition: 'transform 0.5s ease-out, opacity 0.6s ease'
            });
            btn.appendChild(ripple);

            requestAnimationFrame(function () {
                ripple.style.transform = 'scale(2.2)';
                ripple.style.opacity = '0';
            });
            setTimeout(function () {
                if (ripple.parentNode) ripple.remove();
            }, 620);
        }

        /* ============================================================
           第四部分：管理面板定位与开关
           ============================================================ */
        function positionManagePanel() {
            const manageBtn = document.getElementById('manageBallBtn');
            if (!manageBtn || !managePanel) return;

            const btnRect = manageBtn.getBoundingClientRect();
            const panelRect = managePanel.getBoundingClientRect();

            const margin = 12;
            const panelW = panelRect.width || 320;
            const panelH = panelRect.height || 60;

            let left = btnRect.left + btnRect.width / 2 - panelW / 2;
            let top  = btnRect.top  + btnRect.height / 2 - panelH / 2;

            left = Math.max(margin, Math.min(left, window.innerWidth  - panelW - margin));
            top  = Math.max(margin, Math.min(top,  window.innerHeight - panelH - margin));

            managePanel.style.left = left + 'px';
            managePanel.style.top  = top  + 'px';
        }

        function toggleManagePanel() {
            const manageBtn = document.getElementById('manageBallBtn');
            const willShow = !managePanel.classList.contains('show');

            if (willShow) {
                positionManagePanel();
                void managePanel.offsetWidth;
                managePanel.classList.add('show');
                if (manageBtn) manageBtn.classList.add('active');
            } else {
                managePanel.classList.remove('show');
                if (manageBtn) manageBtn.classList.remove('active');
            }
        }

        function closeManagePanel() {
            const manageBtn = document.getElementById('manageBallBtn');
            managePanel.classList.remove('show');
            if (manageBtn) manageBtn.classList.remove('active');
        }

        document.addEventListener('click', (e) => {
            const manageBtn = document.getElementById('manageBallBtn');
            if (!managePanel.classList.contains('show')) return;
            if (managePanel.contains(e.target)) return;
            if (manageBtn && (e.target === manageBtn || manageBtn.contains(e.target))) return;
            closeManagePanel();
        });

        window.addEventListener('resize', () => {
            if (managePanel.classList.contains('show')) {
                positionManagePanel();

        });

        document.querySelector('.main-container').addEventListener('scroll', () => {
            updateButtonRects();
            if (managePanel.classList.contains('show')) {
                positionManagePanel();
            }
        }, { passive: true });

        /* ============================================================
           第五部分：小球液态玻璃（只有折射，无高光）
           ============================================================ */
        function buildBallRefraction() {
            const sample = document.querySelector('.ball-liquid');
            if (!sample) return;
            const w = Math.round(sample.offsetWidth);
            const h = Math.round(sample.offsetHeight);
            if (w < 8 || h < 8) return;

            const radius = Math.min(w, h) / 2;
            const bezel = Math.min(radius * GLASS.BEZEL_RATIO, GLASS.BEZEL_MAX, radius - 1);
            if (bezel <= 1) return;

            const disp = getCachedDisplacement(w, h, radius, bezel);
            const filterId = 'ball-refraction-' + w + '_' + h;
            writeFilter(filterId, buildDisplacementOnlyFilter(disp.url, disp.scale, w, h));

            let bf = 'url(#' + filterId + ')';
            if (GLASS.BLUR > 0) bf += ' blur(' + GLASS.BLUR.toFixed(1) + 'px)';

            document.querySelectorAll('.ball-liquid:not([data-frag])').forEach(function (el) {
                el.style.setProperty('backdrop-filter', bf, 'important');
                el.style.setProperty('-webkit-backdrop-filter', bf, 'important');
            });
        }

        /* ============================================================
           第六部分：小球物理引擎（dt 驱动）
           p.x / p.y 统一为「球心」坐标（视口坐标系）
           ============================================================ */
        const BASE_GRAVITY = 1080;
        const GRAVITY_SENSITIVITY = 0.2;
        let gravityX = 0;
        let gravityY = BASE_GRAVITY;

        const FRICTION_BASE = 0.99;
        const FRICTION_FPS = 60;

        const BOUNCE = 0.7;
        const BUTTON_BOUNCE = 0.6;
        const BALL_RESTITUTION = 0.7;
        const DRAG_VELOCITY_SCALE = 900;
        const DRAG_MAX_SPEED = 600;

        const physics = [];
        let deleteMode = false;

        /* 把 p.x / p.y（球心）写回 DOM（left/top 是左上角） */
        function syncBallDom(ballEl, p) {
            ballEl.style.left = (p.x - p.radius) + 'px';
            ballEl.style.top  = (p.y - p.radius) + 'px';
        }

        function initBallPositions() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const isMobile = vw < 680;
            const size = isMobile ? 60 : 80;
            const liquid = document.getElementById('ballLiquid');
            const frosted = document.getElementById('ballFrosted');

            if (liquid) {
                liquid.style.left = (vw / 2 - size - 14) + 'px';
                liquid.style.top = Math.min(vh * 0.82, vh - size - 20) + 'px';
            }
            if (frosted) {
                frosted.style.left = (vw / 2 + 14) + 'px';
                frosted.style.top = Math.min(vh * 0.82, vh - size - 20) + 'px';
            }
        }

        function createDefaultProps() {
            return {
                noGravity: false,
                noFriction: false,
                fixed: false,
                noCollision: false,
                noDamping: false
            };
        }

        function initPhysics() {
            const currentBalls = document.querySelectorAll('.ball');
            const existingIds = new Set(physics.map(p => p.id));

            currentBalls.forEach(ball => {
                if (existingIds.has(ball.id)) return;
                const rect = ball.getBoundingClientRect();
                const radius = rect.width / 2;
                // rect.left/top 是视口坐标下的左上角，加 radius 得到球心视口坐标
                physics.push(Object.assign({
                    x: rect.left + radius,
                    y: rect.top + radius,
                    vx: (Math.random() - 0.5) * 120,
                    vy: Math.random() * 120,
                    radius: radius,
                    dragging: false,
                    mass: ball.hasAttribute('data-frag') ? 0.3 : 1,
                    id: ball.id,
                    lastMouseX: 0, lastMouseY: 0, lastMouseTime: 0,
                    dragOffsetX: 0, dragOffsetY: 0,
                    touchId: null
                }, createDefaultProps()));
            });
        }

        const collidableBtns = () => document.querySelectorAll('.collidable-btn');
        let buttonRects = [];

        function updateButtonRects() {
            buttonRects = Array.from(collidableBtns()).map(btn => {
                const rect = btn.getBoundingClientRect();
                const capRadius = rect.height / 2;
                return {
                    left: rect.left,
                    top: rect.top,
                    right: rect.right,
                    bottom: rect.bottom,
                    width: rect.width,
                    height: rect.height,
                    capRadius: capRadius,
                    leftCenterX: rect.left + capRadius,
                    rightCenterX: rect.right - capRadius,
                    centerY: rect.top + capRadius
                };
            });
        }

        /* p.x / p.y 是球心，直接用 */
        function handleCollisionWithButton(p, cap) {
            if (p.fixed) return false;

            let closestX = p.x;
            if (closestX < cap.leftCenterX) closestX = cap.leftCenterX;
            else if (closestX > cap.rightCenterX) closestX = cap.rightCenterX;
            const closestY = cap.centerY;

            const dx = p.x - closestX;
            const dy = p.y - closestY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = p.radius + cap.capRadius;

            if (dist < minDist && dist > 0.001) {
                const nx = dx / dist;
                const ny = dy / dist;

                const overlap = minDist - dist;
                p.x += nx * overlap;
                p.y += ny * overlap;

                const vn = p.vx * nx + p.vy * ny;
                if (vn < 0) {
                    const vt_x = p.vx - vn * nx;
                    const vt_y = p.vy - vn * ny;
                    const bounceFactor = p.noDamping ? 1.0 : BUTTON_BOUNCE;
                    p.vx = vt_x - vn * bounceFactor * nx;
                    p.vy = vt_y - vn * bounceFactor * ny;
                }
                return true;
            }
            return false;
        }

        function stepPhysics(dt) {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const friction = Math.pow(FRICTION_BASE, dt * FRICTION_FPS);

            // 1) 积分 + 边界（p.x/p.y 是球心）
            physics.forEach((p) => {
                if (p.dragging) return;
                if (p.fixed) {
                    p.vx = 0;
                    p.vy = 0;
                    return;
                }

                if (!p.noFriction) {
                    p.vx *= friction;
                    p.vy *= friction;
                }
                if (!p.noGravity) {
                    p.vx += gravityX * dt;
                    p.vy += gravityY * dt;
                }

                let newX = p.x + p.vx * dt;
                let newY = p.y + p.vy * dt;

                const r = p.radius;
                const bounceFactor = p.noDamping ? 1.0 : BOUNCE;
                // 圆心 < r 即左边缘越界；圆心 > width-r 即右边缘越界
                if (newX < r) { newX = r; p.vx = -p.vx * bounceFactor; }
                if (newX > width - r) { newX = width - r; p.vx = -p.vx * bounceFactor; }
                if (newY < r) { newY = r; p.vy = -p.vy * bounceFactor; }
                if (newY > height - r) { newY = height - r; p.vy = -p.vy * bounceFactor; }

                p.x = newX;
                p.y = newY;
            });

            // 2) 球-球碰撞（p.x/p.y 是球心）
            for (let i = 0; i < physics.length; i++) {
                for (let j = i + 1; j < physics.length; j++) {
                    const p1 = physics[i];
                    const p2 = physics[j];
                    if (p1.dragging && p2.dragging) continue;
                    if (p1.noCollision || p2.noCollision) continue;

                    const dx = p2.x - p1.x;
                    const dy = p2.y - p1.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = p1.radius + p2.radius;

                    if (dist < minDist && dist > 0.001) {
                        const nx = dx / dist;
                        const ny = dy / dist;

                        const p1Static = p1.fixed || p1.dragging;
                        const p2Static = p2.fixed || p2.dragging;
                        const invMass1 = p1Static ? 0 : 1 / p1.mass;
                        const invMass2 = p2Static ? 0 : 1 / p2.mass;
                        const invMassSum = invMass1 + invMass2;

                        const e = (p1.noDamping || p2.noDamping) ? 1.0 : BALL_RESTITUTION;

                        const vRelX = p2.vx - p1.vx;
                        const vRelY = p2.vy - p1.vy;
                        const vRelN = vRelX * nx + vRelY * ny;

                        if (invMassSum > 0 && vRelN < 0) {
                            const impulse = -(1 + e) * vRelN / invMassSum;
                            if (!p1Static) {
                                p1.vx -= impulse * invMass1 * nx;
                                p1.vy -= impulse * invMass1 * ny;
                            }
                            if (!p2Static) {
                                p2.vx += impulse * invMass2 * nx;
                                p2.vy += impulse * invMass2 * ny;
                            }
                        }

                        const overlap = minDist - dist;
                        if (!p1Static && !p2Static) {
                            p1.x -= overlap * nx * 0.5;
                            p1.y -= overlap * ny * 0.5;
                            p2.x += overlap * nx * 0.5;
                            p2.y += overlap * ny * 0.5;
                        } else if (p1Static && !p2Static) {
                            p2.x += overlap * nx;
                            p2.y += overlap * ny;
                        } else if (!p1Static && p2Static) {
                            p1.x -= overlap * nx;
                            p1.y -= overlap * ny;
                        }
                    }
                }
            }

            // 3) 球-按钮碰撞（胶囊形） + 写回 DOM
            physics.forEach(p => {
                if (!p.dragging && !p.noCollision && !p.fixed) {
                    buttonRects.forEach(cap => {
                        handleCollisionWithButton(p, cap);
                    });
                }
                const ball = document.getElementById(p.id);
                if (ball && !p.dragging) {
                    syncBallDom(ball, p);
                }
            });
        }

        let lastPhysicsTime = 0;

        function animatePhysics(now) {
            if (lastPhysicsTime === 0) lastPhysicsTime = now;
            let dt = (now - lastPhysicsTime) / 1000;
            lastPhysicsTime = now;
            if (dt > 0.1) dt = 0.1;
            if (dt > 0) stepPhysics(dt);

            requestAnimationFrame(animatePhysics);
        }

        /* ============================================================
           第七部分：小球右键属性菜单
           ============================================================ */
        let contextMenuTarget = null;

        function showBallContextMenu(ballEl, clientX, clientY) {
            const p = physics.find(pp => pp.id === ballEl.id);
            if (!p) return;

            contextMenuTarget = ballEl;

            ballContextMenu.querySelectorAll('.ctx-item').forEach(item => {
                const prop = item.getAttribute('data-prop');
                item.classList.toggle('active', !!p[prop]);
            });

            ballContextMenu.style.left = '0px';
            ballContextMenu.style.top = '0px';
            ballContextMenu.classList.add('show');
            void ballContextMenu.offsetWidth;

            const menuRect = ballContextMenu.getBoundingClientRect();
            const margin = 8;

            let left = clientX;
            let top = clientY;
            if (left + menuRect.width > window.innerWidth - margin) {
                left = window.innerWidth - menuRect.width - margin;
            }
            if (top + menuRect.height > window.innerHeight - margin) {
                top = window.innerHeight - menuRect.height - margin;
            }
            left = Math.max(margin, left);
            top = Math.max(margin, top);

            ballContextMenu.style.left = left + 'px';
            ballContextMenu.style.top = top + 'px';
        }

        function hideBallContextMenu() {
            ballContextMenu.classList.remove('show');
            contextMenuTarget = null;
        }

        function toggleBallProp(prop) {
            if (!contextMenuTarget) return;
            const p = physics.find(pp => pp.id === contextMenuTarget.id);
            if (!p) return;

            p[prop] = !p[prop];

            if (prop === 'fixed' && p.fixed) {
                p.vx = 0;
                p.vy = 0;
            }

            ballContextMenu.querySelectorAll('.ctx-item').forEach(item => {
                const itemProp = item.getAttribute('data-prop');
                item.classList.toggle('active', !!p[itemProp]);
            });
        }

        ballContextMenu.querySelectorAll('.ctx-item').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                e.preventDefault();
                toggleBallProp(item.getAttribute('data-prop'));
            });
            item.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        document.addEventListener('contextmenu', (e) => {
            const target = e.target;
            if (target && target.classList && target.classList.contains('ball')) {
                e.preventDefault();
                e.stopPropagation();
                showBallContextMenu(target, e.clientX, e.clientY);
            } else {
                if (ballContextMenu.classList.contains('show')) {
                    hideBallContextMenu();
                }
            }
        });

        document.addEventListener('mousedown', (e) => {
            if (!ballContextMenu.classList.contains('show')) return;
            if (ballContextMenu.contains(e.target)) return;
            hideBallContextMenu();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') hideBallContextMenu();
        });

        /* ============================================================
           第八部分：删除 / 新建 / 拖拽 / 方向感应
           ============================================================ */
        function deleteBall(ballElement) {
            const id = ballElement.id;
            const pIndex = physics.findIndex(p => p.id === id);
            if (pIndex === -1) return;
            const p = physics[pIndex];

            const isLiquid = ballElement.classList.contains('ball-liquid');
            const type = isLiquid ? 'liquid' : 'frosted';

            // p.x / p.y 是球心
            const x = p.x, y = p.y, vx = p.vx, vy = p.vy;
            const originalRadius = p.radius;

            physics.splice(pIndex, 1);
            ballElement.remove();

            const fragmentCount = 4 + Math.floor(Math.random() * 3);
            for (let i = 0; i < fragmentCount; i++) {
                const fragRadius = originalRadius * (0.2 + Math.random() * 0.2);
                const angle = Math.random() * Math.PI * 2;
                const dist = originalRadius * 0.5 * Math.random();
                // 碎片球心
                const fragX = x + Math.cos(angle) * dist;
                const fragY = y + Math.sin(angle) * dist;
                const fragVx = vx + (Math.random() - 0.5) * 240;
                const fragVy = vy + (Math.random() - 0.5) * 240 - 120;
                const fragId = 'frag_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
                const fragDiv = document.createElement('div');
                fragDiv.className = `ball ball-${type}`;
                fragDiv.id = fragId;
                fragDiv.setAttribute('data-frag', '1');
                fragDiv.style.width = (fragRadius * 2) + 'px';
                fragDiv.style.height = (fragRadius * 2) + 'px';
                fragDiv.style.left = (fragX - fragRadius) + 'px';
                fragDiv.style.top = (fragY - fragRadius) + 'px';
                document.body.appendChild(fragDiv);

                physics.push(Object.assign({
                    x: fragX, y: fragY,   // 球心
                    vx: fragVx, vy: fragVy,
                    radius: fragRadius,
                    dragging: false,
                    mass: 0.3,
                    id: fragId,
                    lastMouseX: 0, lastMouseY: 0, lastMouseTime: 0,
                    dragOffsetX: 0, dragOffsetY: 0,
                    touchId: null
                }, createDefaultProps()));

                setTimeout(() => {
                    const idx = physics.findIndex(fp => fp.id === fragId);
                    if (idx !== -1) physics.splice(idx, 1);
                    const fragElem = document.getElementById(fragId);
                    if (fragElem) fragElem.remove();
                }, 2000);
            }
        }

        function createNewBall(type) {
            const id = 'ball_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
            const ballDiv = document.createElement('div');
            ballDiv.className = `ball ball-${type}`;
            ballDiv.id = id;
            document.body.appendChild(ballDiv);

            const rect = ballDiv.getBoundingClientRect();
            const ballSize = rect.width || (window.innerWidth < 680 ? 60 : 80);
            const maxLeft = window.innerWidth - ballSize;
            const left = Math.random() * Math.max(maxLeft, 1);   // 左上角
            const top = -100;                                     // 左上角（屏幕外）

            ballDiv.style.left = left + 'px';
            ballDiv.style.top = top + 'px';

            const radius = ballSize / 2;
            physics.push(Object.assign({
                x: left + radius,   // 球心
                y: top + radius,    // 球心
                vx: (Math.random() - 0.5) * 120,
                vy: Math.random() * 120,
                radius: radius,
                dragging: false,
                mass: 1,
                id: id,
                lastMouseX: 0, lastMouseY: 0, lastMouseTime: 0,
                dragOffsetX: 0, dragOffsetY: 0,
                touchId: null
            }, createDefaultProps()));

            if (type === 'liquid') {
                requestAnimationFrame(buildBallRefraction);
            }
        }

        function getPointerEvent(e) {
            if (e.touches) return e.touches[0];
            return e;
        }

        function handlePointerStart(e) {
            const target = e.target;
            if (!target.classList.contains('ball')) return;
            if (e.button === 2) return;
            e.preventDefault();

            if (deleteMode) {
                deleteBall(target);
                return;
            }

            const pointer = getPointerEvent(e);
            const id = target.id;
            const p = physics.find(p => p.id === id);
            if (!p) return;
            if (p.dragging) return;

            p.dragging = true;
            target.style.cursor = 'grabbing';

            if (e.touches) {
                p.touchId = e.touches[0].identifier;
            }

            const rect = target.getBoundingClientRect();
            // dragOffset 是鼠标相对元素左上角的偏移（不变）
            p.dragOffsetX = pointer.clientX - rect.left;
            p.dragOffsetY = pointer.clientY - rect.top;

            p.lastMouseX = pointer.clientX;
            p.lastMouseY = pointer.clientY;
            p.lastMouseTime = performance.now();

            p.vx = 0;
            p.vy = 0;
        }

        function handlePointerMove(e) {
            e.preventDefault();
            const pointer = getPointerEvent(e);
            physics.forEach(p => {
                if (!p.dragging) return;

                if (e.touches && p.touchId !== undefined) {
                    let matchedTouch = null;
                    for (let i = 0; i < e.touches.length; i++) {
                        if (e.touches[i].identifier === p.touchId) {
                            matchedTouch = e.touches[i];
                            break;
                        }
                    }
                    if (!matchedTouch) return;
                    const ball = document.getElementById(p.id);
                    if (!ball) return;

                    let newLeft = matchedTouch.clientX - p.dragOffsetX;   // 左上角
                    let newTop = matchedTouch.clientY - p.dragOffsetY;

                    const ballSize = ball.offsetWidth;
                    const maxLeft = window.innerWidth - ballSize;
                    const maxTop = window.innerHeight - ballSize;
                    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                    newTop = Math.max(0, Math.min(newTop, maxTop));

                    // 更新球心
                    p.x = newLeft + p.radius;
                    p.y = newTop + p.radius;
                    ball.style.left = newLeft + 'px';
                    ball.style.top = newTop + 'px';

                    if (!p.fixed) {
                        const now = performance.now();
                        const dtMs = now - p.lastMouseTime;
                        if (dtMs > 5) {
                            p.vx = (matchedTouch.clientX - p.lastMouseX) / dtMs * DRAG_VELOCITY_SCALE;
                            p.vy = (matchedTouch.clientY - p.lastMouseY) / dtMs * DRAG_VELOCITY_SCALE;
                            p.lastMouseX = matchedTouch.clientX;
                            p.lastMouseY = matchedTouch.clientY;
                            p.lastMouseTime = now;
                        }
                    }
                } else if (!e.touches) {
                    const ball = document.getElementById(p.id);
                    if (!ball) return;

                    let newLeft = pointer.clientX - p.dragOffsetX;
                    let newTop = pointer.clientY - p.dragOffsetY;

                    const ballSize = ball.offsetWidth;
                    const maxLeft = window.innerWidth - ballSize;
                    const maxTop = window.innerHeight - ballSize;
                    newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                    newTop = Math.max(0, Math.min(newTop, maxTop));

                    p.x = newLeft + p.radius;
                    p.y = newTop + p.radius;
                    ball.style.left = newLeft + 'px';
                    ball.style.top = newTop + 'px';

                    if (!p.fixed) {
                        const now = performance.now();
                        const dtMs = now - p.lastMouseTime;
                        if (dtMs > 5) {
                            p.vx = (pointer.clientX - p.lastMouseX) / dtMs * DRAG_VELOCITY_SCALE;
                            p.vy = (pointer.clientY - p.lastMouseY) / dtMs * DRAG_VELOCITY_SCALE;
                            p.lastMouseX = pointer.clientX;
                            p.lastMouseY = pointer.clientY;
                            p.lastMouseTime = now;
                        }
                    }
                }
            });
        }

        function handlePointerEnd(e) {
            const clampSpeed = (p) => {
                if (Math.abs(p.vx) > DRAG_MAX_SPEED) p.vx = (p.vx > 0 ? DRAG_MAX_SPEED : -DRAG_MAX_SPEED);
                if (Math.abs(p.vy) > DRAG_MAX_SPEED) p.vy = (p.vy > 0 ? DRAG_MAX_SPEED : -DRAG_MAX_SPEED);
            };

            if (e.touches) {
                physics.forEach(p => {
                    if (p.dragging && p.touchId !== undefined) {
                        let stillExists = false;
                        for (let i = 0; i < e.touches.length; i++) {
                            if (e.touches[i].identifier === p.touchId) {
                                stillExists = true;
                                break;
                            }
                        }
                        if (!stillExists) {
                            p.dragging = false;
                            p.touchId = undefined;
                            const ball = document.getElementById(p.id);
                            if (ball) ball.style.cursor = 'grab';
                            if (!p.fixed) clampSpeed(p);
                        }
                    }
                });
            } else {
                physics.forEach(p => {
                    if (p.dragging) {
                        p.dragging = false;
                        const ball = document.getElementById(p.id);
                        if (ball) ball.style.cursor = 'grab';
                        if (!p.fixed) clampSpeed(p);
                    }
                });
            }
        }

        function handleOrientation(event) {
            let beta = event.beta;
            let gamma = event.gamma;
            if (beta === null || gamma === null) return;
            const maxAngle = 60;
            let x = gamma / maxAngle;
            let y = beta / maxAngle;
            x = Math.max(-1, Math.min(1, x));
            y = Math.max(-1, Math.min(1, y));
            gravityX = x * BASE_GRAVITY * GRAVITY_SENSITIVITY;
            gravityY = BASE_GRAVITY + y * BASE_GRAVITY * GRAVITY_SENSITIVITY;
        }

        function requestDeviceOrientation() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    })
                    .catch(() => {});
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        function enableOrientationOnUserGesture() {
            requestDeviceOrientation();
            document.removeEventListener('touchstart', enableOrientationOnUserGesture);
            document.removeEventListener('click', enableOrientationOnUserGesture);
        }

        /* ============================================================
           第九部分：管理面板按钮行为
           ============================================================ */
        const deleteModeBtn = document.getElementById('deleteModeBtn');
        const addLiquidBtn = document.getElementById('addLiquidBtn');
        const addFrostedBtn = document.getElementById('addFrostedBtn');

        deleteModeBtn.addEventListener('click', () => {
            deleteMode = !deleteMode;
            deleteModeBtn.classList.toggle('active', deleteMode);
            if (deleteMode) {
                document.body.classList.add('delete-mode');
            } else {
                document.body.classList.remove('delete-mode');
            }
        });

        addLiquidBtn.addEventListener('click', () => createNewBall('liquid'));
        addFrostedBtn.addEventListener('click', () => createNewBall('frosted'));

        /* ============================================================
           第十部分：星空 + 流星雨
           ============================================================ */
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];
        const STAR_COUNT = 220;
        let width = 0, height = 0;

        const meteors = [];
        const MAX_METEORS = 3;

        let nextMeteorTime = 0;
        let burstRemaining = 0;
        let nextBurstShotTime = 0;
        let nextBurstCheckTime = 0;

        function scheduleNextMeteor(now) {
            nextMeteorTime = now + 2500 + Math.random() * 5500;
        }
        function scheduleNextBurstShot(now) {
            nextBurstShotTime = now + 200 + Math.random() * 600;
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 2.2 + 0.8,
                    alpha: Math.random() * 0.5 + 0.3,
                    speed: 0.002 + Math.random() * 0.008,
                    offset: Math.random() * Math.PI * 2
                });
            }
        }

        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initStars();
        }

        function spawnMeteor(speedBoost, now) {
            if (meteors.length >= MAX_METEORS) return;

            const baseSpeed = 320 + Math.random() * 420;
            const speed = speedBoost ? baseSpeed * 1.4 : baseSpeed;
            const pad = 120;

            const edge = Math.floor(Math.random() * 4);
            let startX, startY;
            if (edge === 0) { startX = Math.random() * width; startY = -pad; }
            else if (edge === 1) { startX = width + pad; startY = Math.random() * height; }
            else if (edge === 2) { startX = Math.random() * width; startY = height + pad; }
            else { startX = -pad; startY = Math.random() * height; }

            const targetX = width * (0.1 + Math.random() * 0.8);
            const targetY = height * (0.1 + Math.random() * 0.8);
            const dx = targetX - startX;
            const dy = targetY - startY;
            const d = Math.sqrt(dx * dx + dy * dy) || 1;

            const warm = Math.random() < 0.22;
            meteors.push({
                x: startX, y: startY,
                vx: (dx / d) * speed,
                vy: (dy / d) * speed,
                len: 80 + Math.random() * 200,
                width: 0.8 + Math.random() * 1.6,
                bornAt: now,
                fadeIn: 60 + Math.random() * 80,
                hue: warm ? '255, 240, 220' : '198, 224, 255'
            });
        }

        function updateMeteors(now, dtSec) {
            if (now >= nextMeteorTime) {
                spawnMeteor(false, now);
                scheduleNextMeteor(now);
            }

            if (burstRemaining === 0 && now >= nextBurstCheckTime) {
                if (Math.random() < 0.5) {
                    burstRemaining = 2 + Math.floor(Math.random() * 2);
                    nextBurstShotTime = now;
                }
                nextBurstCheckTime = now + 30000 + Math.random() * 60000;
            }
            if (burstRemaining > 0 && now >= nextBurstShotTime) {
                spawnMeteor(true, now);
                burstRemaining--;
                if (burstRemaining > 0) scheduleNextBurstShot(now);
            }

            const pad = 100;
            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                m.x += m.vx * dtSec;
                m.y += m.vy * dtSec;

                const offDist = Math.max(
                    -m.x - pad, m.x - width - pad,
                    -m.y - pad, m.y - height - pad,
                    0
                );
                if (offDist > 320) meteors.splice(i, 1);
            }
        }

        function drawMeteors(now) {
            const pad = 100;
            for (let i = 0; i < meteors.length; i++) {
                const m = meteors[i];

                const d = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
                const ux = m.vx / d;
                const uy = m.vy / d;
                const tailX = m.x - ux * m.len;
                const tailY = m.y - uy * m.len;

                let a = 1;
                const age = now - m.bornAt;
                if (age < m.fadeIn) a = age / m.fadeIn;

                const offDist = Math.max(
                    -m.x - pad, m.x - width - pad,
                    -m.y - pad, m.y - height - pad,
                    0
                );
                a *= 1 - Math.min(1, offDist / 250);
                if (a <= 0.02) continue;

                const grad = ctx.createLinearGradient(m.x, m.y, tailX, tailY);
                grad.addColorStop(0,    'rgba(255, 255, 255, ' + (a * 0.95) + ')');
                grad.addColorStop(0.12, 'rgba(' + m.hue + ', ' + (a * 0.72) + ')');
                grad.addColorStop(0.55, 'rgba(' + m.hue + ', ' + (a * 0.20) + ')');
                grad.addColorStop(1,    'rgba(' + m.hue + ', 0)');

                ctx.save();
                ctx.lineCap = 'round';

                ctx.strokeStyle = grad;
                ctx.globalAlpha = 0.35;
                ctx.lineWidth = m.width * 3.2;
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();

                ctx.globalAlpha = 1;
                ctx.strokeStyle = grad;
                ctx.lineWidth = m.width;
                ctx.beginPath();
                ctx.moveTo(m.x, m.y);
                ctx.lineTo(tailX, tailY);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(m.x, m.y, m.width * 3.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(' + m.hue + ', ' + (a * 0.13) + ')';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(m.x, m.y, m.width * 0.9, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (a * 0.92) + ')';
                ctx.fill();

                ctx.restore();
            }
        }

        let lastFrameTime = 0;

        function renderLoop(now) {
            if (!ctx) return;

            if (lastFrameTime === 0) lastFrameTime = now;
            const dt = Math.min(now - lastFrameTime, 100);
            lastFrameTime = now;
            const dtSec = dt / 1000;

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = '#03050b';
            ctx.fillRect(0, 0, width, height);

            const nowSec = now / 1000;
            for (let i = 0; i < stars.length; i++) {
                const star = stars[i];
                const twinkle = 0.5 + 0.5 * Math.sin(nowSec * star.speed * 2.5 + star.offset);
                const alpha = Math.min(star.alpha * (0.6 + twinkle * 0.5), 0.95);

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(225, 235, 255, ' + alpha + ')';
                ctx.fill();

                if (star.radius > 1.5 && twinkle > 0.7) {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius * 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(180, 210, 255, ' + (alpha * 0.2) + ')';
                    ctx.fill();
                }
            }

            updateMeteors(now, dtSec);
            drawMeteors(now);

            requestAnimationFrame(renderLoop);
        }

        /* ============================================================
           第十一部分：启动 & 自适应重建
           ============================================================ */
        let lastSignature = '';
        let rebuildTimer = null;

        function measureAndBuild(force) {
            const btns = gridContainer.querySelectorAll('.liquid-btn');
            let sig = '';
            for (let i = 0; i < btns.length; i++) {
                sig += btns[i].offsetWidth + 'x' + btns[i].offsetHeight + '|';
            }
            if (!force && sig === lastSignature) return;
            lastSignature = sig;
            buildLiquidGlass();
        }

        function scheduleRebuild() {
            clearTimeout(rebuildTimer);
            rebuildTimer = setTimeout(function () {
                measureAndBuild(true);
            }, 60);
        }

        function handleResize() {
            resizeCanvas();
            updateButtonRects();
            physics.forEach(p => {
                const ball = document.getElementById(p.id);
                if (!ball) return;
                const ballSize = ball.offsetWidth || p.radius * 2;
                p.radius = ballSize / 2;
                // 球心约束在 [r, W-r] 内
                p.x = Math.max(p.radius, Math.min(p.x, window.innerWidth  - p.radius));
                p.y = Math.max(p.radius, Math.min(p.y, window.innerHeight - p.radius));
                syncBallDom(ball, p);
            });
            requestAnimationFrame(buildBallRefraction);
            scheduleRebuild();
            if (ballContextMenu.classList.contains('show')) {
                hideBallContextMenu();
            }
        }

        function init() {
            window.addEventListener('resize', handleResize);

            if (typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(scheduleRebuild);
                ro.observe(gridContainer);
            }

            resizeCanvas();

            const t0 = performance.now();
            nextMeteorTime = t0 + 1000 + Math.random() * 2000;
            nextBurstCheckTime = t0 + 30000 + Math.random() * 30000;

            requestAnimationFrame(renderLoop);

            buildButtons();

            initBallPositions();
            updateButtonRects();
            requestAnimationFrame(function () {
                initPhysics();
                buildBallRefraction();
                requestAnimationFrame(animatePhysics);
            });

            document.addEventListener('mousedown', handlePointerStart);
            document.addEventListener('touchstart', handlePointerStart, { passive: false });
            document.addEventListener('mousemove', handlePointerMove);
            document.addEventListener('touchmove', handlePointerMove, { passive: false });
            document.addEventListener('mouseup', handlePointerEnd);
            document.addEventListener('touchend', handlePointerEnd);
            document.addEventListener('touchcancel', handlePointerEnd);
            document.addEventListener('dragstart', (e) => {
                if (e.target.classList.contains('ball')) e.preventDefault();
            });

            document.addEventListener('touchstart', enableOrientationOnUserGesture);
            document.addEventListener('click', enableOrientationOnUserGesture);

            const supportsBD = !!(window.CSS && window.CSS.supports) &&
                (window.CSS.supports('backdrop-filter', 'blur(2px)') ||
                 window.CSS.supports('-webkit-backdrop-filter', 'blur(2px)'));
            if (!supportsBD) document.body.classList.add('no-glass');

            const titleElement = document.querySelector('.main-title');
            if (titleElement) {
                document.addEventListener('mousemove', function (e) {
                    const x = e.clientX / window.innerWidth;
                    const y = e.clientY / window.innerHeight;
                    const glowX = (x * 30) - 15;
                    const glowY = (y * 20) - 10;
                    titleElement.style.textShadow =
                        (glowX * 0.3) + 'px ' + (glowY * 0.2) + 'px 25px rgba(100, 180, 255, 0.6)';
                }, { passive: true });
            }

            ensureSVG();
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    measureAndBuild(true);
                });
            });
            window.addEventListener('load', function () {
                setTimeout(function () { measureAndBuild(true); }, 60);
            });
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () {
                    setTimeout(function () { measureAndBuild(true); }, 60);
                });
            }

            console.log('✨ 星星的网页已启动 | 球心坐标统一 + 胶囊碰撞箱 ✨');
        }

        init();
    })();
    </script>
</body>
